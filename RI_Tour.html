<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로보틱스연구소 투어 가이드</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink: #2C3E50;
    --ink-2: #21303E;
    --paper: #F3F5F7;
    --paper-2: #E1E7EC;
    --plan-bg: #EAEEF2;
    --line: #5C7A96;
    --amber: #3E6E94;
    --amber-soft: rgba(62,110,148,0.15);
    --text: #202B36;
    --muted: #64758A;
    --muted-2: #9AA8B8;
    --danger: #A8493F;
    --radius: 6px;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  #app{
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--paper-2);
    margin-bottom: 18px;
  }
  .brand{
    display:flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand h1{
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .brand .tag{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--paper-2);
    padding: 3px 8px;
    border-radius: 999px;
  }

  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items:center;
  }

  .segmented{
    display:flex;
    background: var(--paper-2);
    border-radius: var(--radius);
    padding: 3px;
    gap: 2px;
  }
  .segmented button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border:none;
    background: transparent;
    color: var(--muted);
    padding: 7px 12px;
    border-radius: 4px;
    cursor:pointer;
    white-space: nowrap;
  }
  .segmented button.active{
    background: var(--ink);
    color: #fff;
  }
  .segmented.mini{ padding:2px; }
  .segmented.mini button{
    font-size: 10.5px;
    padding: 4px 8px;
  }
  .segmented.mini button.active{ background: var(--amber); color:#fff; }

  .toggle-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--paper-2);
    background: #fff;
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .toggle-btn.on{
    background: var(--amber-soft);
    border-color: var(--amber);
    color: #1F3B54;
  }
  .toggle-btn:hover{ border-color: var(--line); }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--muted-2);
  }
  .toggle-btn.on .dot{ background: var(--amber); }

  /* ---------- Floorplan ---------- */
  .floorplan-card{
    background: var(--plan-bg);
    border: 1px solid #D6DEE6;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(27,36,48,0.08), 0 1px 0 rgba(255,255,255,0.6) inset;
  }
  .floorplan-toolbar{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .route-notice{
    background: var(--amber-soft);
    border: 1px solid var(--amber);
    color: var(--danger);
    font-weight: 600;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 10px 14px;
    border-radius: 8px;
    margin: 0 0 18px;
  }

  .floorplan-shell{
    position:relative;
    width:100%;
    aspect-ratio: 860 / 520;
  }
  .floorplan-shell svg{
    width:100%;
    height:100%;
    display:block;
  }
  .floorplan-shell svg .tour-room{
    cursor:pointer;
  }
  .floorplan-shell svg .tour-room rect{
    transition: stroke-width .15s, filter .15s, opacity .15s;
  }
  .floorplan-shell svg .tour-room:hover rect{
    filter: brightness(0.96);
  }
  .floorplan-shell svg .tour-room.room-active rect{
    stroke: var(--amber) !important;
    stroke-width: 3px !important;
    filter: drop-shadow(0 0 5px rgba(62,110,148,0.55));
  }
  .floorplan-shell svg .tour-room.room-selected rect{
    stroke: var(--amber) !important;
    stroke-width: 2.5px !important;
    filter: drop-shadow(0 0 4px rgba(62,110,148,0.4));
  }

  .badge-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .order-badge-float{
    position:absolute;
    width: 20px;
    height: 20px;
    margin-left: -10px;
    margin-top: -10px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid #fff;
    color:#fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  .floorplan-caption{
    font-size: 11.5px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin: 10px 2px 20px;
  }

  /* ---------- Body layout ---------- */
  .layout{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
    align-items:start;
  }
  @media (max-width: 820px){
    .layout{ grid-template-columns: 1fr; }
  }

  .panel{
    background: #fff;
    border: 1px solid var(--paper-2);
    border-radius: 10px;
    padding: 18px;
  }

  .panel h2{
    font-size: 13px;
    margin: 0 0 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* sequence list */
  .seq-empty{
    font-size: 13px;
    color: var(--muted-2);
    line-height: 1.6;
    padding: 8px 0 4px;
  }
  .seq-total{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    margin: 2px 0 2px;
  }
  .seq-total-label{
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .seq-list{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .seq-item{
    padding: 8px 10px;
    background: var(--paper);
    border-radius: 6px;
    font-size: 13px;
  }
  .seq-item .row1{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .seq-item .num{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #fff;
    background: var(--ink);
    width:20px; height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .seq-item .label{
    flex:1;
    line-height:1.3;
  }
  .seq-item .remove{
    border:none;
    background:transparent;
    color: var(--muted-2);
    cursor:pointer;
    font-size: 15px;
    line-height:1;
    padding: 2px 4px;
  }
  .seq-item .remove:hover{ color: var(--danger); }
  .seq-item .row2{
    margin-top: 6px;
    display:flex;
    justify-content:flex-end;
  }
  .seq-item[draggable="true"]{ cursor: grab; }
  .seq-item.dragging{ opacity: 0.45; }
  .seq-item.drag-over-top{ box-shadow: inset 0 2px 0 var(--amber); }
  .seq-item.drag-over-bottom{ box-shadow: inset 0 -2px 0 var(--amber); }
  .seq-item .handle{
    color: var(--muted-2);
    font-size: 12px;
    margin-right: 2px;
    cursor: grab;
    flex-shrink:0;
  }

  .clear-btn{
    margin-top: 14px;
    width:100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: var(--paper);
    border: 1px solid var(--paper-2);
    color: var(--muted);
    padding: 8px;
    border-radius: 6px;
    cursor:pointer;
  }
  .clear-btn:hover{ border-color: var(--danger); color: var(--danger); }

  .stationlist{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--paper-2);
  }
  .stationlist ul{
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap:2px;
  }
  .stationlist li button{
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 12.5px;
    color: var(--text);
    cursor:pointer;
    display:flex;
    gap:8px;
  }
  .stationlist li button:hover{ background: var(--paper); }
  .stationlist li button.active-station{ background: var(--amber-soft); font-weight:600; }
  .stationlist li button .n{
    font-family:'IBM Plex Mono', monospace;
    color: var(--muted);
    flex-shrink:0;
    width: 18px;
  }

  /* script panel */
  .script-panel{
    min-height: 420px;
  }
  .script-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap:wrap;
  }
  .script-head h2{
    font-size: 18px;
    color: var(--text);
    margin:0;
    font-weight:700;
    letter-spacing: -0.01em;
  }
  .script-time-row{
    display:flex;
    align-items:center;
    gap: 10px;
    flex-wrap:wrap;
  }
  .script-time{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space:nowrap;
  }
  .script-body{
    max-width: 74ch;
  }
  .script-body p{
    font-size: 15px;
    line-height: 1.85;
    margin: 0 0 16px;
    color: #212B36;
  }
  .script-divider{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: 28px 0 16px;
    flex-wrap:wrap;
  }
  .script-divider:first-child{ margin-top: 0; }
  .script-divider .line{
    flex:1;
    height:1px;
    background: var(--paper-2);
    min-width: 20px;
  }
  .script-divider .lab{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space:nowrap;
  }
  .empty-state{
    color: var(--muted-2);
    font-size: 13.5px;
    line-height: 1.7;
    padding: 40px 0;
    text-align:center;
  }

  .edit-request-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    border: 1px solid var(--paper-2);
    background: #fff;
    color: var(--line);
    padding: 5px 10px;
    border-radius: 999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .edit-request-btn:hover{ border-color: var(--line); background: rgba(62,107,156,0.07); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(18,33,59,0.55);
    align-items:center;
    justify-content:center;
    z-index: 50;
    padding: 24px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background: #fff;
    border-radius: 10px;
    width: 100%;
    max-width: 620px;
    max-height: 88vh;
    display:flex;
    flex-direction:column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-small{ max-width: 480px; }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--paper-2);
    flex-shrink:0;
  }
  .modal-head h3{
    margin:0;
    font-size: 15px;
    font-weight:700;
  }
  .modal-close{
    border:none;
    background:transparent;
    font-size: 20px;
    line-height:1;
    color: var(--muted);
    cursor:pointer;
    padding: 2px 4px;
  }
  .modal-close:hover{ color: var(--danger); }
  .modal-body{
    padding: 18px 20px;
    overflow-y:auto;
    flex: 1 1 auto;
  }
  .modal-foot{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--paper-2);
    flex-shrink:0;
  }
  .field-row{
    margin-bottom: 14px;
  }
  .field-row label{
    display:block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .field-hint{
    font-size: 11.5px;
    color: var(--muted-2);
    margin: -2px 0 6px;
    line-height:1.5;
  }
  .text-input, .text-area{
    width:100%;
    border: 1px solid var(--paper-2);
    border-radius: 6px;
    padding: 9px 11px;
    font-size: 13.5px;
    font-family: 'Pretendard', sans-serif;
    color: var(--text);
    background: var(--paper);
  }
  .text-input:focus, .text-area:focus{
    outline: none;
    border-color: var(--line);
    background: #fff;
  }
  .text-area{
    min-height: 130px;
    line-height: 1.6;
    resize: vertical;
  }
  .text-area.small{ min-height: 70px; }
  .status-msg{
    font-size: 12.5px;
    margin-top: 4px;
    min-height: 16px;
  }
  .status-msg.ok{ color: #2E7D4F; }
  .status-msg.err{ color: var(--danger); }
  .cfg-help{
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 16px;
  }
  .usage-section{
    margin-bottom: 18px;
  }
  .usage-section:last-child{ margin-bottom: 0; }
  .usage-section h4{
    font-size: 13.5px;
    margin: 0 0 6px;
    color: var(--ink);
    font-weight: 700;
  }
  .usage-section p{
    font-size: 13px;
    line-height: 1.7;
    color: #3A4452;
    margin: 0;
  }
  .btn-secondary, .btn-primary{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 9px 16px;
    border-radius: 6px;
    cursor:pointer;
  }
  .btn-secondary{
    border: 1px solid var(--paper-2);
    background: #fff;
    color: var(--muted);
  }
  .btn-secondary:hover{ border-color: var(--muted); }
  .btn-primary{
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
  }
  .btn-primary:hover{ background: var(--ink-2); }
  .btn-primary:disabled{
    opacity:0.5;
    cursor:default;
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <h1 id="titleText">로보틱스연구소 투어 가이드</h1>
      <span class="tag mono" id="subTag">0–13</span>
      <button class="toggle-btn" id="usageBtn"><span class="dot"></span><span id="usageBtnLabel">사용 안내</span></button>
    </div>
    <div class="controls">
      <button class="toggle-btn" id="intro5Btn" type="button">5분 소개</button>
       <div class="segmented" id="lengthSeg"></div>
      <div class="segmented" id="langSeg"></div>
      <button class="toggle-btn" id="combineBtn"><span class="dot"></span><span>동선 구성</span></button>
    </div>
  </div>

  <section id="intro5Panel" class="panel" style="display:none; margin-bottom:18px; max-width:960px"><div class="script-head"><h2 id="intro5Title">5분 연구소 소개 · 실험실 내부 관람 없음</h2><button class="toggle-btn" id="intro5Copy">대본 복사</button></div><div id="intro5Body" class="script-body"></div></section>
   <div class="floorplan-card" id="mainFloorplan">
    <div class="floorplan-toolbar">
      <button class="toggle-btn" id="selectAllBtn"><span class="dot"></span><span id="selectAllLabel">전체 선택</span></button>
      <button class="toggle-btn" id="resetSeqBtn"><span class="dot"></span><span id="resetSeqLabel">초기화</span></button>
    </div>
    <div class="floorplan-shell" id="floorplanShell">
      <svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 860 520" role="img" style=""><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">로보틱스 연구소 투어 동선 평면도 (Opening/Closing 라벨 간결화)</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">연구소 평면. 왼쪽 전체 높이가 사무 공간이며 오른쪽 경계는 직선이다. 10, 9, 8이 여백을 두고 있고 아래에 1, 2, 3이 있다. 세 개의 열(6/7 위아래 분할, 5, 4)이 오른쪽 벽에 붙어있다. 11과 12는 사무 공간 경계선에 바로 붙어있고 12 오른쪽에 13번 Closing 박스가 오렌지 톤으로 있다. 하단 오른쪽에 출입구, 그 앞에 0번 Opening 박스도 오렌지 톤이다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>

<rect x="40" y="60" width="740" height="320" rx="4" fill="none" stroke="var(--b)" stroke-width="2" style="fill:none;stroke:color(srgb 0.0431373 0.0431373 0.0431373 / 0.2);color:rgb(11, 11, 11);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" />

<g style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="48" y="68" width="254" height="304" rx="6" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);color:rgb(11, 11, 11);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" />
<text x="175" y="210" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">사무 공간 (Office)</text>

<script type="application/json" id="tour-data">{"stations": [{"ko": "입구", "en": "Entrance"}, {"ko": "유연한 분절형 로봇 (안성훈 교수)", "en": "Flexible Segmented Robot (Prof. Ahn Seung-hoon)"}, {"ko": "원격조작으로 가르치는 로봇 학습 (박종우 교수)", "en": "Teaching Robots via Remote Control (Prof. Park Jong-woo)"}, {"ko": "힘과 손동작을 읽는 센서 (박용래 교수)", "en": "Sensors for Force & Hand Motion (Prof. Park Yong-rae)"}, {"ko": "웨어러블 로봇 (조규진 교수)", "en": "Wearable Robots (Prof. Cho Kyu-jin)"}, {"ko": "데이터 캡처 공용 공간", "en": "Shared Space — Data Capture"}, {"ko": "Morphic · 생체모사와 오리가미 (조규진 교수)", "en": "Morphic — Biomimetic & Origami Robots (Prof. Cho Kyu-jin)"}, {"ko": "로봇 핸드와 그리퍼 (조규진 교수)", "en": "Robot Hands & Grippers (Prof. Cho Kyu-jin)"}, {"ko": "시뮬레이션 기반 로봇 학습 (이동준 교수)", "en": "Simulation-Based Robot Learning (Prof. Lee Dong-jun)"}, {"ko": "로봇 비전과 투명물체 인식 (김아영 교수)", "en": "Robot Vision & Transparent-Object Recognition (Prof. Kim Ah-young)"}, {"ko": "이동식 전개형 3D 프린팅 로봇 (조규진 교수)", "en": "Deployable Mobile 3D-Printing Robot (Prof. Cho Kyu-jin)"}, {"ko": "실사 공간의 3차원 재구성 (임종우 교수)", "en": "3D Reconstruction of Real Spaces (Prof. Lim Jong-woo)"}, {"ko": "휴머노이드 로봇 제어와 실제 실험 (이동준 교수)", "en": "Humanoid Robot Control & Experiments (Prof. Lee Dong-jun)"}, {"ko": "마무리", "en": "Closing"}], "scripts": {"long": {"ko": ["안녕하세요. 오늘 서울대학교 로보틱스연구소 투어를 안내해 드릴 ○○○입니다. 저는 연구소에서 ○○○ 업무를 맡고 있고요. 먼저 연구소를 간단히 소개해 드리고, 안쪽으로 이동하면서 이곳에서 진행하는 연구를 하나씩 보여드리겠습니다.\n\n서울대학교 로보틱스연구소는 학교 안의 여러 전공 연구자들이 로봇이라는 공통 주제로 함께 연구하는 곳입니다. 기계공학, 전기·전자, 컴퓨터, 재료 분야뿐 아니라 의학, 보건, 뇌인지과학 등 다양한 분야의 교수님 약 80명이 직간접적으로 참여하고 계십니다. 로봇의 몸체와 소재를 만들고, 센서로 주변을 느끼게 하고, 인공지능으로 판단하고 움직이게 하는 연구까지 폭넓게 이어지고 있습니다.\n\n2026년에는 과학기술정보통신부와 교육부가 추진하는 국가연구소 사업, NRL 2.0에 선정됐습니다. 이 가운데 41명의 교수님이 과제에 직접 참여하고 계시고요. 연간 약 100억 원의 정부 연구비를 바탕으로 최대 10년 동안 연구를 수행하는 사업입니다. 지난 2026년 8월 18일에는 국가연구소 개소식도 열었습니다. 여러 연구실이 축적해 온 기술을 연결해서 로봇의 기초기술부터 실제 현장에 쓰이는 기술까지 함께 발전시키려는 것입니다.\n\n저희가 중요하게 생각하는 방향은 ‘인간 중심의 피지컬 AI’입니다. 조금 쉽게 말씀드리면, 지금의 인공지능이 글이나 사진을 이해하고 답하는 데 익숙하다면, 피지컬 AI는 실제 공간에서 보고, 상황을 판단하고, 로봇의 몸을 움직여 행동하게 하는 기술입니다. 그래서 인공지능만 잘 만들어서는 안 되고, 손과 팔, 센서, 움직임을 만드는 장치까지 함께 연구해야 합니다. 궁극적으로는 사람의 생활과 일을 돕고, 신체 기능을 보조하는 로봇을 만들고자 합니다.\n\n연구소는 이런 연구가 실제 산업으로도 연결되도록 기업과의 공동연구, 기술이전, 창업 지원도 확대하고 있습니다. 뒤쪽에는 새 로보틱스연구소 건물이 들어설 부지를 확보했고 인허가도 마친 상태입니다. 현재 계획으로는 약 2년 뒤 독립된 연구공간으로 이전할 예정입니다. 연구실과 실험시설뿐 아니라 기업과 스타트업이 함께 협력할 수 있는 공간으로 만들어갈 생각입니다.\n\n오늘 보실 것은 여러 연구팀의 연구 가운데 이 공간에 전시된 일부입니다. 부드럽게 움직이는 로봇부터 사람이 가르치는 로봇 학습, 손과 촉각 센서, 몸에 입는 로봇, 물체를 잡는 로봇 손, 가상환경에서의 훈련, 주변을 보는 기술, 접었다 펼치는 3D 프린팅 로봇, 그리고 실제 휴머노이드 실험까지 차례로 살펴보겠습니다.\n\n한 가지 안내 말씀드리겠습니다. 여기는 실제 실험을 진행하는 연구공간이라 장비들이 연구에 사용되고 있습니다. 안전을 위해 직접 만지거나 조작하지는 마시고, 궁금하신 점은 편하게 질문해 주세요. 그럼 이동하겠습니다.", "여기는 기계공학부 안성훈 교수님 연구팀의 로봇입니다. 이 연구팀은 새로운 재료와 구조, 만드는 방법을 함께 연구하면서 기존 로봇과는 다른 움직임을 구현하고 있습니다. 모양을 기억했다가 되돌아오는 금속이나 가볍고 튼튼한 복합재료, 3D 프린팅 같은 기술도 활용하고 있고요. 탄소섬유로 가볍지만 강한 격자구조를 만들어 로봇 팔이나 드론에 적용한 연구도 있습니다.\n\n지금 보시는 로봇은 코끼리 코를 떠올리시면 이해하기 쉽습니다. 보통 산업용 로봇 팔은 정해진 위치의 몇 개 관절을 움직이죠. 그런데 이 로봇은 작은 마디들이 여러 개 이어져 있어서 몸 전체가 유연하게 구부러집니다. 물체의 모양에 맞춰 둘러 감듯이 잡을 수도 있습니다.\n\n핵심은 로봇을 어떤 재료로, 어떤 구조로 만드느냐에 따라 움직일 수 있는 방식 자체가 달라진다는 점입니다. 예를 들어 이 연구팀은 온도나 전기에 반응하는 금속을 직물과 결합해, 천처럼 부드럽지만 스스로 구부러지거나 비틀릴 수 있는 장치도 개발했습니다. 꽃이 피듯이 구조 자체가 움직이는 셈입니다.\n\n공장 안처럼 환경이 일정한 곳에서는 단단한 로봇 팔이 아주 유용합니다. 하지만 사람 주변이나 모양이 제각각인 물체를 다루는 곳에서는 이런 유연함이 장점이 될 수 있습니다. 이 로봇은 ‘로봇의 몸을 얼마나 자유롭게 변형할 수 있을까’라는 질문에서 출발한 사례라고 보시면 됩니다.", "이곳은 기계공학부 박종우 교수님 연구팀입니다. 오랫동안 로봇의 움직임을 계산하고 제어하는 연구를 해왔고, 최근에는 인공지능을 이용해 로봇이 여러 작업을 학습하도록 하는 연구도 진행하고 있습니다.\n\n여기서 중요한 것은 ‘사람이 로봇에게 어떻게 일을 가르칠까’입니다. 사람이 로봇을 원격으로 조작해서 물건을 집고 옮기는 모습을 보여주면, 로봇은 팔이 움직인 경로와 물체를 잡은 위치, 작업 순서 같은 정보를 기록할 수 있습니다. 이렇게 모은 데이터를 학습에 사용하는 방식입니다.\n\n예를 들어 우리는 컵 하나를 들어 옆으로 옮기는 일을 아주 자연스럽게 하죠. 그런데 로봇은 컵의 위치를 확인하고, 어느 방향으로 손을 가져갈지 정하고, 얼마나 힘을 줘서 잡을지, 주변 물체에 부딪히지 않으려면 어떻게 할지까지 알아야 합니다. 사람이 직접 시범을 보이면 이런 복잡한 과정을 데이터로 남길 수 있습니다.\n\n인공지능이 인터넷에서 글이나 사진을 많이 배울 수 있는 것과 달리, 로봇이 실제로 물체를 잡고 움직이는 데이터는 직접 확보해야 하는 경우가 많습니다. 그래서 사람이 로봇을 조작하며 좋은 예시를 만들어주는 일이 중요합니다. 여기서는 로봇에게 행동을 가르치는 방법을 보여드린다고 생각하시면 됩니다.", "여기는 기계공학부 박용래 교수님 연구팀의 센서입니다. 사람의 피부처럼 부드럽게 휘거나 늘어나는 재료로 로봇과 사람의 움직임, 접촉을 측정하는 기술을 연구하고 있습니다.\n\n오늘 보실 것은 크게 두 가지입니다. 하나는 로봇 손끝에 닿는 힘을 읽는 센서이고, 다른 하나는 사람이 손에 끼고 움직이면 손가락의 움직임을 측정하는 장갑입니다. 하나는 로봇이 무엇을 얼마나 세게 만지는지 알려주고, 다른 하나는 사람이 손을 어떻게 움직이는지 알려줍니다.\n\n먼저 손끝 센서를 볼까요. 우리가 종이컵을 잡을 때 너무 약하게 잡으면 떨어뜨리고, 너무 세게 잡으면 찌그러지겠죠. 사람은 손끝 감각으로 힘을 조절합니다. 로봇도 비슷한 감각이 필요합니다. 이 센서는 물체를 누르는 힘뿐 아니라 옆으로 밀리는 힘까지 여러 방향에서 읽어낼 수 있습니다.\n\n옆의 장갑에는 액체금속을 이용한 센서가 들어갑니다. 금속이지만 유연하게 변형될 수 있어서 손가락을 굽히고 펴는 동작을 따라갑니다. 이 정보를 이용하면 손가락 관절이 얼마나 구부러졌는지 알아내고 손동작을 재현할 수 있습니다.\n\n앞에서 보신 박종우 교수님의 연구가 사람이 로봇을 직접 조작해 행동을 가르치는 것이라면, 이 장갑은 사람이 평소처럼 손을 움직이는 모습 자체를 데이터로 만드는 데 도움이 됩니다. 결국 로봇이 실제 세계에서 물건을 잘 다루려면 보는 능력만큼 ‘만지고 느끼는 능력’도 중요합니다.", "이곳은 로보틱스연구소 소장이신 기계공학부 조규진 교수님 연구팀의 웨어러블 로봇입니다. 조규진 교수님 연구팀은 부드러운 로봇, 생물에서 아이디어를 얻은 로봇, 종이접기처럼 모양이 바뀌는 구조 등을 폭넓게 연구하고 있습니다.\n\n웨어러블 로봇은 말 그대로 사람이 몸에 착용하는 로봇입니다. 밖에서 따로 조종하는 로봇과 달리, 사람의 몸에 붙어서 함께 움직이며 필요한 힘을 보태줍니다. 그래서 힘이 세기만 해서는 안 되고, 착용하기 편하고 사람의 움직임을 자연스럽게 따라갈 수 있어야 합니다.\n\n대표적인 사례가 손의 움직임을 보조하는 ‘엑소글러브’입니다. 손을 자유롭게 움직이기 어려운 분이 장갑처럼 착용하면 로봇이 손가락을 움직여 물건을 잡는 데 도움을 줍니다. 부드러운 재료와 힘줄처럼 힘을 전달하는 와이어를 사용합니다. 이후에는 카메라와 인공지능으로 사용자가 무엇을 잡으려는지 파악하고 동작을 돕는 연구도 이어졌습니다.\n\n최근에는 로봇을 ‘잘 움직이게 하는 것’뿐 아니라 ‘혼자서도 쉽게 착용하게 하는 것’도 중요하게 다루고 있습니다. 팔꿈치나 발목을 보조하는 장치에서 여러 고정 부위를 한 번에 조일 수 있도록 만든 연구가 그런 예입니다.\n\n이곳에서는 사람이 움직이려는 의도를 로봇이 읽고, 딱 필요한 순간에 힘을 보태는 모습을 떠올려 보시면 좋겠습니다. 재활이나 일상생활 보조는 물론, 일할 때 몸에 가해지는 부담을 덜어주는 데에도 활용할 수 있습니다. 저희가 이야기하는 인간 중심 피지컬 AI를 아주 가까이에서 보여주는 연구입니다.", "여기는 여러 연구팀이 함께 사용하는 실험공간입니다. 로봇을 만드는 것도 중요하지만, 로봇과 사람이 실제로 어떻게 움직였는지를 정확히 측정하고 기록하는 일도 꼭 필요합니다. 그래서 이곳에서는 카메라와 측정장비를 이용해 움직임을 영상과 데이터로 남깁니다.\n\n예를 들어 사람이 손을 뻗어 컵을 잡았다고 해보겠습니다. 손이 어디서 출발했는지, 어느 방향으로 움직였는지, 언제 손목을 돌렸고 언제 컵을 잡았는지 알아야 로봇에게도 그 행동을 가르칠 수 있겠죠. 반대로 로봇이 목표대로 움직였는지 확인할 때도 이런 측정이 필요합니다.\n\n앞에서 보신 원격조작이나 손동작 센서처럼 사람의 행동을 데이터로 만드는 연구와도 연결됩니다. 이곳의 장비는 한 연구팀만 쓰는 것이 아니라 여러 팀이 함께 활용합니다. 서로 다른 전공의 연구자들이 같은 공간에서 실험하고 결과를 확인할 수 있다는 점도 연구소의 중요한 특징입니다.", "여기도 조규진 교수님 연구팀입니다. 앞에서는 몸에 입는 로봇을 봤다면, 여기서는 생물의 움직임과 종이접기에서 아이디어를 얻어 몸의 형태를 바꾸는 로봇을 소개해 드리겠습니다. 이와 관련한 연구를 ‘모픽(Morphic)’이라고 부릅니다.\n\n자연을 살펴보면 로봇에 응용할 만한 아이디어가 참 많습니다. 소금쟁이는 물 위에서 가라앉지 않고 뛰어오르고, 무당벌레는 날개를 작게 접어두었다가 순식간에 펼칩니다. 조규진 교수님과 김호영 교수님 연구팀은 소금쟁이가 물의 표면을 이용해 뛰는 원리를 작은 로봇으로 구현했고, 이 연구는 2015년 사이언스에 발표됐습니다. 무당벌레 날개에서 아이디어를 얻어 접었다 펼치는 날개를 만들고, 점프한 뒤 날개를 펴서 활강하는 로봇도 개발했습니다.\n\n이런 연구에서 중요한 것은 겉모양을 그대로 흉내 내는 일이 아닙니다. 자연에서 효과적인 움직임의 원리를 찾아 로봇에 적용하는 것이죠. 종이접기도 마찬가지입니다. 작게 접어서 보관하다가 필요할 때 펼치면 크기와 기능이 달라집니다.\n\n실제로 연구팀은 형태를 바꾸면서도 1톤급 차량의 무게를 견딜 수 있는 바퀴를 개발했습니다. 평평한 길에서는 일반 바퀴처럼 쓰고, 장애물이 있을 때는 모양을 바꿔 이동하도록 하는 방식입니다. 또 입을 크게 벌리는 펠리컨장어에서 아이디어를 얻어 작게 접혀 있다가 크게 늘어나는 부드러운 로봇도 만들었습니다.\n\n여기서 보실 핵심은 로봇이 움직이는 방법을 바꾸기 위해 몸의 구조 자체를 새롭게 설계한다는 점입니다. 환경과 목적에 맞춰 로봇의 형태가 바뀌면, 기존에는 하기 어려웠던 일도 가능해질 수 있습니다.", "이곳 역시 조규진 교수님 연구팀인데요. 앞의 모픽이 로봇의 몸과 형태에 관한 연구였다면, 이곳은 로봇이 물건을 실제로 어떻게 잡을지에 초점을 맞춥니다. 사람 손을 닮은 로봇 손과 다양한 모양의 집게 장치를 연구하고 있습니다.\n\n먼저 이 로봇 손은 와이어로 손가락을 움직입니다. 우리 손도 근육이 만든 힘을 힘줄을 통해 전달해 손가락 관절을 움직이죠. 로봇도 비슷하게 모터의 힘을 와이어로 전달할 수 있습니다. 손가락 마디마다 모터를 넣으면 무겁고 커지기 쉬운데, 와이어를 활용하면 손을 상대적으로 작고 가볍게 만들면서 물건을 잡을 힘을 전달할 수 있습니다.\n\n그런데 로봇 손을 만드는 데에는 또 다른 어려움이 있습니다. 컵을 잡을 때, 동전을 집을 때, 깨지기 쉬운 물건을 들 때 모두 손가락 모양과 힘이 달라야 하죠. 손가락을 많이 움직이게 만드는 것만큼 상황에 맞게 정확히 쓰는 일이 중요합니다. 앞에서 보신 촉각 센서나 로봇 학습기술이 이 부분과 연결됩니다.\n\n조금 색다른 연구도 있습니다. ‘모그립(MOGrip)’이라는 장치인데요. 물건 하나를 집을 때마다 목적지까지 왕복하는 대신, 여러 물건을 하나씩 집어서 손 안에 모아두고 한 번에 운반합니다. 2024년 사이언스 로보틱스에 발표된 연구로, 물류나 제조현장에서 로봇의 이동시간을 줄이는 방향으로 활용할 수 있습니다.\n\n이 밖에도 와이어 방식과 다른 움직임 방식을 조합하는 로봇 손 연구가 진행되고 있습니다. 현대모비스와 관련된 초기 연구도 포함되어 있는데, 공개되지 않은 세부 내용은 설명하지 않고 있습니다. 옆의 종이접기 구조물도 보실 수 있는데요. 앞에서 설명드린 모양 변화 기술이 여러 로봇 부품으로 확장되는 사례입니다.\n\n결국 이곳은 ‘로봇이 어떻게 다양한 물건을 사람처럼 집고 다룰 수 있을까’를 연구하는 곳입니다. 인공지능이 물체를 알아보고 잡을 것을 결정하더라도 마지막으로 물건에 닿는 것은 로봇의 손이니까요.", "이곳은 기계공학부 이동준 교수님 연구팀의 로봇 학습 연구입니다. 이 연구팀은 로봇이 움직이는 원리와 제어, 물체를 다루는 기술, 가상환경을 이용한 실험 등을 폭넓게 연구하고 있습니다. 여기서는 특히 실제 로봇을 움직이기 전에 컴퓨터 안에서 충분히 연습시키는 방법을 보실 수 있습니다.\n\n화면 속에 로봇과 물체, 주변 환경을 만들어두고 같은 작업을 여러 번 반복합니다. 예를 들어 접시를 원하는 위치로 밀어 옮겨야 한다면, 로봇이 어디를 밀지, 어느 방향으로 밀지, 얼마만큼 힘을 줄지를 계속 바꿔가며 연습하는 겁니다. 잘된 행동에는 좋은 점수를, 잘 안 된 행동에는 낮은 점수를 주면서 점차 성공하는 방법을 찾아갑니다. 이런 방법을 ‘강화학습’이라고 합니다.\n\n가상환경에서 연습하면 실제 장비로 매번 실험하는 것보다 훨씬 다양한 상황을 반복해 볼 수 있습니다. 물체의 위치나 로봇의 자세를 바꾸고, 성공과 실패를 계속 기록할 수 있죠. 다만 가상환경이 현실과 너무 다르면 배운 동작이 실제 로봇에서는 잘되지 않을 수 있습니다. 그래서 물체를 건드렸을 때 얼마나 움직이고, 미끄러지고, 부딪히는지까지 현실에 가깝게 계산하는 일이 중요합니다. 이동준 교수님 연구팀이 이런 계산 기술도 함께 연구하고 있습니다.\n\n앞에서 박종우 교수님 연구는 사람이 로봇에게 직접 시범을 보여주는 방식이었죠. 이곳은 로봇이 컴퓨터 안에서 스스로 수없이 시도해 보게 하는 방식입니다. 둘 다 로봇이 행동을 배우는 데 도움이 됩니다.\n\n조금 뒤에는 이 연구팀에서 실제로 실험하는 휴머노이드 로봇도 보실 겁니다. 여기에서 컴퓨터로 연습한 움직임을 실제 로봇에서 어떻게 구현하는지 이어서 설명드리겠습니다. 이곳은 로봇이 현실로 나오기 전에 연습하는 ‘가상 훈련장’이라고 생각하시면 됩니다.", "여기는 기계공학부 김아영 교수님 연구팀입니다. 로봇이 카메라와 센서를 이용해 주변을 보고, 물체와 자신의 위치를 알아낸 뒤 스스로 움직이고 작업하도록 하는 기술을 연구하고 있습니다.\n\n사람은 테이블 위에 컵과 병이 놓여 있으면 바로 구분하고 원하는 물건을 집을 수 있죠. 하지만 로봇은 먼저 화면에서 물체를 찾아야 하고, 정확히 어디에 놓였는지, 어느 방향으로 놓였는지, 손을 어느 쪽에서 가져가야 할지 차례대로 판단해야 합니다.\n\n특히 까다로운 것이 유리컵이나 투명 플라스틱 통입니다. 투명한 물체는 빛이 통과하거나 반사되기 때문에 카메라로 모양과 거리를 정확히 알아내기가 쉽지 않습니다. 배경과 조명에 따라서도 다르게 보이고요. 연구팀은 이런 투명물체를 인식하고 정확한 위치를 파악해 로봇이 실제로 집도록 하는 기술을 개발하고 있습니다.\n\n이를 위해 ‘TRansPose’라는 대규모 데이터도 만들었습니다. 투명한 물체와 일반 물체 99종을 대상으로 33만 장이 넘는 이미지와 약 400만 개의 표시 정보를 모았습니다. 일반 카메라 영상과 거리 정보에 열을 감지하는 영상까지 함께 활용합니다. 사람에게는 익숙한 유리컵 하나를 알아보는 데도 로봇은 이렇게 많은 데이터와 기술이 필요한 겁니다.\n\n물체를 알아본 다음에도 문제가 남습니다. 여러 물건이 바짝 붙어 있으면 옆의 물건을 건드리지 않으면서 원하는 것만 집어야 하니까요. 그래서 물체의 위치뿐 아니라 주변 물건과의 관계, 손이 접근할 경로도 함께 연구합니다. 현대자동차그룹 등과의 공동연구에서도 이런 기술을 다루고 있습니다.\n\n앞에서 로봇 손을 봤다면, 여기서는 그 손이 어디로 가야 하는지 알려주는 ‘로봇의 눈’을 본다고 생각하시면 됩니다. 보고, 위치를 알아내고, 실제로 집는 과정이 이어져야 로봇이 스스로 일을 할 수 있습니다.", "여기는 조규진 교수님 연구실에서 박사학위를 받은 정순필 박사가 개발한 이동식 3D 프린팅 로봇입니다. 아주 큰 구조물을 만들 수 있는 3D 프린터를 작게 접어서 이동하고, 작업할 장소에서 다시 크게 펼친다는 아이디어입니다.\n\n큰 건축 구조물을 출력하려면 보통 그만큼 큰 프린터가 필요합니다. 그런데 이 시스템은 이동할 때 대략 높이와 지름이 각각 90센티미터 정도로 줄어듭니다. 현장에서 펼치면 높이가 약 3.6미터, 바닥 폭이 약 3.2미터인 큰 틀이 됩니다. 그 안에서 사람 키보다 큰 구조물도 출력할 수 있고요. 작업이 끝나면 다시 접어서 다음 장소로 옮길 수 있습니다.\n\n이렇게 하려면 작게 접히면서도 펼친 뒤에는 충분히 튼튼해야 합니다. 연구팀은 구조물을 접고 돌돌 말아 보관하는 방법을 결합했습니다. 좁은 공간에는 작게 넣어두고, 필요할 때 길게 펼쳐 실제 작업에 쓸 수 있게 만든 것입니다.\n\n2024년에는 이 기술로 미국 보스턴에서 열린 로봇 대회에서 1위를 차지하기도 했습니다. MIT, 하버드, 스탠퍼드 등 여러 대학 팀이 참가한 대회였습니다. 현장에서는 약 1.2미터 높이의 구조물을 직접 출력하는 시연도 진행했습니다. 이후 2026년에는 이동하는 로봇과 펼쳐지는 구조를 결합해 약 2.5미터 높이의 구조물을 출력하는 방향으로 연구를 발전시켰습니다.\n\n이 기술은 건설현장이나 재난현장처럼 필요한 장소에 장비를 가져가 그 자리에서 구조물을 만들 수 있다는 장점이 있습니다. 더 먼 미래에는 사람이 가기 어려운 달이나 화성에서 구조물을 만드는 데 활용하는 구상도 있습니다.\n\n앞에서 보신 모픽 연구가 ‘로봇의 몸을 접었다 펼치는 원리’였다면, 이곳은 그 원리가 실제로 일하는 큰 장비가 된 사례입니다. 작게 이동해서 현장에서 크게 변신하는 3D 프린터라고 생각하시면 쉽습니다.", "여기는 기계공학부 임종우 교수님 연구팀입니다. 카메라로 촬영한 영상을 이용해 로봇이 자신이 어디 있는지 알아내고, 주변 공간을 입체적으로 이해하도록 하는 기술을 연구하고 있습니다.\n\n이곳에서 보여드릴 것은 실제 공간을 촬영해 컴퓨터 안에 3차원으로 다시 만드는 기술입니다. 내비게이션의 거리뷰를 생각하시면 비슷한 출발점인데요. 여기서는 단순히 사람이 화면으로 둘러보는 것을 넘어, 로봇이 그 공간을 이해하고 움직이는 데 활용할 수 있게 만드는 것이 목표입니다.\n\n사진 한 장만 봐도 우리는 방에 책상과 의자가 있다는 것을 알 수 있습니다. 하지만 로봇이 실제로 방 안을 움직이려면 벽까지 얼마나 떨어졌는지, 책상이 정확히 어디 있는지, 어디로 지나갈 수 있는지까지 알아야 합니다. 연구팀은 여러 위치에서 촬영한 영상을 연결해 거리와 깊이를 계산하고, 공간의 모습을 입체적으로 만들어냅니다.\n\n대표적인 연구로는 여러 대의 넓은 시야 카메라를 활용해 주변 360도를 살펴보면서 로봇의 위치와 주변 지도를 함께 추정하는 기술이 있습니다. 이런 기술은 이동로봇이나 자율주행차가 길을 찾는 데에도 도움이 됩니다.\n\n컴퓨터 안에 실제와 비슷한 공간이 만들어지면, 로봇을 그곳에 먼저 넣어 동선을 시험하거나 여러 상황을 연습시킬 수 있습니다. 앞에서 이동준 교수님 연구팀이 가상의 훈련장에서 로봇을 학습시켰다면, 이곳은 그 훈련장에 쓸 수 있는 현실 공간의 입체 지도를 만드는 기술이라고 생각하시면 됩니다.", "앞에서 이동준 교수님 연구팀이 컴퓨터 안에서 로봇을 연습시키는 기술을 보셨죠. 이번에는 그 연구를 실제 로봇에 적용하는 쪽을 살펴보겠습니다. 여기에는 사람처럼 머리와 몸통, 팔과 다리를 가진 휴머노이드 로봇이 놓여 있고, 연구팀이 실제 실험에 활용하고 있습니다.\n\n휴머노이드는 생각보다 제어하기가 까다롭습니다. 로봇 팔 하나를 움직이는 것과 달리 다리, 몸통, 팔이 한꺼번에 움직이기 때문입니다. 사람이 테이블에 다가가 물건을 집는 모습을 떠올려 보세요. 걸어가면서 균형을 잡아야 하고, 몸을 기울이고, 팔을 뻗고, 손으로 물건을 잡아야 합니다. 사람에게는 자연스러운 행동이지만 로봇에게는 여러 동작을 동시에 맞춰야 하는 어려운 작업입니다.\n\n특히 균형을 유지하는 일이 중요합니다. 팔을 앞으로 뻗기만 해도 몸의 무게중심이 바뀔 수 있고, 한 발을 옮기면 바닥에 닿는 위치와 힘도 달라집니다. 로봇은 이런 변화를 계산하면서 몸 전체가 안정적으로 움직이도록 조절해야 합니다. 이동준 교수님 연구팀이 오랫동안 연구해 온 로봇의 움직임과 제어 기술이 이런 부분에 연결됩니다.\n\n그럼 아까 가상공간에서 연습한 동작을 그대로 가져오면 될까요? 실제로는 그렇게 간단하지 않습니다. 컴퓨터에서는 바닥 상태나 마찰, 관절의 움직임을 일정하게 설정할 수 있지만 현실에서는 작은 차이가 계속 생깁니다. 바닥이 조금 미끄럽거나 로봇의 관절이 예상보다 늦게 움직일 수도 있죠. 그래서 가상환경에서 배운 동작을 실제 로봇에 적용하고, 잘되지 않는 부분을 확인하고 다시 조정하는 과정이 필요합니다. 이를 ‘시뮬레이션에서 현실로 옮기는 과정’이라고 이해하시면 됩니다.\n\n이 휴머노이드를 보면 앞에서 소개한 연구들이 어떻게 연결되는지도 알 수 있습니다. 카메라로 주변을 보고, 손과 센서로 물체를 잡고 힘을 느끼고, 인공지능으로 행동을 배우고, 몸 전체를 제어해 실제로 움직이는 것입니다. 기술 하나만으로는 이런 행동을 구현하기 어렵고, 여러 기술이 함께 맞물려야 합니다.\n\n앞의 이동준 교수님 공간이 로봇의 ‘가상 훈련장’이었다면, 여기는 훈련한 동작이 실제 몸에서 제대로 되는지 확인하는 ‘현실 실험장’인 셈입니다. 저희가 이야기하는 피지컬 AI가 컴퓨터 속의 판단을 실제 로봇의 행동으로 연결하는 과정이라고 이해하시면 좋겠습니다.", "지금까지 로보틱스연구소에서 진행하는 여러 연구를 함께 살펴봤습니다. 유연하게 구부러지는 로봇, 사람의 시범을 보고 배우는 로봇, 힘과 손동작을 읽는 센서, 몸에 입는 로봇, 모양이 바뀌는 로봇과 로봇 손, 가상공간에서 배우는 기술, 물체와 주변 공간을 알아보는 카메라 기술, 현장에서 펼쳐 사용하는 3D 프린팅 로봇, 그리고 실제 휴머노이드 실험까지 다양한 연구가 이어지고 있습니다.\n\n하나하나 보면 서로 다른 연구처럼 보일 수 있지만, 결국 로봇이 현실에서 사람과 함께 일하려면 모두 필요한 기술입니다. 주변을 볼 수 있어야 하고, 무엇을 할지 판단하고 배워야 하며, 몸을 안전하고 정확하게 움직여야 합니다. 물건을 잡거나 사람을 도우려면 손과 센서, 부드러운 구조도 중요하죠. 저희 연구소는 이런 기술을 각 분야의 전문가들이 함께 연결해 나가고 있습니다.\n\n현재 약 80명의 교수님이 연구소에 직간접적으로 참여하고, 그중 41명이 국가연구소 NRL 2.0 사업에 직접 참여하고 계십니다. 연간 약 100억 원의 연구 지원을 바탕으로 최대 10년 동안 핵심기술을 발전시키고, 기업과의 공동연구, 기술이전과 창업 지원도 함께 확대할 예정입니다. 연구성과가 연구실을 넘어 산업과 실제 생활에 활용되도록 하는 것이 중요한 목표입니다.\n\n앞서 소개해 드린 것처럼 새로운 로보틱스연구소 건물도 준비하고 있습니다. 이곳의 연구는 앞으로도 계속 진행되기 때문에 전시된 로봇과 장비 역시 새로운 성과에 맞춰 달라질 수 있습니다. 오늘 보신 것은 저희가 진행하고 있는 여러 연구의 일부이지만, 서울대학교가 어떤 방향으로 피지컬 AI를 연구하고 있는지 이해하시는 데 도움이 되었으면 합니다.\n\n이상으로 로보틱스연구소 투어를 마치겠습니다. 오늘 보신 연구나 연구소에 대해 궁금하신 점이 있으면 편하게 질문해 주세요. 함께해 주셔서 감사합니다."], "en": ["Hello, I'm ___, and I'll be guiding today's tour of the Robotics Institute at Seoul National University. I currently work here at the Institute in the ___ team. I'll start with a short introduction to the Institute, and then walk you through some of the main research projects going on in this space.\n\nThe SNU Robotics Institute is a hub that connects robotics research from across many different fields at Seoul National University. About 80 professors take part, directly or indirectly, from areas like mechanical engineering, electrical and computer engineering, computer science, and materials science, as well as medicine, public health, and brain and cognitive science. A wide range of research comes together here — from the structure and materials of robots, to sensors, computer vision, control systems, AI and machine learning, human-robot interaction, and medical and biological applications. One important feature of the Institute is that researchers from very different backgrounds actively work together under the single field of robotics.\n\nBased on this research strength, the Institute was selected in 2026 for a new national research program called NRL 2.0, run by Korea's Ministry of Science and ICT and Ministry of Education. Of the roughly 80 professors connected to the Institute, 41 are directly involved in this program. It's a large, long-term project — about 10 billion won in government funding per year, for research that can continue for up to ten years. This lets us connect the technology and researchers built up in individual labs, and support research that ranges from core robotics technology all the way to real-world systems and applications. On August 18, 2026, we held the official opening ceremony for the national robotics institute and began running this research system in earnest.\n\nThe main direction the Institute is working toward is what we call 'human-centered Physical AI.' Physical AI means building AI that can sense and understand its surroundings through a robot's body in the real, physical world — and then move and interact with people accordingly. To do this, we bring together many different technologies: a robot's structure and materials, its actuators (the parts that create movement), sensors and touch, computer vision, control systems, and AI and learning. The goal is to connect these technologies to support people's everyday lives and work, to assist and extend what the human body can do, and to develop human-centered robot technology that can be used in real settings like industry and healthcare.\n\nOver the ten years of this national research program, we plan to build up research results while also creating a foundation for the Institute to keep growing on its own in the long run. We're expanding partnerships and technology transfer with companies, and actively working to turn strong research results into real industry applications. We also plan to strengthen our role in finding promising Physical AI technologies and researchers and helping them grow into startups, including support for very early-stage companies. The goal is to connect research, industry partnerships, technology commercialization, and startups into one ecosystem, building a robotics research and industry hub that can sustain itself over the long term.\n\nAs our research grows, we're also building an independent research space of our own. We've already secured land behind this building and completed the necessary permits, and we plan to move into a dedicated Robotics Institute building in about two years. That new space will include not only research and lab facilities, but also support for industry partnerships, technology commercialization, and finding and nurturing startups. Over time, we want this to become a hub where SNU's Physical AI research, companies, and startups all come together.\n\nWhat you see in this space right now is a selection of research from several different teams. From soft robots and flexible robots built with new materials and structures, to robot hands and grippers, sensors that detect force and touch, and wearable technology that senses and assists human movement — and beyond that, research where people teach robots through remote control, cameras that let robots recognize their surroundings and pick up objects, technology that turns real spaces into digital environments, methods for training robots in virtual environments, and humanoid robots that bring learning and whole-body control into the real world — you can find all of this in this space.\n\nPlease note that this is a working research space, and the equipment you'll see today is actively used in real experiments. For everyone's safety, please don't touch or operate anything on your own — feel free to look, and we'll walk you through the details.", "This is a robot from the lab of Professor Ahn Seung-hoon in the Department of Mechanical Engineering. His team works broadly on connecting materials, design, and manufacturing to build robots and structures with new capabilities. Their main research areas include smart materials like shape-memory alloys (metals that return to a set shape when heated), composite materials, sensors and actuators, soft robots, and 3D printing (additive manufacturing). Recently, they developed an extremely lightweight but very strong 3D lattice structure using continuous carbon fiber, and used it to build robot arms and drone frames.\n\nWhat's here is a flexible, segmented robot — a bit like an elephant's trunk. Think of a typical industrial robot arm: it has a handful of joints, each rotating in a fixed direction to change the arm's position. This robot instead has many small sections connected in a row, all moving together. That lets it change its overall shape and wrap around an object to grip it, adapting to whatever shape that object happens to be. Using many joints and a flexible structure to match and wrap around different shapes is the key idea behind this robot.\n\nWhat matters most in this kind of robot is that the structure itself actively creates the motion. Professor Ahn's team has long researched how to build function directly into materials and structures. For example, they combined shape-memory alloy with a knitted fabric structure to create a soft actuator — something that can bend, twist, stretch, and change its 3D shape depending on temperature or electrical current, almost like a structure that can move on its own, the way a flower opens. This idea is applied to soft robots and wearable devices.\n\nThe easiest way to think about this robot is through the question: 'how flexible can we make a robot?' A typical robot arm is very good at precisely moving a fixed set of joints. This segmented robot instead focuses on using the movement and deformation of many parts together, so it can adapt its shape to whatever it's working with. As robots move beyond structured factory settings into spaces with people and irregularly shaped objects, this kind of flexible structure and movement will likely become more and more useful.\n\nOne defining feature of Professor Ahn's team is exactly this combination of materials, design, and manufacturing. Rather than thinking about a robot's movement only in terms of controllers or motors, they design the material, the structure, and the manufacturing method all together. They've applied smart materials and functional composites to robots, and expanded into soft robotics, sensors, 3D printing, and micro/nano manufacturing. What's on display here is one example of how a flexible structure lets a robot move and interact with objects.", "This is robot-learning research from the lab of Professor Park Jong-woo in the Department of Mechanical Engineering. His team has long worked on mathematically modeling and controlling robot motion, and more recently has been combining this with AI and data-driven learning methods. Their main research areas include robot motion and control, object manipulation, mobile manipulation (moving around while performing tasks), and physics-based simulation. Recently, they've also been actively researching how robots can learn complex tasks from data — including imitation learning, object manipulation, and real-time collision detection.\n\nThis space is about how a person teaches a robot a task. For a robot to pick up and move different objects the way a person does, it first needs to learn what to do in different situations. When a person directly controls the robot remotely to carry out a task, the robot can record data along the way — how the arm moved, where exactly it grasped the object, and in what order the steps happened. This space focuses on that process: a person remotely controlling the robot, and using that motion data to train it. Having a person remotely guide the robot's movements is the key idea here.\n\nThis approach matters a lot when teaching a robot something new. For a person, picking up a cup and moving it somewhere else needs no explanation at all. For a robot, it means a whole sequence of steps: finding the cup's position, choosing which direction to approach from, how wide to open its hand, when to close it, and which direction to lift it — all while avoiding other nearby objects. When a person demonstrates the task directly and the robot records the data, that complex sequence of actions can be passed on to the robot.\n\nCollecting this kind of real-world action data is an important challenge for Physical AI. AI focused on language or images can pull huge amounts of data from the internet, but data about a robot actually moving through physical space and touching objects usually has to be created directly. Having a person operate the robot and demonstrate tasks is one way to collect this real action data. Once enough of this data is gathered, it can be used to train robots to handle new objects or perform more complex tasks. Professor Park's team applies data-driven machine learning to robot control in this way, working on precisely handling unfamiliar objects and performing complex motions.\n\nSo it helps to think of this research in terms of 'who teaches the robot, and how.' A person operates the robot directly to create good examples of the task, and the robot gradually learns to perform it by training on that data. As robots take on a much wider range of objects and situations in homes and industry, this kind of demonstration data and learning technology will play an important role.", "This is sensor technology from the lab of Professor Park Yong-rae in the Department of Mechanical Engineering. His team works on soft robots, sensors, and actuators built from soft, flexible materials. A key research area is building sensors into structures that can bend and stretch like human skin and muscle, and using them to measure movement and contact — for either a person or a robot. This work is part of a larger shift from robots made mostly of rigid mechanical parts toward robots that use flexible materials and sensing to interact more naturally with people.\n\nTwo technologies are on display here. One is a 3-axis force sensor that measures force at a robot's fingertip. The other is a glove based on liquid metal that measures how a person's fingers move. One reads the force a robot feels when it touches something from the outside; the other reads how a human hand is moving. It helps to think of them as a pair: a sensor that gives fingertip force feedback, and a liquid-metal glove that senses human hand movement.\n\nThe 3-axis force sensor measures the force a robot feels from several directions when it touches an object. When a robot grips something, it's not enough to know where the object is — it also needs to know how hard it's actually pressing. Grip too lightly, and you drop a cup; grip too hard, and you might damage it or spill the contents. People naturally adjust their grip using the sense of touch in their fingertips, and a robot needs a similar kind of sensor at its fingertips or 'skin' to make similarly delicate adjustments. Professor Park's team has continued developing multi-axis, soft sensors that can measure both the force pressing straight in and the force pushing sideways, all within a flexible structure.\n\nThe glove next to it works in the opposite direction. When a person wears the glove and moves their fingers, a flexible sensor inside tracks the movement and the changing angles of the finger joints. This sensor uses liquid metal — a metal that conducts electricity but, unlike a solid metal, doesn't hold a rigid shape. That means it can bend and stretch right along with the finger and the glove without breaking the sensor. Using this stretchable sensor, the team can estimate both finger-bone length and joint angle at the same time, and reconstruct a person's hand movement in real time.\n\nConnecting this to robot learning creates an interesting link with Professor Park Jong-woo's remote-control research. There, a person directly operates a robot to create action data. Here, the sensor can capture the process of a person simply moving their hand the way they normally would — what they're holding, and how their fingers move — turning it into data that's useful for training robot hands or for human-robot interfaces. And on the robot side, the fingertip sensor can capture data about exactly how the robot is touching an object.\n\nIn the end, it's easiest to think of these two sensors as technology that creates a physical 'sense' needed for people and robots to interact in the real world. One turns human movement into data a robot can use; the other turns the force of a robot's contact with an object into data as well. For Physical AI to handle objects and work alongside people the way humans do, it needs more than just the ability to see — it also needs to touch and feel force. What's on display here is the flexible sensor technology that makes that kind of physical interaction possible.", "This is wearable-robot research from the lab of Professor Cho Kyu-jin in the Department of Mechanical Engineering, who also directs the Robotics Institute. His team researches soft robots, wearable robots, biomimetic robots (robots inspired by living things), and shape-changing mechanisms based on the principles of origami. A key feature of their work is observing how people and other living things move, and using flexible materials and new structures to create movement that's hard to achieve with a conventional robot. Wearable robots, one focus of this research, are worn directly on the body and use the robot's own force to assist or extend a person's movement or physical function.\n\nOn display here are assistive devices and wearable robots that a person wears directly on the body. You can think of a wearable robot as the kind of robot that interacts with a person at the closest possible range. Rather than riding a robot or controlling it from a distance, a person wears it on their body, and it moves along with them. Because of that, it's not just about how much force the robot can produce — it also matters a great deal how comfortable it is to wear, how naturally it follows the wearer's movement, and how accurately it senses what the user is trying to do.\n\nOne well-known example from Professor Cho's team is the Exo-Glove line, which assists hand function. A user who has difficulty moving their hand wears it like a glove, and the robot helps move the fingers with enough force to grip objects. It uses flexible polymer material along with tendons — wires that transmit force — to move the fingers. Later research added cameras and AI to predict which object the user is trying to grasp: when a person reaches toward a cup, the robot senses that action and the surrounding situation, and helps move the hand accordingly.\n\nMore recent work has expanded from 'how should the robot move' to 'how can it be worn comfortably.' In 2026 research, to help users with limited mobility who struggle to put on a wearable robot by themselves, the team developed a self-fastening structure where a single tendon-driven actuator tightens several fastening points automatically. This was applied to wearable robots that assist the elbow and ankle — a good example of how the lab designs a robot's structure and actuation method with the actual user at the center.\n\nIt helps to think of this space in terms of how the robot and the person move as a single system. The robot senses the user's movement and intent, adds the right amount of force at the right moment, and helps the person move naturally. The sensors and hand-movement recognition from Professor Park Yong-rae's team can connect with this kind of wearable robot too: a sensor reads the person's state and movement, the robot makes a decision, and the actuator generates the actual force to help the person.\n\nWearable robots are also a great example of the human-centered Physical AI this Institute is working toward, since the robot understands what a person is trying to do and supports them with real physical force. They can assist body functions like the hands, arms, and legs, and extend into rehabilitation, everyday support, and reducing physical strain for workers. What's on display here is one form this can take: a robot that's actually worn on the body and helps assist a person's movement.", "This is a shared research space used by several different teams. In robotics research, building the robot itself is only part of the job — it's just as important to accurately measure and record how a robot, a person, and their surroundings actually move. Here, cameras and various measurement equipment are used to record the movement of people and robots and collect the data needed for research. Think of it as a shared space where multiple teams capture video and data together.\n\nFor example, imagine studying the motion of a person reaching out and grasping an object. It's a completely natural movement for a person, but to teach it to a robot, you need to turn it into data: where the hand started, what path it followed, how the wrist changed direction, and the exact moment it grasped the object. The same goes for analyzing a robot's own movement — you need objective data on whether it followed its intended path accurately, and how much its actual movement differed from what was calculated.\n\nAs Physical AI research grows, this kind of data becomes even more important. For a robot to learn how to act in the real world, it needs physical data — not just images and text, but data about how people and robots move, how they make contact with objects, and how the surrounding space changes. The remote-control and wearable-sensor research shown elsewhere in this tour also connects back to this same idea: turning human actions into data a robot can use. This space supports that work — it's shared research infrastructure where different teams can gather this kind of data and verify their experimental results.\n\nBecause the Robotics Institute brings together so many professors and researchers from different fields and topics, this kind of shared infrastructure plays an important role. One team's experimental setup or data-capture equipment can be used by another team, and different technologies can be combined within a single experiment. Researchers working separately on robot hardware, sensors, or AI and learning can share this space to generate data, verify their technology, and carry out collaborative, cross-disciplinary research. This is one of the experimental spaces that supports that kind of collaboration.", "This is 'Morphic' research from the lab of Professor Cho Kyu-jin. One important research area for his team is biomimetic robots and origami-based robots. They observe the movement and structure of living things in nature, and apply the underlying principles to a robot's body and mechanisms. They also use the folding and unfolding principles of origami so that a robot can change its size and shape as needed. The lab lists biomimetics, origami structures, soft robots, wearable robots, and prosthetic hands among its main research areas.\n\nIt's easiest to think of biomimetics not as copying nature exactly, but as finding the underlying principle behind an especially effective natural movement and applying it to a robot. A well-known example is the water strider robot, developed by Professor Cho's team together with Professor Kim Ho-young's team. They analyzed how a water strider moves its legs to jump on the surface of water, using the water's surface tension, and built a small robot based on that principle. Researcher Jung Soon-pil, then part of Professor Cho's lab, took part in this work as well. The results were published in the journal Science in 2015.\n\nA ladybug's wings also inspired a robot structure. A ladybug can fold its wings into a small body and unfold them quickly when needed. The team applied this idea to an origami-based structure, creating wings that fold up small, unfold quickly, and stay stiff enough for flight once open. They even built a robot that jumps, then unfolds its wings and glides. It's a good example of how the origami principle — originally just a way to save space — expanded into a technology for creating robot movement and function.\n\nThe Morphic research here follows the same idea. The key point is that instead of keeping one fixed shape, a robot's body or parts change shape to match the task or the surrounding environment. It might move or store itself in a small, compact form, then unfold to a larger size when it's time to work. It might use one shape to pass through a narrow space, and another to work in an open area. The robot's body itself changes along with the environment and task to create the function that's needed.\n\nProfessor Cho's team also used origami principles to build a shape-changing wheel that can support the weight of a one-ton vehicle while changing its form. On flat roads, it uses a normal wheel shape; in environments with obstacles, it changes shape to improve mobility — combining the geometry of origami with a mechanical structure strong enough for real loads.\n\nCombining soft robotics with origami expands the range of shape-change even further. Inspired by how a pelican eel can open its mouth wide and stretch its body, the team built soft robots that fold up small and then expand dramatically and reshape themselves when needed. Using this idea, they created underwater exploration robots that hide in a small form and stretch out long, along with soft grippers that change shape.\n\nSo it helps to look at this space not just as a set of individual parts, but by asking, 'how does the robot's body itself create function?' Professor Cho's team also studies this concept from the perspective of embodied intelligence — the idea of designing a robot's materials, structure, and mechanisms together with its AI and control systems, so the robot's ability to adapt to its environment comes from the whole package, not just the software. What's on display here — structures and parts built from biomimetics, origami, and soft robotics — is one part of that larger effort to make a robot's body more flexible and adaptable.", "This is also robot hand and gripper research from Professor Cho Kyu-jin's team. Unlike the Morphic research, where the robot's body and structure change shape to fit the environment, this space is about how a robot actually makes contact with and grips real objects. Building on soft robotics and biomimetic design, the team continues to research prosthetic hands, robot hands, and grippers of many different forms — prosthetic hand research, in particular, is treated as its own major focus within the lab, applying the structure and movement of a human hand to a robot mechanism.\n\nFirst is a robot hand driven by tendons — essentially wires that play a role similar to the tendons in a human hand. In a human hand, the muscles aren't attached directly to every joint; instead, force created in the muscle travels through a tendon, and that force moves several joints at once. A robot hand can use the same idea, transmitting force generated by a motor through a wire all the way to the fingers.\n\nThis approach has clear advantages for a robot hand with as many joints as a human hand. Just one finger already has several joints moving together, and once you add five fingers and a wrist, there's a huge number of individual movements to create. If you placed a motor and gearbox at every single joint, the hand would quickly become too large and heavy. Using tendons lets you place the actuator away from the fingers and still deliver the needed force through a wire — keeping the hand itself relatively small and light while still gripping with enough strength. This tendon-driven design, combined with strong gripping force, is the key feature of what's on display here.\n\nBuilding a robot hand comes with another challenge: people grip objects in so many different ways. The finger motion for picking up a cup is different from picking up a coin, and the force needed for a heavy box is different from a fragile object. So robot-hand research isn't just about achieving many degrees of freedom — it's also about using that flexibility effectively in real tasks. This is exactly where Professor Park Yong-rae's touch sensors and hand-motion sensing, and Professor Park Jong-woo's robot-learning methods, connect back to this robot hand.\n\nGripper research allows for a somewhat different approach, tailored to a specific task rather than copying the human hand exactly. Inspired by how a person can gather several objects in one hand before carrying them all at once, Professor Cho's team recently developed a gripper called MOGrip, designed to hold multiple objects. Instead of having the robot arm travel back and forth to its destination for every single object, it can pick up several objects one after another, store them in its palm, carry them all in one trip, and then place them down one at a time. This research was published in Science Robotics in 2024, and is being explored as a way to reduce a robot's travel time in logistics and manufacturing.\n\nIt helps to understand the robot hands and grippers on display here through the question: 'how can a robot handle a wide variety of objects the way a person does?' Cameras and computer vision can locate an object, and AI can decide which one to pick up — but the final point of contact with a real object always comes down to the robot's hand. Deciding exactly where to place the fingers, how much force to use, and how to keep hold of the object is where the real physical interaction happens.\n\nThis space also includes ongoing research into a hybrid hand that combines tendon-driven movement with other actuation methods. It's an early-stage project connected to Hyundai Mobis, so details that haven't been made public will only be shared to the extent appropriate for an internal research setting. In short, the goal is to develop a more effective actuation structure by balancing several factors together — a robot hand's size, weight, degrees of freedom, and gripping force. Since this research is still ongoing, the exhibit here is likely to keep evolving as new results come in.\n\nThe origami structure next to this exhibit also connects to the shape-changing structures Professor Cho's team has studied for a long time. Using the principles of origami, something can normally be folded up small and then unfolded into a large structure when needed. The team has extended this idea into many forms — robot wings, wheels, robot arms, and soft robots. What's on display here also includes material showing how ideas that started with biomimetics and origami have expanded into robot hands, grippers, and structures people can use directly.", "This is robot simulation and learning research from the lab of Professor Lee Dong-jun in the Department of Mechanical Engineering. His team works broadly on robot dynamics and control, manipulation, simulation, teleoperation, haptics, autonomous robots, and aerial robotics. One important part of their recent research is using physically realistic simulation to let robots experience many different situations and learn how to behave before those behaviors are tested on a real robot.\n\nWhat you see here is essentially a virtual training environment for robots. A robot, the objects around it, and the surrounding environment are recreated inside a computer, and the robot can repeatedly practice tasks such as pushing, picking up, or moving objects. In a real experiment, every trial takes time and involves physical hardware. In simulation, the same task can be repeated many times while changing the object's position, the robot's posture, friction, contact conditions, and other variables.\n\nOne important learning method used in this kind of environment is reinforcement learning. The robot tries different actions and receives a reward depending on how well those actions achieve the goal. For example, if the task is to move an object to a target position, the robot can repeatedly try different contact points, pushing directions, forces, and arm trajectories, gradually learning which actions work best.\n\nFor this to be useful, however, the simulation has to reproduce physical interaction accurately. When the robot touches an object, the simulator needs to calculate whether the object moves, rotates, slips, or collides with something else. Professor Lee's team has been developing technologies for accurately and efficiently calculating these contacts and collisions, so that large numbers of robot interactions can be simulated and used for learning.\n\nThis gives us another way of thinking about how a robot can learn. Earlier, in Professor Park Jong-woo's space, we saw a person directly demonstrating a task and creating real-world data. Here, the robot can generate a much larger amount of experience by repeatedly trying different actions in a virtual environment. These two approaches — learning from human demonstration and learning through simulation — can complement each other.\n\nLater in the tour, you'll see an actual humanoid robot used by Professor Lee's team. The important connection is that the learning and control methods developed here do not remain only inside the computer. They ultimately need to be transferred to a physical robot. So for now, it helps to think of this space as the robot's virtual training ground — where movements and interactions can be tested and learned before they are brought into the real world.", "This is robot perception and object-grasping research from the lab of Professor Kim Ah-young in the Department of Mechanical Engineering. Professor Kim leads the RPM Robotics Lab, researching how a robot can recognize its surroundings and nearby objects, figure out its own position, and use that information to move and act on its own. Her main research areas are environmental perception, sensor fusion, and autonomous robot navigation, and more recently, her team has also been actively researching how a robot can accurately recognize and manipulate objects.\n\nThis space is about how a robot uses a camera to recognize objects, find the one it wants, and actually pick it up. A person can glance at several items on a table and instantly tell a cup from a bottle, then naturally reach out and grab the one they want. A robot first has to look at the scene through a camera and figure out what objects are where. It then has to calculate each object's orientation and pose, and determine which direction its hand should approach from to get a stable grip. Only once all of these steps connect together can the robot actually grasp the object.\n\nOne especially important focus here is transparent objects — think of a glass cup or a clear plastic container. Light passing through a camera can reflect off the surface of such an object or pass straight through it, and its appearance changes a lot depending on the background and lighting. Because of this, the cameras and depth sensors a robot normally uses often struggle to work out the exact shape and position of a transparent object. Professor Kim's team treats this as a major research topic, connecting everything from recognizing a transparent object, to estimating its position and pose, to actually manipulating it with a robot.\n\nTo support this work, the team built a large dataset called TRansPose, covering 99 kinds of transparent and regular objects, with more than 330,000 images and around four million annotations. It combines standard RGB images and depth information with thermal infrared data, so that transparent objects can be recognized more accurately. It's a good illustration of just how much recognition data and technology is needed for a robot to reliably handle something as ordinary — to us — as glass or clear plastic.\n\nHow to actually pick up the object also matters, alongside recognizing it. When several objects are placed close together, a robot needs to grasp only the one it wants, without knocking the others out of place. That means considering not just the target object's position and pose, but its spatial relationship to nearby objects, in order to plan an approach path and a grasping point. Picking the target object without disturbing anything nearby is a key part of this research.\n\nThe SNU research team led by Professor Kim also works with Hyundai Motor Group and other partners on joint robotics research, including recognition technology for transparent objects like glass and techniques for grasping objects a robot hasn't seen registered before. For robots to work in real homes and industrial settings, they need to go beyond handling a small set of pre-registered objects — they need to recognize and manipulate unfamiliar objects even in complex surroundings. Connecting recognition, decision-making, and manipulation in this way is a key research direction.\n\nThe easiest way to think of this research is as 'building eyes for a robot.' It starts with a camera capturing an image, then finding the object within that image, understanding its 3D position and pose, and deciding how to bring the hand in based on the surroundings. Finally, the robot's actual hand or gripper moves to pick up the object. If the gripper from Professor Cho's team is the robot's hand, then this recognition technology is the eyes and spatial awareness that tell that hand where to go. It's research that shows how perception and manipulation connect — something Physical AI needs in order to act on its own in a real environment.", "This is research on a mobile, deployable 3D-printing robot, developed by Dr. Jung Soon-pil, who earned his PhD in Professor Cho Kyu-jin's lab. The core idea is a 3D printer that can fold down to a small size for transport, then expand at the job site to print large structures. Printing something like a building or a large structure normally requires a printer with a work area as big as the structure itself. Using robotics and deployable-structure technology, Dr. Jung built a system that packs down small for travel, then unfolds into a large 3D printer once it arrives on site.\n\nThe system he built folds down to about 0.9 meters in height and diameter when packed — roughly the size of a large box. Once work begins, it unfolds into a large frame about 3.6 meters tall with a base around 3.2 meters wide — several times larger than its packed size. A 3D-printing unit is mounted on this unfolded frame, letting it print structures taller than a person, right on site. Once printing is done, the frame folds back down, can be moved to a new location, and unfolds again for the next job.\n\nThe key robotics technology here is a deployable structure that can freely expand and shrink the printer's size. Dr. Jung's team developed a 'Fold-and-Roll' structure that combines folding with rolling for storage — a long robotic arm can be folded and rolled up into a small space, then extended back out when it's time to work. Once unfolded, it needs enough stiffness and stability to actually operate a 3D printer and produce a real structure. Achieving a small packed size, a large working area, and enough structural strength all within one robotic system is the core challenge this technology solves.\n\nIn 2024, this technology was built into a full-scale, large 3D-printing system and entered in the Form & Function Robotics Challenge, run by MassRobotics in Boston, USA — winning first place against teams from MIT, Harvard, Cornell, Stanford, and other universities. At the time, the system packed down to a base of about 0.8 meters and a height of about 0.75 meters, and unfolded into a triangular-pyramid shape up to 3.4 meters at the base and 3.6 meters tall. On site, using a 1.2mm nozzle and PLA plastic, it printed a 1.2-meter-tall structure made of about 2,000 printed layers as a live demonstration.\n\nThe advantage of this technology is that the 3D printer itself becomes mobile. Instead of only manufacturing a structure at a factory and then transporting it to a site, a robot can travel to the location it's needed and build the structure right there. For example, the system could be carried to a construction site or disaster area in its packed form, then unfold on site to produce needed parts or structures immediately. Combined with a mobile robot base, this could evolve into a construction robot that travels to a specific location on its own, unfolds its large frame, prints what's needed, folds back up, and moves on to the next site. The SNU research team has even proposed applying this to construction work in places people can't easily reach, such as the Moon or Mars.\n\nThis research also connects directly to the Morphic research from Professor Cho's team — it's a real example of applying shape-changing technology to an actual working system, expanding its body dramatically when needed and shrinking back down for storage or transport. In 2026, Dr. Jung, as a co-lead author, published follow-up research on deployable structures in Science Robotics. The team developed an interlacing-based structure that can fold and roll up for storage at the same time, and extended the technology into a mobile 3D-printing robot: a mobile robot about 1 meter in size travels to a site, unfolds into a frame roughly 3.2 meters wide and 3.4 meters tall, and prints a structure about 2.5 meters high.\n\nSo it's easiest to understand this research through two ideas at once: 'a large 3D printer' and 'a robot that transforms into whatever size it needs to be, wherever it's needed.' A small robot travels to a location, unfolds its body into a large working space once it arrives, and uses robotic control together with 3D-printing technology to produce a structure directly on site. Once the job is done, it folds back down small and moves on. It's research that combines shape-changing technology with manufacturing to extend robotics into construction and large-scale fabrication.", "This is robot vision research from the lab of Professor Lim Jong-woo in the Department of Mechanical Engineering. Professor Lim leads the Robot Vision Lab, researching how a robot can use a camera to understand the space around it. His main research areas include Visual SLAM (a method for figuring out a robot's position and mapping its surroundings at the same time using cameras), 3D scene reconstruction, depth estimation using multiple cameras, and scene understanding for autonomous driving. In simple terms, this is technology that takes 2D camera images and uses them to help a robot figure out where it is and understand the 3D structure of the space around it.\n\nThis space focuses on using footage of a real location to build a realistic 3D digital version of that space. If you've ever used the street-view feature in a car navigation app, that's a helpful comparison — but here, the goal goes a step further: turning a real space into a 3D digital environment that a robot can actually use. Cameras capture the real environment from many positions and angles, and the system calculates the spatial relationship between each image. From that, it reconstructs the 3D layout of walls, floors, and objects — where everything is and how the space is shaped. Turning a real space into a 3D digital space that a robot can move through and learn in is the core idea behind this exhibit.\n\nA single photograph helps explain why this technology is needed. Looking at a photo, a person can roughly understand a room, or recognize a desk or a chair. For a robot to actually move through that same space, it needs far more information: how far away the walls are, exactly where the desk sits in the room, which areas it can move through, and where it currently is. That means calculating depth and position from multiple camera images, and connecting all of that into a single 3D space.\n\nProfessor Lim's team has worked on this problem for a long time. One notable result is OmniSLAM, a technology that uses several wide-angle cameras to observe a full 360 degrees around the robot, estimating the camera's position while simultaneously building a depth map of the surroundings. Combining information from multiple wide-view cameras lets you observe far more of the surrounding space than using footage from just one direction. The team has also researched estimating depth from all-around camera footage — technology that mobile robots and self-driving cars can use to determine their own position and understand the space around them.\n\nTaking this a step further makes it possible to recreate a real space as a digital environment. A real robot can be placed directly into this digital space, or a virtual robot can be placed there first to test out different tasks — changing its movement path, checking what its sensors would see from different positions, and training it on how to behave in specific situations. If Professor Lee Dong-jun's virtual simulation is a robot's 'training ground,' then this can be understood as the technology that builds the actual 3D map of a real space to use in that training ground.\n\nThis matters a great deal for Physical AI. For a robot to act in the real world, it needs to understand the space it exists in. A person walking into a room naturally looks around and figures out which way they can walk and where the obstacles are. A robot has to calculate that same spatial information from the data coming in through its cameras and sensors. Visual SLAM is a key technology for a robot to build a map of its surroundings while figuring out its own position as it moves, and 3D reconstruction turns that space into more precise digital information. Professor Lim's team applies this kind of geometric and semantic vision to mobile robots, vehicles, and augmented and virtual reality.\n\nSo rather than focusing only on how realistic the space looks on screen, it's better to think of this research as being about how to build a digital space that a robot can actually use. The system observes a real space with cameras, calculates the relationships between multiple images, and estimates depth and structure to build a 3D environment. Placing a robot inside this environment lets you test its movement, perception, and learning under a variety of positions and conditions before it ever goes into the real environment. In short, this is technology for connecting a real-world space to a digital environment that a robot can understand and learn from.", "Earlier, we looked at Professor Lee Dong-jun's research on simulation-based robot learning. Here, we can see the other side of that research much more directly: an actual humanoid robot being used as an experimental platform.\n\nA humanoid robot is a particularly challenging system because it has to control many parts of its body at the same time. Instead of moving only a single robot arm, it may need to coordinate its legs, torso, arms, and hands while maintaining balance and interacting with objects. Even a task that looks simple to us — walking toward a table and reaching for an object — involves controlling the whole body as one connected system.\n\nThis is where Professor Lee's long-standing research in robot dynamics and control becomes important. The robot has to calculate how its own body will move, how forces are transmitted through its joints, how contact with the ground or an object changes that motion, and how to adjust its movement in real time. For a humanoid, balance and manipulation cannot always be treated separately. Moving an arm changes the body's overall balance, and stepping or shifting weight can change how effectively the robot can use its arms.\n\nThe humanoid here is used to test these kinds of control and learning technologies on a real physical system. Movements that are first developed or trained in simulation can be transferred to the robot and tested under real conditions. This is often called sim-to-real: taking what the robot has learned in a simulated environment and making it work on actual hardware.\n\nThat transfer is one of the most difficult parts of robot learning. A simulation can model friction, contact, mass, and joint movement very precisely, but the real world always contains small differences — the floor may be slightly uneven, the robot's joints may respond differently than expected, or an object's position may shift. The physical robot therefore needs to sense what is actually happening and continuously adjust its movement.\n\nThe humanoid also makes it easier to see why Physical AI requires more than AI software alone. Intelligence has to operate through a physical body. The robot needs perception to understand its surroundings, learning and decision-making to choose an action, and dynamics and control to turn that decision into stable physical movement. With a humanoid robot, all of these elements have to work together across the entire body.\n\nYou can also connect this back to several technologies we've already seen on the tour. Robot vision can tell the humanoid where an object is. Robot hands and grippers determine how it physically makes contact with that object. Force and touch sensors provide information about that contact. Simulation lets the robot practice large numbers of actions before trying them on real hardware. And whole-body control coordinates all of these elements so that the robot can actually carry out the task while maintaining stable movement.\n\nSo if the earlier simulation space was the robot's virtual training ground, this space is where that training meets reality. The humanoid gives researchers a platform for testing whether control, learning, perception, and manipulation technologies can actually work together on a complex physical robot. That connection between virtual training and real-world embodiment is one of the central challenges of Physical AI.", "That covers a selection of the research currently underway at the SNU Robotics Institute. From flexible robot structures and sensors, to learning technology where a robot is taught by a person, wearable robots worn directly on the body, biomimetic and shape-changing robots, robot hands and grippers that manipulate objects directly, simulation that trains robots in virtual environments, robot vision that can recognize and grasp even transparent objects, large 3D-printing robots that deploy on site, technology that turns real spaces into digital environments, and humanoid robots that bring learning, balance, and whole-body control into real-world experimentation — a wide range of research is underway.\n\nEach of these research areas is quite different on its own, but they connect naturally under the idea of Physical AI. For a robot to act in the real world, it first needs to perceive its surroundings and the people in them. It also needs the ability to decide what to do and learn from its actions. It needs a body and actuation technology that can turn what it has learned into real movement, along with hands and sensors to grasp objects and control force. And to work in close contact with people, it needs flexible materials and technology for safe interaction. On a humanoid platform, these capabilities must also be coordinated across the entire body. The research covered today each represents a different piece of this larger Physical AI picture.\n\nThis is also where the strength of the SNU Robotics Institute lies. About 80 professors currently take part in the Institute directly or indirectly, and 41 of them are directly involved in the NRL 2.0 program. Researchers across mechanical engineering, AI, electrical and computer engineering, materials science, medicine, and biology are each advancing their own area of expertise while connecting their work with one another. Rather than trying to dev
