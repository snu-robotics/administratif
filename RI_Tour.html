elop every technology inside a single lab, the Institute has built a large-scale, cross-disciplinary research system where highly specialized teams in each field can work together.\n\nThrough this national research program, the Institute will keep pursuing this research for up to ten years. With about 10 billion won in government research funding each year, the goal is both to secure core foundational technology and to turn research results into technology that can be used in real industry and society. The Institute is also expanding joint research and industry partnerships, technology transfer and commercialization, and its role in helping promising Physical AI technologies and researchers grow into startups. An important part of the Institute's role is building a robotics innovation ecosystem, where technology that starts in research leads to companies and industry, which in turn create new businesses and jobs.\n\nThe Institute's research space is also expanding along with this growth. Land has already been secured behind this building for a new Robotics Institute building, permits have been completed, and the move to this new research space is planned for about two years from now. In that new space, the plan is to connect research and experimentation even more closely with industry partnerships, technology commercialization, and finding and supporting startups — building a robotics hub at Seoul National University where researchers, students, companies, and startups can come together to research Physical AI technology and turn it into real industry.\n\nThe research covered today will also keep evolving. Much of what's on display in this space reflects work that professors, students, and researchers are actively carrying out right now. As new results come in, the exhibits will be updated, and the technology you've seen today will move on to its next stage of research. The SNU Robotics Institute aims to connect all of this research toward a human-centered Physical AI that can be used in the real spaces where people live and work — building a robotics ecosystem where research, industry, and startups can grow together.\n\nThat brings us to the end of the SNU Robotics Institute tour. If you have any questions about the research you've seen today, or about the Institute itself, please feel free to ask. Thank you for joining us."]}, "medium": {"ko": ["안녕하세요. 오늘 서울대학교 로보틱스연구소 투어를 안내해 드릴 ○○○입니다. 저는 연구소에서 ○○○ 업무를 맡고 있고요.\n\n서울대학교 로보틱스연구소는 학교 안의 여러 전공 연구자들이 로봇이라는 공통 주제로 함께 연구하는 곳입니다. 기계공학, 전기·전자, 컴퓨터, 재료 분야뿐 아니라 의학, 보건, 뇌인지과학 등 다양한 분야의 교수님 약 80명이 직간접적으로 참여하고 계십니다. 로봇의 몸체와 소재를 만들고, 센서로 주변을 느끼게 하고, 인공지능으로 판단하고 움직이게 하는 연구까지 폭넓게 이어지고 있습니다.\n\n2026년에는 과학기술정보통신부와 교육부가 추진하는 국가연구소 사업, NRL 2.0에 선정됐습니다. 이 가운데 41명의 교수님이 과제에 직접 참여하고 계시고요. 연간 약 100억 원의 정부 연구비를 바탕으로 최대 10년 동안 연구를 수행하는 사업입니다.\n\n저희가 중요하게 생각하는 방향은 ‘인간 중심의 피지컬 AI’입니다. 조금 쉽게 말씀드리면, 지금의 인공지능이 글이나 사진을 이해하고 답하는 데 익숙하다면, 피지컬 AI는 실제 공간에서 보고, 상황을 판단하고, 로봇의 몸을 움직여 행동하게 하는 기술입니다. 그래서 인공지능만 잘 만들어서는 안 되고, 손과 팔, 센서, 움직임을 만드는 장치까지 함께 연구해야 합니다.\n\n연구소는 이런 연구가 실제 산업으로도 연결되도록 기업과의 공동연구, 기술이전, 창업 지원도 확대하고 있습니다. 뒤쪽에는 새 로보틱스연구소 건물이 들어설 부지를 확보했고 인허가도 마친 상태입니다. 현재 계획으로는 약 2년 뒤 독립된 연구공간으로 이전할 예정입니다.\n\n오늘 보실 것은 여러 연구팀의 연구 가운데 이 공간에 전시된 일부입니다. 부드럽게 움직이는 로봇부터 사람이 가르치는 로봇 학습, 손과 촉각 센서, 몸에 입는 로봇, 물체를 잡는 로봇 손, 가상환경에서의 훈련, 주변을 보는 기술, 접었다 펼치는 3D 프린팅 로봇, 그리고 실제 휴머노이드 실험까지 차례로 살펴보겠습니다.\n\n한 가지 안내 말씀드리겠습니다. 여기는 실제 실험을 진행하는 연구공간이라 장비들이 연구에 사용되고 있습니다. 안전을 위해 직접 만지거나 조작하지는 마시고, 궁금하신 점은 편하게 질문해 주세요.", "여기는 기계공학부 안성훈 교수님 연구팀의 로봇입니다. 이 연구팀은 새로운 재료와 구조, 만드는 방법을 함께 연구하면서 기존 로봇과는 다른 움직임을 구현하고 있습니다. 모양을 기억했다가 되돌아오는 금속이나 가볍고 튼튼한 복합재료, 3D 프린팅 같은 기술도 활용하고 있고요.\n\n지금 보시는 로봇은 코끼리 코를 떠올리시면 이해하기 쉽습니다. 보통 산업용 로봇 팔은 정해진 위치의 몇 개 관절을 움직이죠. 그런데 이 로봇은 작은 마디들이 여러 개 이어져 있어서 몸 전체가 유연하게 구부러집니다.\n\n핵심은 로봇을 어떤 재료로, 어떤 구조로 만드느냐에 따라 움직일 수 있는 방식 자체가 달라진다는 점입니다. 예를 들어 이 연구팀은 온도나 전기에 반응하는 금속을 직물과 결합해, 천처럼 부드럽지만 스스로 구부러지거나 비틀릴 수 있는 장치도 개발했습니다. 꽃이 피듯이 구조 자체가 움직이는 셈입니다.\n\n공장 안처럼 환경이 일정한 곳에서는 단단한 로봇 팔이 아주 유용합니다. 하지만 사람 주변이나 모양이 제각각인 물체를 다루는 곳에서는 이런 유연함이 장점이 될 수 있습니다. 이 로봇은 ‘로봇의 몸을 얼마나 자유롭게 변형할 수 있을까’라는 질문에서 출발한 사례라고 보시면 됩니다.", "이곳은 기계공학부 박종우 교수님 연구팀입니다. 오랫동안 로봇의 움직임을 계산하고 제어하는 연구를 해왔고, 최근에는 인공지능을 이용해 로봇이 여러 작업을 학습하도록 하는 연구도 진행하고 있습니다.\n\n여기서 중요한 것은 ‘사람이 로봇에게 어떻게 일을 가르칠까’입니다. 사람이 로봇을 원격으로 조작해서 물건을 집고 옮기는 모습을 보여주면, 로봇은 팔이 움직인 경로와 물체를 잡은 위치, 작업 순서 같은 정보를 기록할 수 있습니다. 이렇게 모은 데이터를 학습에 사용하는 방식입니다.\n\n예를 들어 우리는 컵 하나를 들어 옆으로 옮기는 일을 아주 자연스럽게 하죠. 그런데 로봇은 컵의 위치를 확인하고, 어느 방향으로 손을 가져갈지 정하고, 얼마나 힘을 줘서 잡을지, 주변 물체에 부딪히지 않으려면 어떻게 할지까지 알아야 합니다. 사람이 직접 시범을 보이면 이런 복잡한 과정을 데이터로 남길 수 있습니다.\n\n인공지능이 인터넷에서 글이나 사진을 많이 배울 수 있는 것과 달리, 로봇이 실제로 물체를 잡고 움직이는 데이터는 직접 확보해야 하는 경우가 많습니다. 그래서 사람이 로봇을 조작하며 좋은 예시를 만들어주는 일이 중요합니다. 여기서는 로봇에게 행동을 가르치는 방법을 보여드린다고 생각하시면 됩니다.", "여기는 기계공학부 박용래 교수님 연구팀의 센서입니다. 사람의 피부처럼 부드럽게 휘거나 늘어나는 재료로 로봇과 사람의 움직임, 접촉을 측정하는 기술을 연구하고 있습니다.\n\n오늘 보실 것은 크게 두 가지입니다. 하나는 로봇 손끝에 닿는 힘을 읽는 센서이고, 다른 하나는 사람이 손에 끼고 움직이면 손가락의 움직임을 측정하는 장갑입니다. 하나는 로봇이 무엇을 얼마나 세게 만지는지 알려주고, 다른 하나는 사람이 손을 어떻게 움직이는지 알려줍니다.\n\n먼저 손끝 센서를 볼까요. 우리가 종이컵을 잡을 때 너무 약하게 잡으면 떨어뜨리고, 너무 세게 잡으면 찌그러지겠죠. 사람은 손끝 감각으로 힘을 조절합니다.\n\n옆의 장갑에는 액체금속을 이용한 센서가 들어갑니다. 금속이지만 유연하게 변형될 수 있어서 손가락을 굽히고 펴는 동작을 따라갑니다. 이 정보를 이용하면 손가락 관절이 얼마나 구부러졌는지 알아내고 손동작을 재현할 수 있습니다.\n\n앞에서 보신 박종우 교수님의 연구가 사람이 로봇을 직접 조작해 행동을 가르치는 것이라면, 이 장갑은 사람이 평소처럼 손을 움직이는 모습 자체를 데이터로 만드는 데 도움이 됩니다. 결국 로봇이 실제 세계에서 물건을 잘 다루려면 보는 능력만큼 ‘만지고 느끼는 능력’도 중요합니다.", "이곳은 로보틱스연구소 소장이신 기계공학부 조규진 교수님 연구팀의 웨어러블 로봇입니다. 조규진 교수님 연구팀은 부드러운 로봇, 생물에서 아이디어를 얻은 로봇, 종이접기처럼 모양이 바뀌는 구조 등을 폭넓게 연구하고 있습니다.\n\n웨어러블 로봇은 말 그대로 사람이 몸에 착용하는 로봇입니다. 밖에서 따로 조종하는 로봇과 달리, 사람의 몸에 붙어서 함께 움직이며 필요한 힘을 보태줍니다. 그래서 힘이 세기만 해서는 안 되고, 착용하기 편하고 사람의 움직임을 자연스럽게 따라갈 수 있어야 합니다.\n\n대표적인 사례가 손의 움직임을 보조하는 ‘엑소글러브’입니다. 손을 자유롭게 움직이기 어려운 분이 장갑처럼 착용하면 로봇이 손가락을 움직여 물건을 잡는 데 도움을 줍니다. 부드러운 재료와 힘줄처럼 힘을 전달하는 와이어를 사용합니다.\n\n최근에는 로봇을 ‘잘 움직이게 하는 것’뿐 아니라 ‘혼자서도 쉽게 착용하게 하는 것’도 중요하게 다루고 있습니다. 팔꿈치나 발목을 보조하는 장치에서 여러 고정 부위를 한 번에 조일 수 있도록 만든 연구가 그런 예입니다.\n\n이곳에서는 사람이 움직이려는 의도를 로봇이 읽고, 딱 필요한 순간에 힘을 보태는 모습을 떠올려 보시면 좋겠습니다. 재활이나 일상생활 보조는 물론, 일할 때 몸에 가해지는 부담을 덜어주는 데에도 활용할 수 있습니다. 저희가 이야기하는 인간 중심 피지컬 AI를 아주 가까이에서 보여주는 연구입니다.", "여기는 여러 연구팀이 함께 사용하는 실험공간입니다. 로봇을 만드는 것도 중요하지만, 로봇과 사람이 실제로 어떻게 움직였는지를 정확히 측정하고 기록하는 일도 꼭 필요합니다. 그래서 이곳에서는 카메라와 측정장비를 이용해 움직임을 영상과 데이터로 남깁니다.\n\n예를 들어 사람이 손을 뻗어 컵을 잡았다고 해보겠습니다. 손이 어디서 출발했는지, 어느 방향으로 움직였는지, 언제 손목을 돌렸고 언제 컵을 잡았는지 알아야 로봇에게도 그 행동을 가르칠 수 있겠죠. 반대로 로봇이 목표대로 움직였는지 확인할 때도 이런 측정이 필요합니다.\n\n앞에서 보신 원격조작이나 손동작 센서처럼 사람의 행동을 데이터로 만드는 연구와도 연결됩니다. 이곳의 장비는 한 연구팀만 쓰는 것이 아니라 여러 팀이 함께 활용합니다. 서로 다른 전공의 연구자들이 같은 공간에서 실험하고 결과를 확인할 수 있다는 점도 연구소의 중요한 특징입니다.", "여기도 조규진 교수님 연구팀입니다. 앞에서는 몸에 입는 로봇을 봤다면, 여기서는 생물의 움직임과 종이접기에서 아이디어를 얻어 몸의 형태를 바꾸는 로봇을 소개해 드리겠습니다. 이와 관련한 연구를 ‘모픽(Morphic)’이라고 부릅니다.\n\n자연을 살펴보면 로봇에 응용할 만한 아이디어가 참 많습니다. 소금쟁이는 물 위에서 가라앉지 않고 뛰어오르고, 무당벌레는 날개를 작게 접어두었다가 순식간에 펼칩니다. 조규진 교수님과 김호영 교수님 연구팀은 소금쟁이가 물의 표면을 이용해 뛰는 원리를 작은 로봇으로 구현했고, 이 연구는 2015년 사이언스에 발표됐습니다.\n\n이런 연구에서 중요한 것은 겉모양을 그대로 흉내 내는 일이 아닙니다. 자연에서 효과적인 움직임의 원리를 찾아 로봇에 적용하는 것이죠. 종이접기도 마찬가지입니다.\n\n실제로 연구팀은 형태를 바꾸면서도 1톤급 차량의 무게를 견딜 수 있는 바퀴를 개발했습니다. 평평한 길에서는 일반 바퀴처럼 쓰고, 장애물이 있을 때는 모양을 바꿔 이동하도록 하는 방식입니다. 또 입을 크게 벌리는 펠리컨장어에서 아이디어를 얻어 작게 접혀 있다가 크게 늘어나는 부드러운 로봇도 만들었습니다.\n\n여기서 보실 핵심은 로봇이 움직이는 방법을 바꾸기 위해 몸의 구조 자체를 새롭게 설계한다는 점입니다. 환경과 목적에 맞춰 로봇의 형태가 바뀌면, 기존에는 하기 어려웠던 일도 가능해질 수 있습니다.", "이곳 역시 조규진 교수님 연구팀인데요. 앞의 모픽이 로봇의 몸과 형태에 관한 연구였다면, 이곳은 로봇이 물건을 실제로 어떻게 잡을지에 초점을 맞춥니다. 사람 손을 닮은 로봇 손과 다양한 모양의 집게 장치를 연구하고 있습니다.\n\n먼저 이 로봇 손은 와이어로 손가락을 움직입니다. 우리 손도 근육이 만든 힘을 힘줄을 통해 전달해 손가락 관절을 움직이죠. 로봇도 비슷하게 모터의 힘을 와이어로 전달할 수 있습니다.\n\n그런데 로봇 손을 만드는 데에는 또 다른 어려움이 있습니다. 컵을 잡을 때, 동전을 집을 때, 깨지기 쉬운 물건을 들 때 모두 손가락 모양과 힘이 달라야 하죠. 손가락을 많이 움직이게 만드는 것만큼 상황에 맞게 정확히 쓰는 일이 중요합니다.\n\n조금 색다른 연구도 있습니다. ‘모그립(MOGrip)’이라는 장치인데요. 물건 하나를 집을 때마다 목적지까지 왕복하는 대신, 여러 물건을 하나씩 집어서 손 안에 모아두고 한 번에 운반합니다. 2024년 사이언스 로보틱스에 발표된 연구로, 물류나 제조현장에서 로봇의 이동시간을 줄이는 방향으로 활용할 수 있습니다.\n\n이 밖에도 와이어 방식과 다른 움직임 방식을 조합하는 로봇 손 연구가 진행되고 있습니다. 현대모비스와 관련된 초기 연구도 포함되어 있는데, 공개되지 않은 세부 내용은 설명하지 않고 있습니다. 옆의 종이접기 구조물도 보실 수 있는데요.\n\n결국 이곳은 ‘로봇이 어떻게 다양한 물건을 사람처럼 집고 다룰 수 있을까’를 연구하는 곳입니다. 인공지능이 물체를 알아보고 잡을 것을 결정하더라도 마지막으로 물건에 닿는 것은 로봇의 손이니까요.", "이곳은 기계공학부 이동준 교수님 연구팀의 로봇 학습 연구입니다. 이 연구팀은 로봇이 움직이는 원리와 제어, 물체를 다루는 기술, 가상환경을 이용한 실험 등을 폭넓게 연구하고 있습니다. 여기서는 특히 실제 로봇을 움직이기 전에 컴퓨터 안에서 충분히 연습시키는 방법을 보실 수 있습니다.\n\n화면 속에 로봇과 물체, 주변 환경을 만들어두고 같은 작업을 여러 번 반복합니다. 예를 들어 접시를 원하는 위치로 밀어 옮겨야 한다면, 로봇이 어디를 밀지, 어느 방향으로 밀지, 얼마만큼 힘을 줄지를 계속 바꿔가며 연습하는 겁니다. 잘된 행동에는 좋은 점수를, 잘 안 된 행동에는 낮은 점수를 주면서 점차 성공하는 방법을 찾아갑니다.\n\n가상환경에서 연습하면 실제 장비로 매번 실험하는 것보다 훨씬 다양한 상황을 반복해 볼 수 있습니다. 물체의 위치나 로봇의 자세를 바꾸고, 성공과 실패를 계속 기록할 수 있죠. 다만 가상환경이 현실과 너무 다르면 배운 동작이 실제 로봇에서는 잘되지 않을 수 있습니다.\n\n앞에서 박종우 교수님 연구는 사람이 로봇에게 직접 시범을 보여주는 방식이었죠. 이곳은 로봇이 컴퓨터 안에서 스스로 수없이 시도해 보게 하는 방식입니다. 둘 다 로봇이 행동을 배우는 데 도움이 됩니다.\n\n조금 뒤에는 이 연구팀에서 실제로 실험하는 휴머노이드 로봇도 보실 겁니다. 여기에서 컴퓨터로 연습한 움직임을 실제 로봇에서 어떻게 구현하는지 이어서 설명드리겠습니다. 이곳은 로봇이 현실로 나오기 전에 연습하는 ‘가상 훈련장’이라고 생각하시면 됩니다.", "여기는 기계공학부 김아영 교수님 연구팀입니다. 로봇이 카메라와 센서를 이용해 주변을 보고, 물체와 자신의 위치를 알아낸 뒤 스스로 움직이고 작업하도록 하는 기술을 연구하고 있습니다.\n\n사람은 테이블 위에 컵과 병이 놓여 있으면 바로 구분하고 원하는 물건을 집을 수 있죠. 하지만 로봇은 먼저 화면에서 물체를 찾아야 하고, 정확히 어디에 놓였는지, 어느 방향으로 놓였는지, 손을 어느 쪽에서 가져가야 할지 차례대로 판단해야 합니다.\n\n특히 까다로운 것이 유리컵이나 투명 플라스틱 통입니다. 투명한 물체는 빛이 통과하거나 반사되기 때문에 카메라로 모양과 거리를 정확히 알아내기가 쉽지 않습니다. 배경과 조명에 따라서도 다르게 보이고요.\n\n이를 위해 ‘TRansPose’라는 대규모 데이터도 만들었습니다. 투명한 물체와 일반 물체 99종을 대상으로 33만 장이 넘는 이미지와 약 400만 개의 표시 정보를 모았습니다. 일반 카메라 영상과 거리 정보에 열을 감지하는 영상까지 함께 활용합니다.\n\n앞에서 로봇 손을 봤다면, 여기서는 그 손이 어디로 가야 하는지 알려주는 ‘로봇의 눈’을 본다고 생각하시면 됩니다. 보고, 위치를 알아내고, 실제로 집는 과정이 이어져야 로봇이 스스로 일을 할 수 있습니다.", "여기는 조규진 교수님 연구실에서 박사학위를 받은 정순필 박사가 개발한 이동식 3D 프린팅 로봇입니다. 아주 큰 구조물을 만들 수 있는 3D 프린터를 작게 접어서 이동하고, 작업할 장소에서 다시 크게 펼친다는 아이디어입니다.\n\n큰 건축 구조물을 출력하려면 보통 그만큼 큰 프린터가 필요합니다. 그런데 이 시스템은 이동할 때 대략 높이와 지름이 각각 90센티미터 정도로 줄어듭니다. 현장에서 펼치면 높이가 약 3.6미터, 바닥 폭이 약 3.2미터인 큰 틀이 됩니다.\n\n이렇게 하려면 작게 접히면서도 펼친 뒤에는 충분히 튼튼해야 합니다. 연구팀은 구조물을 접고 돌돌 말아 보관하는 방법을 결합했습니다. 좁은 공간에는 작게 넣어두고, 필요할 때 길게 펼쳐 실제 작업에 쓸 수 있게 만든 것입니다.\n\n2024년에는 이 기술로 미국 보스턴에서 열린 로봇 대회에서 1위를 차지하기도 했습니다. MIT, 하버드, 스탠퍼드 등 여러 대학 팀이 참가한 대회였습니다. 현장에서는 약 1.2미터 높이의 구조물을 직접 출력하는 시연도 진행했습니다.\n\n이 기술은 건설현장이나 재난현장처럼 필요한 장소에 장비를 가져가 그 자리에서 구조물을 만들 수 있다는 장점이 있습니다. 더 먼 미래에는 사람이 가기 어려운 달이나 화성에서 구조물을 만드는 데 활용하는 구상도 있습니다.\n\n앞에서 보신 모픽 연구가 ‘로봇의 몸을 접었다 펼치는 원리’였다면, 이곳은 그 원리가 실제로 일하는 큰 장비가 된 사례입니다. 작게 이동해서 현장에서 크게 변신하는 3D 프린터라고 생각하시면 쉽습니다.", "여기는 기계공학부 임종우 교수님 연구팀입니다. 카메라로 촬영한 영상을 이용해 로봇이 자신이 어디 있는지 알아내고, 주변 공간을 입체적으로 이해하도록 하는 기술을 연구하고 있습니다.\n\n이곳에서 보여드릴 것은 실제 공간을 촬영해 컴퓨터 안에 3차원으로 다시 만드는 기술입니다. 내비게이션의 거리뷰를 생각하시면 비슷한 출발점인데요. 여기서는 단순히 사람이 화면으로 둘러보는 것을 넘어, 로봇이 그 공간을 이해하고 움직이는 데 활용할 수 있게 만드는 것이 목표입니다.\n\n사진 한 장만 봐도 우리는 방에 책상과 의자가 있다는 것을 알 수 있습니다. 하지만 로봇이 실제로 방 안을 움직이려면 벽까지 얼마나 떨어졌는지, 책상이 정확히 어디 있는지, 어디로 지나갈 수 있는지까지 알아야 합니다. 연구팀은 여러 위치에서 촬영한 영상을 연결해 거리와 깊이를 계산하고, 공간의 모습을 입체적으로 만들어냅니다.\n\n대표적인 연구로는 여러 대의 넓은 시야 카메라를 활용해 주변 360도를 살펴보면서 로봇의 위치와 주변 지도를 함께 추정하는 기술이 있습니다. 이런 기술은 이동로봇이나 자율주행차가 길을 찾는 데에도 도움이 됩니다.\n\n컴퓨터 안에 실제와 비슷한 공간이 만들어지면, 로봇을 그곳에 먼저 넣어 동선을 시험하거나 여러 상황을 연습시킬 수 있습니다. 앞에서 이동준 교수님 연구팀이 가상의 훈련장에서 로봇을 학습시켰다면, 이곳은 그 훈련장에 쓸 수 있는 현실 공간의 입체 지도를 만드는 기술이라고 생각하시면 됩니다.", "앞에서 이동준 교수님 연구팀이 컴퓨터 안에서 로봇을 연습시키는 기술을 보셨죠. 이번에는 그 연구를 실제 로봇에 적용하는 쪽을 살펴보겠습니다. 여기에는 사람처럼 머리와 몸통, 팔과 다리를 가진 휴머노이드 로봇이 놓여 있고, 연구팀이 실제 실험에 활용하고 있습니다.\n\n휴머노이드는 생각보다 제어하기가 까다롭습니다. 로봇 팔 하나를 움직이는 것과 달리 다리, 몸통, 팔이 한꺼번에 움직이기 때문입니다. 사람이 테이블에 다가가 물건을 집는 모습을 떠올려 보세요.\n\n특히 균형을 유지하는 일이 중요합니다. 팔을 앞으로 뻗기만 해도 몸의 무게중심이 바뀔 수 있고, 한 발을 옮기면 바닥에 닿는 위치와 힘도 달라집니다. 로봇은 이런 변화를 계산하면서 몸 전체가 안정적으로 움직이도록 조절해야 합니다.\n\n그럼 아까 가상공간에서 연습한 동작을 그대로 가져오면 될까요? 실제로는 그렇게 간단하지 않습니다. 컴퓨터에서는 바닥 상태나 마찰, 관절의 움직임을 일정하게 설정할 수 있지만 현실에서는 작은 차이가 계속 생깁니다. 이를 ‘시뮬레이션에서 현실로 옮기는 과정’이라고 이해하시면 됩니다.\n\n이 휴머노이드를 보면 앞에서 소개한 연구들이 어떻게 연결되는지도 알 수 있습니다. 카메라로 주변을 보고, 손과 센서로 물체를 잡고 힘을 느끼고, 인공지능으로 행동을 배우고, 몸 전체를 제어해 실제로 움직이는 것입니다. 기술 하나만으로는 이런 행동을 구현하기 어렵고, 여러 기술이 함께 맞물려야 합니다.\n\n앞의 이동준 교수님 공간이 로봇의 ‘가상 훈련장’이었다면, 여기는 훈련한 동작이 실제 몸에서 제대로 되는지 확인하는 ‘현실 실험장’인 셈입니다. 저희가 이야기하는 피지컬 AI가 컴퓨터 속의 판단을 실제 로봇의 행동으로 연결하는 과정이라고 이해하시면 좋겠습니다.", "지금까지 로보틱스연구소에서 진행하는 여러 연구를 함께 살펴봤습니다. 유연하게 구부러지는 로봇, 사람의 시범을 보고 배우는 로봇, 힘과 손동작을 읽는 센서, 몸에 입는 로봇, 모양이 바뀌는 로봇과 로봇 손, 가상공간에서 배우는 기술, 물체와 주변 공간을 알아보는 카메라 기술, 현장에서 펼쳐 사용하는 3D 프린팅 로봇, 그리고 실제 휴머노이드 실험까지 다양한 연구가 이어지고 있습니다.\n\n하나하나 보면 서로 다른 연구처럼 보일 수 있지만, 결국 로봇이 현실에서 사람과 함께 일하려면 모두 필요한 기술입니다. 주변을 볼 수 있어야 하고, 무엇을 할지 판단하고 배워야 하며, 몸을 안전하고 정확하게 움직여야 합니다. 물건을 잡거나 사람을 도우려면 손과 센서, 부드러운 구조도 중요하죠.\n\n현재 약 80명의 교수님이 연구소에 직간접적으로 참여하고, 그중 41명이 국가연구소 NRL 2.0 사업에 직접 참여하고 계십니다. 연간 약 100억 원의 연구 지원을 바탕으로 최대 10년 동안 핵심기술을 발전시키고, 기업과의 공동연구, 기술이전과 창업 지원도 함께 확대할 예정입니다. 연구성과가 연구실을 넘어 산업과 실제 생활에 활용되도록 하는 것이 중요한 목표입니다.\n\n앞서 소개해 드린 것처럼 새로운 로보틱스연구소 건물도 준비하고 있습니다. 이곳의 연구는 앞으로도 계속 진행되기 때문에 전시된 로봇과 장비 역시 새로운 성과에 맞춰 달라질 수 있습니다. 오늘 보신 것은 저희가 진행하고 있는 여러 연구의 일부이지만, 서울대학교가 어떤 방향으로 피지컬 AI를 연구하고 있는지 이해하시는 데 도움이 되었으면 합니다.\n\n이상으로 로보틱스연구소 투어를 마치겠습니다. 오늘 보신 연구나 연구소에 대해 궁금하신 점이 있으면 편하게 질문해 주세요. 함께해 주셔서 감사합니다."], "en": ["Hello, I'm ___, and I'll be guiding today's tour of the Robotics Institute at Seoul National University. I currently work here at the Institute in the ___ team. I'll start with a short introduction to the Institute, and then walk you through some of the main research projects going on in this space.\n\nThe SNU Robotics Institute is a hub that connects robotics research from across many different fields at Seoul National University. About 80 professors take part, directly or indirectly, from areas like mechanical engineering, electrical and computer engineering, computer science, and materials science, as well as medicine, public health, and brain and cognitive science.\n\nBased on this research strength, the Institute was selected in 2026 for a new national research program called NRL 2.0, run by Korea's Ministry of Science and ICT and Ministry of Education. Of the roughly 80 professors connected to the Institute, 41 are directly involved in this program. It's a large, long-term project — about 10 billion won in government funding per year, for research that can continue for up to ten years.\n\nThe main direction the Institute is working toward is what we call 'human-centered Physical AI.' Physical AI means building AI that can sense and understand its surroundings through a robot's body in the real, physical world — and then move and interact with people accordingly. To do this, we bring together many different technologies: a robot's structure and materials, its actuators (the parts that create movement), sensors and touch, computer vision, control systems, and AI and learning. The goal is to connect these technologies to support people's everyday lives and work, to assist and extend what the human body can do, and to develop human-centered robot technology that can be used in real settings like industry and healthcare.\n\nPlease note that this is a working research space, and the equipment you'll see today is actively used in real experiments. For everyone's safety, please don't touch or operate anything on your own — feel free to look, and we'll walk you through the details.", "This is a robot from the lab of Professor Ahn Seung-hoon in the Department of Mechanical Engineering. His team works broadly on connecting materials, design, and manufacturing to build robots and structures with new capabilities.\n\nWhat's here is a flexible, segmented robot — a bit like an elephant's trunk. Think of a typical industrial robot arm: it has a handful of joints, each rotating in a fixed direction to change the arm's position. This robot instead has many small sections connected in a row, all moving together.\n\nThe easiest way to think about this robot is through the question: 'how flexible can we make a robot?' A typical robot arm is very good at precisely moving a fixed set of joints. This segmented robot instead focuses on using the movement and deformation of many parts together, so it can adapt its shape to whatever it's working with. As robots move beyond structured factory settings into spaces with people and irregularly shaped objects, this kind of flexible structure and movement will likely become more and more useful.", "This is robot-learning research from the lab of Professor Park Jong-woo in the Department of Mechanical Engineering. His team has long worked on mathematically modeling and controlling robot motion, and more recently has been combining this with AI and data-driven learning methods.\n\nThis space is about how a person teaches a robot a task. For a robot to pick up and move different objects the way a person does, it first needs to learn what to do in different situations. When a person directly controls the robot remotely to carry out a task, the robot can record data along the way — how the arm moved, where exactly it grasped the object, and in what order the steps happened.\n\nThis approach matters a lot when teaching a robot something new. For a person, picking up a cup and moving it somewhere else needs no explanation at all.", "This is sensor technology from the lab of Professor Park Yong-rae in the Department of Mechanical Engineering. His team works on soft robots, sensors, and actuators built from soft, flexible materials.\n\nTwo technologies are on display here. One is a 3-axis force sensor that measures force at a robot's fingertip. The other is a glove based on liquid metal that measures how a person's fingers move.\n\nThe 3-axis force sensor measures the force a robot feels from several directions when it touches an object. When a robot grips something, it's not enough to know where the object is — it also needs to know how hard it's actually pressing. Grip too lightly, and you drop a cup; grip too hard, and you might damage it or spill the contents.\n\nThe glove next to it works in the opposite direction. When a person wears the glove and moves their fingers, a flexible sensor inside tracks the movement and the changing angles of the finger joints. This sensor uses liquid metal — a metal that conducts electricity but, unlike a solid metal, doesn't hold a rigid shape.", "This is wearable-robot research from the lab of Professor Cho Kyu-jin in the Department of Mechanical Engineering, who also directs the Robotics Institute. His team researches soft robots, wearable robots, biomimetic robots (robots inspired by living things), and shape-changing mechanisms based on the principles of origami.\n\nOn display here are assistive devices and wearable robots that a person wears directly on the body. You can think of a wearable robot as the kind of robot that interacts with a person at the closest possible range.\n\nOne well-known example from Professor Cho's team is the Exo-Glove line, which assists hand function. A user who has difficulty moving their hand wears it like a glove, and the robot helps move the fingers with enough force to grip objects.", "This is a shared research space used by several different teams. In robotics research, building the robot itself is only part of the job — it's just as important to accurately measure and record how a robot, a person, and their surroundings actually move.\n\nFor example, imagine studying the motion of a person reaching out and grasping an object. It's a completely natural movement for a person, but to teach it to a robot, you need to turn it into data: where the hand started, what path it followed, how the wrist changed direction, and the exact moment it grasped the object. The same goes for analyzing a robot's own movement — you need objective data on whether it followed its intended path accurately, and how much its actual movement differed from what was calculated.\n\nAs Physical AI research grows, this kind of data becomes even more important. For a robot to learn how to act in the real world, it needs physical data — not just images and text, but data about how people and robots move, how they make contact with objects, and how the surrounding space changes.", "This is 'Morphic' research from the lab of Professor Cho Kyu-jin. One important research area for his team is biomimetic robots and origami-based robots. They observe the movement and structure of living things in nature, and apply the underlying principles to a robot's body and mechanisms.\n\nIt's easiest to think of biomimetics not as copying nature exactly, but as finding the underlying principle behind an especially effective natural movement and applying it to a robot. A well-known example is the water strider robot, developed by Professor Cho's team together with Professor Kim Ho-young's team. They analyzed how a water strider moves its legs to jump on the surface of water, using the water's surface tension, and built a small robot based on that principle.\n\nA ladybug's wings also inspired a robot structure. A ladybug can fold its wings into a small body and unfold them quickly when needed. The team applied this idea to an origami-based structure, creating wings that fold up small, unfold quickly, and stay stiff enough for flight once open.\n\nThe Morphic research here follows the same idea. The key point is that instead of keeping one fixed shape, a robot's body or parts change shape to match the task or the surrounding environment. It might move or store itself in a small, compact form, then unfold to a larger size when it's time to work.", "This is also robot hand and gripper research from Professor Cho Kyu-jin's team. Unlike the Morphic research, where the robot's body and structure change shape to fit the environment, this space is about how a robot actually makes contact with and grips real objects. Building on soft robotics and biomimetic design, the team continues to research prosthetic hands, robot hands, and grippers of many different forms — prosthetic hand research, in particular, is treated as its own major focus within the lab, applying the structure and movement of a human hand to a robot mechanism.\n\nFirst is a robot hand driven by tendons — essentially wires that play a role similar to the tendons in a human hand. In a human hand, the muscles aren't attached directly to every joint; instead, force created in the muscle travels through a tendon, and that force moves several joints at once. A robot hand can use the same idea, transmitting force generated by a motor through a wire all the way to the fingers.\n\nThis approach has clear advantages for a robot hand with as many joints as a human hand. Just one finger already has several joints moving together, and once you add five fingers and a wrist, there's a huge number of individual movements to create. If you placed a motor and gearbox at every single joint, the hand would quickly become too large and heavy.\n\nGripper research allows for a somewhat different approach, tailored to a specific task rather than copying the human hand exactly. Inspired by how a person can gather several objects in one hand before carrying them all at once, Professor Cho's team recently developed a gripper called MOGrip, designed to hold multiple objects.", "This is robot simulation and learning research from the lab of Professor Lee Dong-jun in the Department of Mechanical Engineering. His team works broadly on robot dynamics and control, manipulation, simulation, teleoperation, haptics, autonomous robots, and aerial robotics. One important part of their recent research is using physically realistic simulation to let robots experience many different situations and learn how to behave before those behaviors are tested on a real robot.\n\nWhat you see here is essentially a virtual training environment for robots. A robot, the objects around it, and the surrounding environment are recreated inside a computer, and the robot can repeatedly practice tasks such as pushing, picking up, or moving objects.\n\nOne important learning method used in this kind of environment is reinforcement learning. The robot tries different actions and receives a reward depending on how well those actions achieve the goal. For example, if the task is to move an object to a target position, the robot can repeatedly try different contact points, pushing directions, forces, and arm trajectories, gradually learning which actions work best.\n\nLater in the tour, you'll see an actual humanoid robot used by Professor Lee's team. The important connection is that the learning and control methods developed here do not remain only inside the computer.", "This is robot perception and object-grasping research from the lab of Professor Kim Ah-young in the Department of Mechanical Engineering. Professor Kim leads the RPM Robotics Lab, researching how a robot can recognize its surroundings and nearby objects, figure out its own position, and use that information to move and act on its own. Her main research areas are environmental perception, sensor fusion, and autonomous robot navigation, and more recently, her team has also been actively researching how a robot can accurately recognize and manipulate objects.\n\nThis space is about how a robot uses a camera to recognize objects, find the one it wants, and actually pick it up. A person can glance at several items on a table and instantly tell a cup from a bottle, then naturally reach out and grab the one they want. A robot first has to look at the scene through a camera and figure out what objects are where.\n\nOne especially important focus here is transparent objects — think of a glass cup or a clear plastic container. Light passing through a camera can reflect off the surface of such an object or pass straight through it, and its appearance changes a lot depending on the background and lighting.\n\nTo support this work, the team built a large dataset called TRansPose, covering 99 kinds of transparent and regular objects, with more than 330,000 images and around four million annotations. It combines standard RGB images and depth information with thermal infrared data, so that transparent objects can be recognized more accurately. It's a good illustration of just how much recognition data and technology is needed for a robot to reliably handle something as ordinary — to us — as glass or clear plastic.", "This is research on a mobile, deployable 3D-printing robot, developed by Dr. Jung Soon-pil, who earned his PhD in Professor Cho Kyu-jin's lab. The core idea is a 3D printer that can fold down to a small size for transport, then expand at the job site to print large structures.\n\nThe system he built folds down to about 0.9 meters in height and diameter when packed — roughly the size of a large box. Once work begins, it unfolds into a large frame about 3.6 meters tall with a base around 3.2 meters wide — several times larger than its packed size.\n\nThe key robotics technology here is a deployable structure that can freely expand and shrink the printer's size. Dr. Jung's team developed a 'Fold-and-Roll' structure that combines folding with rolling for storage — a long robotic arm can be folded and rolled up into a small space, then extended back out when it's time to work.\n\nIn 2024, this technology was built into a full-scale, large 3D-printing system and entered in the Form & Function Robotics Challenge, run by MassRobotics in Boston, USA — winning first place against teams from MIT, Harvard, Cornell, Stanford, and other universities. At the time, the system packed down to a base of about 0.8 meters and a height of about 0.75 meters, and unfolded into a triangular-pyramid shape up to 3.4 meters at the base and 3.6 meters tall. On site, using a 1.2mm nozzle and PLA plastic, it printed a 1.2-meter-tall structure made of about 2,000 printed layers as a live demonstration.", "This is robot vision research from the lab of Professor Lim Jong-woo in the Department of Mechanical Engineering. Professor Lim leads the Robot Vision Lab, researching how a robot can use a camera to understand the space around it.\n\nThis space focuses on using footage of a real location to build a realistic 3D digital version of that space. If you've ever used the street-view feature in a car navigation app, that's a helpful comparison — but here, the goal goes a step further: turning a real space into a 3D digital environment that a robot can actually use. Cameras capture the real environment from many positions and angles, and the system calculates the spatial relationship between each image.\n\nA single photograph helps explain why this technology is needed. Looking at a photo, a person can roughly understand a room, or recognize a desk or a chair.\n\nTaking this a step further makes it possible to recreate a real space as a digital environment. A real robot can be placed directly into this digital space, or a virtual robot can be placed there first to test out different tasks — changing its movement path, checking what its sensors would see from different positions, and training it on how to behave in specific situations. If Professor Lee Dong-jun's virtual simulation is a robot's 'training ground,' then this can be understood as the technology that builds the actual 3D map of a real space to use in that training ground.", "Earlier, we looked at Professor Lee Dong-jun's research on simulation-based robot learning. Here, we can see the other side of that research much more directly: an actual humanoid robot being used as an experimental platform.\n\nA humanoid robot is a particularly challenging system because it has to control many parts of its body at the same time. Instead of moving only a single robot arm, it may need to coordinate its legs, torso, arms, and hands while maintaining balance and interacting with objects. Even a task that looks simple to us — walking toward a table and reaching for an object — involves controlling the whole body as one connected system.\n\nThis is where Professor Lee's long-standing research in robot dynamics and control becomes important. The robot has to calculate how its own body will move, how forces are transmitted through its joints, how contact with the ground or an object changes that motion, and how to adjust its movement in real time.\n\nThe humanoid here is used to test these kinds of control and learning technologies on a real physical system. Movements that are first developed or trained in simulation can be transferred to the robot and tested under real conditions. This is often called sim-to-real: taking what the robot has learned in a simulated environment and making it work on actual hardware.\n\nYou can also connect this back to several technologies we've already seen on the tour. Robot vision can tell the humanoid where an object is. Robot hands and grippers determine how it physically makes contact with that object.", "That covers a selection of the research currently underway at the SNU Robotics Institute. From flexible robot structures and sensors, to learning technology where a robot is taught by a person, wearable robots worn directly on the body, biomimetic and shape-changing robots, robot hands and grippers that manipulate objects directly, simulation that trains robots in virtual environments, robot vision that can recognize and grasp even transparent objects, large 3D-printing robots that deploy on site, technology that turns real spaces into digital environments, and humanoid robots that bring learning, balance, and whole-body control into real-world experimentation — a wide range of research is underway.\n\nEach of these research areas is quite different on its own, but they connect naturally under the idea of Physical AI. For a robot to act in the real world, it first needs to perceive its surroundings and the people in them. It also needs the ability to decide what to do and learn from its actions.\n\nThis is also where the strength of the SNU Robotics Institute lies. About 80 professors currently take part in the Institute directly or indirectly, and 41 of them are directly involved in the NRL 2.0 program.\n\nThat brings us to the end of the SNU Robotics Institute tour. If you have any questions about the research you've seen today, or about the Institute itself, please feel free to ask. Thank you for joining us."]}, "short": {"ko": ["안녕하세요. 오늘 서울대학교 로보틱스연구소 투어를 안내해 드릴 ○○○입니다. 저는 연구소에서 ○○○ 업무를 맡고 있고요. 먼저 연구소를 짧게 소개해 드리고, 이쪽에 보이는 주요 연구들을 함께 살펴보겠습니다.\n\n저희 로보틱스연구소는 서울대학교의 여러 전공에서 진행하는 로봇 연구를 연결하는 곳입니다. 기계공학이나 전기·컴퓨터공학뿐 아니라 재료, 의학, 보건, 뇌인지과학 등 다양한 분야의 교수님 약 80명이 직간접적으로 참여하고 있습니다. 로봇을 만드는 기술부터 주변을 알아보는 센서, 인공지능, 사람을 돕는 로봇까지 연구 범위가 넓습니다.\n\n2026년에는 국가연구소 사업인 NRL 2.0에 선정됐습니다. 이 사업에는 교수님 41명이 직접 참여하고, 연간 약 100억 원 규모의 연구비를 지원받아 최대 10년 동안 함께 연구하게 됩니다. 2026년 8월 18일에는 국가연구소 개소식도 열었습니다.\n\n연구소가 추구하는 방향은 '인간 중심의 피지컬 AI'입니다. 요즘 AI는 글을 쓰거나 이미지를 이해하는 데도 쓰이죠. 피지컬 AI는 한 걸음 더 나아가 로봇이 실제 공간을 보고, 판단하고, 직접 움직이게 하는 기술입니다. 사람을 대신해 위험한 일을 하거나, 몸의 움직임을 돕거나, 일상에서 필요한 작업을 수행하는 로봇을 떠올리시면 됩니다.\n\n앞으로 연구소는 기업과의 공동연구와 기술사업화, 창업 지원도 넓혀갈 예정입니다. 이 건물 뒤쪽에는 별도 연구소 건물을 지을 부지도 마련돼 있고, 약 2년 후 새 공간으로 이전하는 것을 계획하고 있습니다.\n\n오늘 보실 장비들은 실제 연구에 쓰는 장비들입니다. 안전을 위해 직접 만지거나 조작하지는 마시고, 편하게 둘러보시면서 궁금한 점을 말씀해 주세요.", "여기 보이는 로봇은 안성훈 교수님 연구팀에서 만든 유연한 분절형 로봇입니다. 코끼리 코처럼 마디가 여러 개 이어져 있는 모습이죠.\n\n우리가 흔히 보는 산업용 로봇 팔은 몇 개의 관절을 정해진 방향으로 움직입니다. 그런데 이 로봇은 여러 마디가 함께 움직여서 전체 모양이 바뀝니다. 그래서 모양이 제각각인 물체도 그 형태에 맞춰 감싸 잡을 수 있습니다.\n\n안성훈 교수님 연구팀은 로봇을 움직이는 프로그램뿐 아니라 어떤 재료와 구조를 쓰면 이런 움직임이 가능할지도 함께 연구합니다. 예를 들어 열이나 전기를 가하면 원래 모양으로 돌아가려는 특수 금속을 천과 결합해, 스스로 굽혀지거나 비틀리는 부드러운 장치를 개발하기도 했습니다.\n\n핵심은 로봇 몸체 자체를 유연하게 만드는 겁니다. 앞으로 로봇이 공장 밖으로 나와 사람 곁에서 일하려면, 크기와 모양이 일정하지 않은 물건을 다루는 능력이 중요해질 텐데요. 이 로봇이 그런 가능성을 보여주는 사례입니다.", "이번에는 로봇에게 새로운 일을 어떻게 가르치는지 보겠습니다. 이곳은 박종우 교수님 연구팀의 원격조작과 로봇 학습 연구입니다.\n\n사람은 컵 하나를 들어 옮기는 일을 별생각 없이 합니다. 그런데 로봇에게는 컵이 어디 있는지 찾고, 어느 방향으로 손을 가져가고, 얼마나 세게 잡을지 결정하는 일이 모두 필요합니다.\n\n그래서 사람이 먼저 로봇을 원격으로 조작해서 작업을 보여줍니다. 그러면 로봇은 팔이 어떻게 움직였는지, 물체를 어디에서 잡았는지, 어떤 순서로 움직였는지를 기록할 수 있습니다. 이 기록을 모아 로봇이 사람의 동작을 따라 배우도록 하는 거죠.\n\n우리가 인터넷에서 글과 사진을 쉽게 구할 수 있는 것과 달리, 로봇이 물건을 실제로 잡거나 움직이는 데이터는 직접 모아야 하는 경우가 많습니다. 이곳은 그 데이터를 만들고 로봇을 훈련시키는 연구를 소개하는 공간입니다.", "이곳은 박용래 교수님 연구팀의 센서 기술입니다. 로봇 손끝의 힘을 여러 방향으로 측정하는 3축 포스센서와, 사람의 손동작을 읽는 액체금속 장갑이 함께 전시되어 있습니다.\n\n포스센서는 로봇이 물체를 접촉할 때의 힘을 측정해 깨지기 쉬운 물체도 섬세하게 다룰 수 있게 돕고, 액체금속 장갑은 손가락이 굽혀지고 늘어나도 센서 기능을 유지하며 사람의 손동작을 로봇이 활용할 데이터로 바꿔줍니다.", "이곳은 조규진 교수님 연구팀의 웨어러블 로봇 연구입니다. 대표작인 Exo-Glove는 유연한 소재와 텐던으로 손가락 움직임을 보조하며, 최근에는 카메라와 AI로 사용자의 의도를 파악하는 연구까지 이어지고 있습니다.\n\n센서가 사람의 상태를 읽고 로봇이 판단해 힘을 보태는, 인간 중심 Physical AI가 신체와 직접 연결되는 대표 사례입니다.", "이곳은 여러 연구팀이 함께 사용하는 실험 공간입니다. 카메라와 측정 장비로 사람이나 로봇이 어떻게 움직였는지 기록합니다.\n\n예를 들어 사람이 물건을 집는 모습을 촬영하면 손이 어디서 출발했는지, 어떤 경로로 움직였는지, 언제 물건을 잡았는지를 데이터로 만들 수 있습니다. 로봇이 원래 계획한 대로 정확하게 움직였는지 확인하는 데도 쓰이고요.\n\n로봇에게 실제 세계의 움직임을 가르치려면 이런 데이터가 꼭 필요합니다. 서로 다른 연구팀이 같은 장비와 공간을 공유하면서 실험하고, 연구 결과를 확인할 수 있다는 점에서도 의미가 있습니다.", "마지막으로 보실 곳은 조규진 교수님 연구팀의 모픽(Morphic) 연구입니다. 쉽게 말하면 로봇이 주변 환경과 해야 할 일에 맞춰 몸의 형태를 바꾸는 기술입니다.\n\n자연을 살펴보면 좋은 아이디어가 많습니다. 연구팀은 소금쟁이가 물 위에서 뛰는 원리를 연구해 소금쟁이 로봇을 만들었고, 무당벌레가 날개를 접었다 펴는 방식에서 아이디어를 얻어 접히는 로봇 날개도 개발했습니다.\n\n종이접기처럼 접고 펼치는 구조도 중요한 연구 주제입니다. 좁은 곳에서는 작게 접혀 있다가, 넓은 공간에 나오면 크게 펼쳐지는 로봇을 생각하시면 됩니다. 실제로 연구팀은 형태를 바꿀 수 있는 바퀴나 부드러운 로봇 구조물도 연구해 왔습니다.\n\n여기서 중요한 건 로봇의 똑똑함이 꼭 컴퓨터 프로그램에만 있는 건 아니라는 점입니다. 어떤 몸체를 만들고 어떻게 움직이게 하느냐에 따라서도 로봇이 할 수 있는 일이 크게 달라집니다.", "이곳도 조규진 교수님 연구팀의 로봇 핸드와 그리퍼입니다. 텐던, 즉 와이어로 힘을 전달하는 방식이라 모터를 손가락에서 떨어뜨려 배치할 수 있어, 사람 손처럼 많은 관절을 작고 가볍게 움직일 수 있습니다.\n\nMOGrip처럼 여러 물체를 손 안에 모아 한 번에 운반하는 그리퍼도 함께 개발 중이며, 현재는 텐던과 다른 구동방식을 결합한 하이브리드 로봇 손도 연구하고 있습니다.", "이곳은 이동준 교수님 연구팀의 로봇 시뮬레이션·학습 연구입니다. 가상환경에 로봇과 물체를 만들어 놓고, 물체를 밀거나 집고 옮기는 동작을 반복하며 강화학습으로 좋은 행동을 점차 찾아갑니다.\n\n로봇과 물체의 접촉, 충돌, 마찰을 실제처럼 계산하는 물리 시뮬레이션이 핵심이며, 로봇이 실제 세상에 나오기 전 다양한 행동을 연습하는 '가상의 훈련장'이라고 생각하시면 됩니다.", "이곳은 김아영 교수님 연구팀의 로봇 인식과 물체 파지 연구입니다. 카메라로 물체를 인식해 원하는 것만 집어내며, 빛이 통과하고 반사되는 유리컵 같은 투명물체 인식이 특히 중요한 연구 주제입니다.\n\n여러 물체가 놓여 있을 때 주변을 건드리지 않고 원하는 물체만 정확히 집는 기술도 함께 다루며, 그리퍼가 로봇의 손이라면 이 비전기술은 그 손을 이끄는 눈과 공간지각 능력이라고 볼 수 있습니다.", "이곳은 조규진 교수님 연구실 출신 정순필 박사의 이동식 3D 프린팅 로봇입니다. 이동할 때는 약 0.9m로 접혔다가, 현장에 도착하면 높이 3.6m, 밑변 3.2m의 대형 프레임으로 펼쳐져 구조물을 출력합니다.\n\n2024년 미국 MassRobotics 대회에서 1위를 차지했으며, 건설현장이나 재난현장은 물론 달·화성처럼 사람이 접근하기 어려운 환경의 구조물 제작까지 응용을 확장하고 있습니다.", "이곳은 임종우 교수님 연구팀의 로봇 비전 연구입니다. 여러 위치에서 촬영한 영상을 연결해 벽과 바닥, 물체의 위치를 계산하고, 실제 공간을 3차원 디지털 공간으로 재구성합니다.\n\n이렇게 만들어진 디지털 공간에는 가상의 로봇을 넣어 이동과 인식, 학습을 시험할 수 있어, 실제 공간을 로봇이 이해하고 활용할 수 있는 정보로 바꾸는 기술이라고 이해하시면 됩니다.", "이곳은 한경원 교수님 연구팀의 의료로봇 연구입니다. e-VaC는 혈관 바깥을 부드러운 액추에이터가 감싸고 심장박동에 맞춰 압력을 가해 혈류와 심장 기능을 돕는 장치이며, 옆의 심장 모사 장치로 반복 검증합니다.\n\n연구팀은 사람이 느끼는 힘과 촉감을 전달하는 햅틱 기술도 함께 연구하며, 센싱과 판단, 구동이라는 Physical AI 기술이 사람의 몸과 의료 분야로 연결되는 사례입니다.", "오늘은 짧은 코스라 안쪽 실험공간까지 들어가지는 않습니다. 안쪽에서는 로봇 손과 물체를 잡는 장치, 힘과 손동작을 측정하는 센서, 몸에 착용해 움직임을 돕는 로봇도 연구하고 있습니다. 또 카메라로 물체와 공간을 이해하는 기술, 컴퓨터 속 가상환경에서 로봇을 훈련시키는 기술, 실제 휴머노이드 로봇을 이용한 제어와 실험도 진행하고 있습니다. 작게 접었다가 현장에서 크게 펼쳐 사용하는 이동식 3D 프린팅 로봇 연구도 있습니다.\n\n이렇게 연구 주제는 다양하지만 결국 한 방향을 향하고 있습니다. 로봇이 주변을 이해하고, 행동을 배우고, 실제 몸을 움직여 사람과 함께 생활하고 일할 수 있게 만드는 겁니다. 저희 연구소는 여러 전공의 연구자들이 기술을 함께 발전시켜 이런 인간 중심의 피지컬 AI를 구현해 나가고자 합니다.\n\n이상으로 짧은 투어를 마치겠습니다. 궁금한 점 있으시면 편하게 질문해 주세요. 감사합니다."], "en": ["Hello, I'm ___, and I'll be your guide today at the Seoul National University Robotics Institute. I work here in the ___ team. I'll start with a short introduction, and then we'll look at a few of the research projects you can see in this area.\n\nThe Institute brings together robotics researchers from many different fields at Seoul National University. Around 80 professors are involved, directly or indirectly, from mechanical engineering, electrical and computer engineering, materials science, medicine, public health, brain science, and other areas. Their work covers everything from robot structures and sensors to AI and robots that help people.\n\nIn 2026, the Institute was selected for a major national research program called NRL 2.0. Forty-one professors are directly involved. The program provides around 10 billion Korean won a year in government research funding and can run for up to ten years. We held the opening ceremony for the national robotics institute on August 18, 2026.\n\nOur main goal is what we call human-centered Physical AI. Many of us know AI as something that works with text or images. Physical AI goes a step further: it lets a robot sense the real world, decide what to do, and physically take action. Think of robots that help people move, handle difficult jobs, or assist with everyday tasks.\n\nWe're also expanding joint research with companies, technology transfer, and support for new startups. Land for a dedicated Institute building has already been secured behind this building, and we're planning to move there in about two years.\n\nOne quick note before we start: this is an active research space, and the equipment is used for real experiments. Please look freely, but don't touch or operate anything unless a researcher invites you to do so.", "This robot comes from Professor Ahn Seung-hoon's team. It looks a little like an elephant's trunk, with many small sections connected together.\n\nA conventional industrial robot arm usually has a few joints that move in fixed directions. This robot works differently: many sections bend together, changing the overall shape. That allows it to wrap around objects and adapt to different shapes as it grips them.\n\nProfessor Ahn's team studies not only how to control a robot, but also which materials and structures can make new movements possible. For example, they've combined special metals that change shape when heated with fabric structures to create soft devices that bend and twist.\n\nThe big idea here is flexibility built into the robot's body. As robots move beyond highly organized factories and work around people and unfamiliar objects, that ability to adapt their shape could become very useful.", "Here we look at how people can teach robots new tasks. This is research from Professor Park Jong-woo's team on remote operation and robot learning.\n\nPicking up a cup seems effortless to us. But a robot has to find the cup, choose how to approach it, decide when to close its hand, and control how hard it grips.\n\nOne way to teach this is to let a person control the robot and demonstrate the task. As the person moves the robot, the system records where the arm moved, how it grasped the object, and the order of each action. Those recordings can then be used to train the robot.\n\nAI can learn language and images from huge amounts of online data. Data about real physical actions, however, often has to be collected directly. This research helps create the examples that a robot needs to learn to handle objects in the real world.", "This is sensor technology from Professor Park Yong-rae's lab: a 3-axis force sensor that measures force from several directions at a robot's fingertip, and a liquid-metal glove that reads human hand movement.\n\nThe force sensor lets a robot handle even fragile objects delicately, while the liquid-metal glove keeps working as a sensor even as it bends and stretches, turning human hand motion into data a robot can use.", "This is wearable-robot research from Professor Cho Kyu-jin's lab. Exo-Glove uses flexible material and tendons to assist finger movement, with newer work adding cameras and AI to sense user intent.\n\nA sensor reads the user, the robot decides, and an actuator adds force — a clear example of Physical AI connecting directly to the human body.", "This is a shared experimental area used by several research teams. Cameras and measurement tools record how people and robots actually move.\n\nFor example, when a person reaches for an object, researchers can record where the hand started, the path it followed, and the moment it made contact. They can also check whether a robot followed its planned movement accurately.\n\nThese measurements help researchers build training data and test their results. Sharing this space also makes it easier for teams working on different parts of robotics to collaborate.", "Our last main stop is Morphic research from Professor Cho Kyu-jin's team. The idea is to design robots whose bodies can change shape depending on what they need to do.\n\nNature provides some remarkable examples. The team developed a robot inspired by how water striders jump on water. They also studied how ladybugs fold and unfold their wings, and used that idea to make folding robot wings.\n\nOrigami, or paper folding, offers another approach. Imagine a robot that stays compact while moving through a narrow space, and then unfolds when it reaches a larger area. The team has also explored shape-changing wheels and soft structures based on similar ideas.\n\nAn important point is that a robot's capabilities do not come only from its software. Its materials, structure, and way of moving also determine what it can do in the real world.", "This is also robot hand and gripper research from Professor Cho's team. Tendons carry force from a motor placed away from the fingers, letting the hand move many joints like a human hand while staying small and light.\n\nGrippers like MOGrip, inspired by gathering several objects in one hand, can carry them all at once, and the team is now developing a hybrid hand combining tendons with other actuation methods.", "This is simulation and learning research from Professor Lee Dong-jun's lab. Inside a virtual environment, a robot repeatedly practices pushing, picking up, and moving objects, using reinforcement learning to gradually discover good behavior.\n\nThis relies on physics simulation that closely calculates contact, collision, and friction — think of it as a 'virtual training ground' before the robot ever acts in the real world.", "This is perception and grasping research from Professor Kim Ah-young's lab. A camera helps the robot recognize and pick up objects, with transparent ones like glass cups — where light passes through and reflects — as an especially challenging focus.\n\nThe team also works on grasping a target object without disturbing anything nearby; if the gripper is the robot's hand, this vision technology is the eyes guiding it.", "This is a deployable 3D-printing robot by Dr. Jung Soon-pil, from Professor Cho Kyu-jin's lab. It packs down to about 0.9m for transport, then unfolds on site into a frame 3.6m tall with a 3.2m base to print large structures.\n\nIt won first place at the 2024 MassRobotics competition in the US, and could extend to construction sites, disaster areas, or even hard-to-reach places like the Moon and Mars.", "This is robot vision research from Professor Lim Jong-woo's lab. By connecting images captured from multiple positions, the system calculates the location of walls, floors, and objects, reconstructing a real space in 3D.\n\nA virtual robot can be placed in this digital space to test movement, perception, and learning — turning a real space into information a robot can understand and use.", "This is medical-robotics research from Professor Han Kyung-won's lab. e-VaC wraps a blood vessel with a soft actuator that applies pressure in time with the heartbeat to support blood flow, tested repeatedly on a heart-simulation rig nearby.\n\nThe team also researches haptic technology conveying the sense of force and touch — showing how Physical AI's sensing, decision-making, and actuation connect to the human body and healthcare.", "For this shorter tour, we won't enter the inner experimental areas. Researchers there are working on robot hands and grippers, sensors that measure touch and hand movement, and wearable robots that help people move. Other projects use cameras to recognize objects and reconstruct spaces in 3D, train robots in virtual environments, and test control and learning on real humanoid robots. There's also research on mobile 3D-printing robots that fold small for transport and unfold at a work site.\n\nThese projects may look very different, but they all support the same goal: robots that can understand their surroundings, learn new actions, and physically work alongside people. By bringing together researchers with different specialties, the Institute aims to advance human-centered Physical AI.\n\nThat brings us to the end of our short tour. Please feel free to ask any questions. Thank you for visiting."]}}, "intro5": {"ko": "안녕하세요. 서울대학교 로보틱스연구소에 방문해 주셔서 감사합니다. 오늘 연구소를 간단히 소개해 드릴 ○○○입니다. 오늘은 실험실 안쪽까지 들어가지는 않고, 이곳에서 어떤 연구를 하는지, 앞으로 어디로 발전해 나갈지 소개해 드리겠습니다.\n\n저희 연구소는 서울대학교의 다양한 로봇 연구를 연결하는 곳입니다. 기계공학, 전기전자, 컴퓨터, 재료공학뿐 아니라 의학과 뇌인지과학 등 여러 분야의 교수님 약 80명이 직간접적으로 참여하고 있습니다. 로봇의 몸체와 관절을 만드는 기술, 주변을 보고 느끼는 센서, 인공지능, 움직임을 조절하는 기술까지 모두 함께 연구하고 있습니다.\n\n이러한 연구역량을 바탕으로 2026년 국가연구소 사업인 NRL 2.0에 선정됐습니다. 교수님 41명이 직접 참여하고, 연간 약 100억 원 규모의 연구비를 바탕으로 최대 10년 동안 함께 연구합니다. 지난 8월 18일에는 국가연구소 개소식도 개최했습니다.\n\n핵심 연구 방향은 '인간 중심의 피지컬 AI'입니다. 요즘 AI는 질문에 답하고 글과 그림도 만들죠. 피지컬 AI는 한 걸음 더 나아가 로봇이 현실세계에서 주변을 보고, 판단하고, 직접 움직여 사람을 돕게 하는 기술입니다.\n\n예를 들어 로봇이 테이블 위 컵을 집는다고 생각해 보겠습니다. 먼저 컵이 어디 있는지 보고, 손을 어디로 뻗을지 결정하고, 컵이 깨지거나 떨어지지 않게 잡는 힘까지 조절해야 합니다. 사람이 쉽게 하는 일이지만 로봇에게는 여러 기술이 함께 필요한 어려운 작업입니다.\n\n이곳에서는 부드럽게 휘어지는 로봇이나 손처럼 물체를 잡는 로봇 손, 사람의 움직임을 돕는 착용형 로봇을 연구하고 있습니다. 사람이 로봇을 직접 조작해 동작을 가르치거나 컴퓨터 안에서 반복해서 연습시키는 연구도 진행합니다. 실제 휴머노이드를 가져다놓고 걷기와 균형, 몸 전체의 움직임을 실험하는 연구도 있습니다.\n\n카메라로 공간과 물체를 알아보는 기술, 종이접기처럼 형태를 바꾸는 로봇, 작게 접어서 이동하다 현장에서 크게 펼쳐 쓰는 3D 프린팅 로봇도 있습니다. 이런 연구들은 모두 로봇이 실제 환경을 이해하고 사람과 함께 움직일 수 있도록 하는 목표로 연결됩니다.\n\n현재 이곳은 여러 연구팀이 실제로 사용하는 공동 연구공간입니다. 오늘은 실험실 내부에 들어가지 않지만, 이 안에서는 학생과 연구진이 새로운 기술을 만들고 계속 실험하고 있습니다.\n\n저희는 연구 성과를 기업과 함께 실제 산업에 적용하고, 기술사업화와 창업 지원으로 연결하는 일도 추진하고 있습니다. 현재 건물 뒤편에 새 연구소 부지를 확보하고 인허가도 마쳤으며, 약 2년 뒤에는 별도 연구소 건물로 이전할 계획입니다. 그곳에서는 연구와 실험, 기업 협력, 스타트업 육성을 더 긴밀하게 연결할 예정입니다.\n\n이상으로 연구소 소개를 마치겠습니다. 궁금하신 점이 있으시면 편하게 질문해 주세요. 방문해 주셔서 감사합니다.", "en": "Hello, and welcome to the Robotics Institute at Seoul National University. I'm ___, and I'll give you a brief introduction. Today we'll stay here rather than entering the laboratories, and I'll explain what we research and where the Institute is heading.\n\nThe Institute brings together robotics research from across SNU. About 80 professors participate directly or indirectly, from mechanical and electrical engineering, computer science and materials science to medicine and brain science. Building robots involves many different fields: the robot's body, sensors that let it feel and see, AI that helps it decide, and control technology that makes it move.\n\nIn 2026, the Institute was selected for the national NRL 2.0 research program. Forty-one professors directly participate, with about ten billion Korean won in research funding each year for a program that may continue for up to ten years. The national institute officially opened on August 18, 2026.\n\nOur main goal is human-centered Physical AI. Today's AI can answer questions and produce text and images. Physical AI goes further: it lets robots perceive the real world, make decisions, move, and help people.\n\nImagine asking a robot to pick up a cup. It must first find the cup, decide how to reach for it, and control its grip so the cup doesn't fall or break. That seems easy for a person, but a robot needs several technologies working together.\n\nResearchers here develop soft and flexible robots, robot hands that can grasp objects, and wearable robots that support people's movements. They also teach robots through human demonstrations, train robots repeatedly in virtual environments, and test control and balance on actual humanoid robots.\n\nOther research helps robots recognize objects and spaces using cameras, change their bodies' shapes like folded paper, or transport a compact 3D printer and unfold it into a large machine on site. All these projects contribute to robots that understand real environments and work alongside people.\n\nThis is an active shared research facility where students and researchers develop and test new technologies. While we won't enter the labs today, the research inside is constantly evolving.\n\nWe are also working with companies to apply these results in industry and support new robotics startups. We have secured land behind this building and completed permits for a dedicated new Institute building, with a move planned in approximately two years. It will bring research, industrial collaboration, and startup support closer together.\n\nThat concludes our introduction. If you have any questions, please feel free to ask. Thank you for visiting."}}</script>

  function effectiveMode(idx){
    return state.stationMode[idx] || state.globalMode;

  // ---------- time estimation ----------
  var minutesCache = {}; // {lang: {mode: [14]}}
  function computeMinutesTable(mode, lang){
    minutesCache[lang] = minutesCache[lang] || {};
    if(minutesCache[lang][mode]) return minutesCache[lang][mode];
    var lens = SCRIPTS[mode][lang].map(function(t){ return t.length; });
    var total = lens.reduce(function(a,b){return a+b;}, 0) || 1;
    var target = TARGET_MIN[mode];
    var table = lens.map(function(l){ return target * l / total; });
    minutesCache[lang][mode] = table;
    return table;
  }
  function minuteFor(idx, mode, lang){
    // proportional share of the target length, plus a flat 10-second
    // buffer per zone for walking/transition/Q&A overhead
    return computeMinutesTable(mode, lang)[idx] + (10/60);
  }

  function fmtMin(m){
    var r = Math.round(m*10)/10;
    if (Math.abs(r - Math.round(r)) < 0.05) return String(Math.round(r));
    return r.toFixed(1);
  }

  function sanitizeFilename(name){
    return name.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim();
  }

  function downloadTxt(filename, content){
    var blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function downloadSingleScript(idx){
    var mode = effectiveMode(idx);
    var lines = [
      stationLabel(idx),
      t('lengthNames')[mode],
      '',
      SCRIPTS[mode][state.lang][idx]
    ];
    var fname = sanitizeFilename(stationLabel(idx)) + ' (' + t('lengthShortNames')[mode] + ').txt';
    downloadTxt(fname, lines.join('\n'));
  }

  function downloadCombinedScript(){
    var lines = [t('combinedHead'), ''];
    state.sequence.forEach(function(idx, order){
      var mode = effectiveMode(idx);
      lines.push(t('stepLabel') + ' ' + (order+1) + ' — ' + stationLabel(idx) + ' (' + t('lengthShortNames')[mode] + ')');
      lines.push('');
      lines.push(SCRIPTS[mode][state.lang][idx]);
      lines.push('');
    });
    var fname = sanitizeFilename(t('combinedHead')) + '.txt';
    downloadTxt(fname, lines.join('\n'));
  }

  // build a small short/medium/long selector for one station; onChange(mode)
  function buildMiniSeg(idx, onChange){
    var wrap = document.createElement('div');
    wrap.className = 'segmented mini';
    var current = effectiveMode(idx);
    MODES.forEach(function(m){
      var b = document.createElement('button');
      b.textContent = t('lengthShortNames')[m];
      if(m === current) b.className = 'active';
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        state.stationMode[idx] = m;
        onChange && onChange();
        renderAll();
      });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function renderRooms(){
    var svg = els.floorplanShell.querySelector('svg');
    if(!svg) return;
    svg.querySelectorAll('.tour-room').forEach(function(g){
      var num = parseInt(g.getAttribute('data-room'), 10);
      g.classList.remove('room-active', 'room-selected');
      var inSeq = state.sequence.indexOf(num) !== -1;
      if(!state.combine && state.activeStation === num) g.classList.add('room-active');
      if(state.combine && inSeq) g.classList.add('room-selected');
    });

    // badges for combine-mode ordering
    els.badgeLayer.innerHTML = '';
    if(state.combine){
      state.sequence.forEach(function(idx, order){
        var rect = ROOM_RECTS[idx];
        if(!rect) return;
        var cx = (rect.x + rect.w/2) / PLAN_W * 100;
        var cy = rect.y / PLAN_H * 100;
        var badge = document.createElement('div');
        badge.className = 'order-badge-float';
        badge.style.left = cx + '%';
        badge.style.top = cy + '%';
        badge.textContent = order + 1;
        els.badgeLayer.appendChild(badge);
      });
    }
  }

  function wireRoomClicks(){
    var svg = els.floorplanShell.querySelector('svg');
    if(!svg) return;
    svg.querySelectorAll('.tour-room').forEach(function(g){
      g.addEventListener('click', function(){
        var num = parseInt(g.getAttribute('data-room'), 10);
        onPinClick(num);
      });
    });
  }

  function onPinClick(i){
    if(state.combine){
      var idx = state.sequence.indexOf(i);
      if(idx === -1) state.sequence.push(i);
      else state.sequence.splice(idx,1);
    } else {
      state.activeStation = i;
    }
    renderAll();
  }

    var editBtn = document.createElement('button');
    editBtn.className = 'edit-request-btn';
    editBtn.textContent = t('editReq');
    editBtn.addEventListener('click', function(){ openEditModal(idx); });
    timeRow.appendChild(time2);
    timeRow.appendChild(miniSeg2);
    timeRow.appendChild(dlBtn);
    timeRow.appendChild(copyBtn);
    timeRow.appendChild(editBtn);

    head2.appendChild(h22); head2.appendChild(timeRow);
    area.appendChild(head2);

    var body2 = document.createElement('div');
    body2.className = 'script-body';
    paragraphsToHtml(SCRIPTS[mode][state.lang][idx]).forEach(function(p){ body2.appendChild(p); });
    area.appendChild(body2);
  }

  function copyBothLanguages(idx, mode, triggerBtn){
    var curLang = state.lang;
    var otherLang = curLang === 'ko' ? 'en' : 'ko';
    var curText = SCRIPTS[mode][curLang][idx];
    var otherText = SCRIPTS[mode][otherLang][idx];
    var combined = curText + '\n\n---\n\n' + otherText;
    var done = function(){
      if(!triggerBtn) return;
      var original = triggerBtn.textContent;
      triggerBtn.textContent = t('copied');
      setTimeout(function(){ triggerBtn.textContent = original; }, 1200);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(combined).then(done).catch(function(){
        fallbackCopy(combined); done();
      });
    } else {
      fallbackCopy(combined); done();
    }
  }

  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta);
  }

  function buildCopyButton(idx, mode){
    var btn = document.createElement('button');
    btn.className = 'edit-request-btn';
    btn.textContent = t('copyBtn');
    btn.addEventListener('click', function(){ copyBothLanguages(idx, mode, btn); });
    return btn;
  }

  // ---------- usage guide modal ----------
  function openUsageModal(){
    els.usageBody.innerHTML = '';
    t('usageSections').forEach(function(sec){
      var wrap = document.createElement('div');
      wrap.className = 'usage-section';
      var h4 = document.createElement('h4'); h4.textContent = sec.h;
      var p = document.createElement('p'); p.textContent = sec.b;
      wrap.appendChild(h4); wrap.appendChild(p);
      els.usageBody.appendChild(wrap);
    });
    els.usageOverlay.classList.add('show');
  }
  function closeUsageModal(){
    els.usageOverlay.classList.remove('show');
  }

  // ---------- edit request modal ----------
  function openEditModal(stationIdx){
    state.editingStation = stationIdx;
    var mode = effectiveMode(stationIdx);
    els.editStatusMsg.textContent = '';
    els.editStatusMsg.className = 'status-msg';
    els.editName.value = state.reviewer.name || '';
    els.editEmail.value = state.reviewer.email || '';
    els.editKo.value = SCRIPTS[mode]['ko'][stationIdx];
    els.editEn.value = SCRIPTS[mode]['en'][stationIdx];
    els.editNote.value = '';
    els.editModalTitle.textContent = t('editModalTitle') + ' · ' + STATIONS[stationIdx][state.lang];
    els.editSendBtn.disabled = false;
    els.editOverlay.classList.add('show');
  }
  function closeEditModal(){
    els.editOverlay.classList.remove('show');
  }

  function submitViaFetch(fields, targetUrl){
    var body = new URLSearchParams();
    Object.keys(fields).forEach(function(k){
      body.append(k, fields[k] == null ? '' : String(fields[k]));
    });
    // Google Apps Script's /exec endpoint redirects internally to a
    // googleusercontent.com URL that does not carry proper CORS headers on
    // that redirect hop, so a normal mode:'cors' fetch reliably fails with
    // "Failed to fetch" even when the deployment itself is configured
    // correctly. mode:'no-cors' sidesteps that CORS check (the same way a
    // plain form POST does) so the request actually reaches Apps Script;
    // the tradeoff is the response becomes opaque, so this can only catch
    // real connectivity failures (wrong host, no network), not confirm
    // that doPost ran without error on the server side.
    return fetch(targetUrl, {
      method: 'POST',
      mode: 'no-cors',
      body: body
    });
  }

  function handleEditSend(){
    var name = els.editName.value.trim();
    var email = els.editEmail.value.trim();

    if(!state.submitUrl){
      els.editStatusMsg.textContent = t('needCfg');
      els.editStatusMsg.className = 'status-msg err';
      return;
    }
    if(!name || !email){
      els.editStatusMsg.textContent = t('needNameEmail');
      els.editStatusMsg.className = 'status-msg err';
      return;
    }

    state.reviewer = { name:name, email:email };

    var idx = state.editingStation;
    var mode = effectiveMode(idx);
    var fields = {
      timestamp: new Date().toISOString(),
      stationId: idx,
      stationLabelKo: STATIONS[idx].ko,
      stationLabelEn: STATIONS[idx].en,
      mode: mode,
      name: name,
      email: email,
      originalKo: SCRIPTS[mode]['ko'][idx],
      editedKo: els.editKo.value,
      originalEn: SCRIPTS[mode]['en'][idx],
      editedEn: els.editEn.value,
      note: els.editNote.value
    };

    els.editSendBtn.disabled = true;
    els.editStatusMsg.textContent = t('sending');
    els.editStatusMsg.className = 'status-msg';

    submitViaFetch(fields, state.submitUrl).then(function(){
      els.editStatusMsg.textContent = t('sentOk');
      els.editStatusMsg.className = 'status-msg ok';
      els.editSendBtn.disabled = false;
      setTimeout(closeEditModal, 900);
    }).catch(function(err){
      var detail = (err && err.message) ? ' (' + err.message + ')' : '';
      els.editStatusMsg.textContent = t('sendFailed') + detail;
      els.editStatusMsg.className = 'status-msg err';
      els.editSendBtn.disabled = false;
    });
  }

  // ---------- drag-to-reorder for the route sequence list ----------
  var dragFromOrder = null;

  function attachSeqDrag(li, order){
    li.addEventListener('dragstart', function(e){
      dragFromOrder = order;
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', String(order)); }catch(err){}
    });
    li.addEventListener('dragend', function(){
      li.classList.remove('dragging');
      document.querySelectorAll('.seq-item').forEach(function(el){
        el.classList.remove('drag-over-top', 'drag-over-bottom');
      });
    });
    li.addEventListener('dragover', function(e){
      e.preventDefault();
      var rect = li.getBoundingClientRect();
      var isBelow = (e.clientY - rect.top) > rect.height / 2;
      li.classList.toggle('drag-over-bottom', isBelow);
      li.classList.toggle('drag-over-top', !isBelow);
    });
    li.addEventListener('dragleave', function(){
      li.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    li.addEventListener('drop', function(e){
      e.preventDefault();
      var rect = li.getBoundingClientRect();
      var isBelow = (e.clientY - rect.top) > rect.height / 2;
      var targetOrder = order + (isBelow ? 1 : 0);
      if(dragFromOrder === null) return;
      var moved = state.sequence.splice(dragFromOrder, 1)[0];
      var insertAt = targetOrder > dragFromOrder ? targetOrder - 1 : targetOrder;
      state.sequence.splice(insertAt, 0, moved);
      dragFromOrder = null;
      renderAll();
    });
  }

  function renderAll(){
    renderIntro5();
    renderStrings();
    renderLengthSeg();
    renderLangSeg();
    renderCombineBtn();
    renderRooms();
    renderStationList();
    renderSequencePanel();
    renderScriptArea();
  }

  function wireStaticControls(){
    els.combineBtn.addEventListener('click', function(){
      state.combine = !state.combine;
      renderAll();
    });
    els.selectAllBtn.addEventListener('click', function(){
      state.combine = true;
      state.sequence = [];
      for(var i=0;i<N;i++) state.sequence.push(i);
      renderAll();
    });
    els.resetSeqBtn.addEventListener('click', function(){
      state.sequence = [];
      renderAll();
    });

    els.editCloseBtn.addEventListener('click', closeEditModal);
    els.editCancelBtn.addEventListener('click', closeEditModal);
    els.editSendBtn.addEventListener('click', handleEditSend);
    els.editOverlay.addEventListener('click', function(e){ if(e.target === els.editOverlay) closeEditModal(); });

    els.usageBtn.addEventListener('click', openUsageModal);
    els.usageCloseBtn.addEventListener('click', closeUsageModal);
    els.usageOkBtn.addEventListener('click', closeUsageModal);
    els.usageOverlay.addEventListener('click', function(e){ if(e.target === els.usageOverlay) closeUsageModal(); });

    wireRoomClicks();
  }

  document.addEventListener('DOMContentLoaded', function(){
    cacheEls();
    wireStaticControls();
    renderAll();
  });
})();

</script>
