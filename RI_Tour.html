<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로보틱스연구소 투어 가이드</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink: #2C3E50;
    --ink-2: #21303E;
    --paper: #F3F5F7;
    --paper-2: #E1E7EC;
    --plan-bg: #EAEEF2;
    --line: #5C7A96;
    --amber: #3E6E94;
    --amber-soft: rgba(62,110,148,0.15);
    --text: #202B36;
    --muted: #64758A;
    --muted-2: #9AA8B8;
    --danger: #A8493F;
    --radius: 6px;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  #app{
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--paper-2);
    margin-bottom: 18px;
  }
  .brand{
    display:flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand h1{
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .brand .tag{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--paper-2);
    padding: 3px 8px;
    border-radius: 999px;
  }

  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items:center;
  }

  .segmented{
    display:flex;
    background: var(--paper-2);
    border-radius: var(--radius);
    padding: 3px;
    gap: 2px;
  }
  .segmented button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border:none;
    background: transparent;
    color: var(--muted);
    padding: 7px 12px;
    border-radius: 4px;
    cursor:pointer;
    white-space: nowrap;
  }
  .segmented button.active{
    background: var(--ink);
    color: #fff;
  }
  .segmented.mini{ padding:2px; }
  .segmented.mini button{
    font-size: 10.5px;
    padding: 4px 8px;
  }
  .segmented.mini button.active{ background: var(--amber); color:#fff; }

  .toggle-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--paper-2);
    background: #fff;
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .toggle-btn.on{
    background: var(--amber-soft);
    border-color: var(--amber);
    color: #1F3B54;
  }
  .toggle-btn:hover{ border-color: var(--line); }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--muted-2);
  }
  .toggle-btn.on .dot{ background: var(--amber); }

  /* ---------- Floorplan ---------- */
  .floorplan-card{
    background: var(--plan-bg);
    border: 1px solid #D6DEE6;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(27,36,48,0.08), 0 1px 0 rgba(255,255,255,0.6) inset;
  }
  .floorplan-shell{
    position:relative;
    width:100%;
    aspect-ratio: 860 / 520;
  }
  .floorplan-shell svg{
    width:100%;
    height:100%;
    display:block;
  }
  .floorplan-shell svg .tour-room{
    cursor:pointer;
  }
  .floorplan-shell svg .tour-room rect{
    transition: stroke-width .15s, filter .15s, opacity .15s;
  }
  .floorplan-shell svg .tour-room:hover rect{
    filter: brightness(0.96);
  }
  .floorplan-shell svg .tour-room.room-active rect{
    stroke: var(--amber) !important;
    stroke-width: 3px !important;
    filter: drop-shadow(0 0 5px rgba(62,110,148,0.55));
  }
  .floorplan-shell svg .tour-room.room-selected rect{
    stroke: var(--amber) !important;
    stroke-width: 2.5px !important;
    filter: drop-shadow(0 0 4px rgba(62,110,148,0.4));
  }

  .badge-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .order-badge-float{
    position:absolute;
    width: 20px;
    height: 20px;
    margin-left: -10px;
    margin-top: -10px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid #fff;
    color:#fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  .floorplan-caption{
    font-size: 11.5px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin: 10px 2px 20px;
  }

  /* ---------- Body layout ---------- */
  .layout{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
    align-items:start;
  }
  @media (max-width: 820px){
    .layout{ grid-template-columns: 1fr; }
  }

  .panel{
    background: #fff;
    border: 1px solid var(--paper-2);
    border-radius: 10px;
    padding: 18px;
  }

  .panel h2{
    font-size: 13px;
    margin: 0 0 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* sequence list */
  .seq-empty{
    font-size: 13px;
    color: var(--muted-2);
    line-height: 1.6;
    padding: 8px 0 4px;
  }
  .seq-total{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    margin: 2px 0 2px;
  }
  .seq-total-label{
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .seq-list{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .seq-item{
    padding: 8px 10px;
    background: var(--paper);
    border-radius: 6px;
    font-size: 13px;
  }
  .seq-item .row1{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .seq-item .num{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #fff;
    background: var(--ink);
    width:20px; height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .seq-item .label{
    flex:1;
    line-height:1.3;
  }
  .seq-item .remove{
    border:none;
    background:transparent;
    color: var(--muted-2);
    cursor:pointer;
    font-size: 15px;
    line-height:1;
    padding: 2px 4px;
  }
  .seq-item .remove:hover{ color: var(--danger); }
  .seq-item .row2{
    margin-top: 6px;
    display:flex;
    justify-content:flex-end;
  }

  .clear-btn{
    margin-top: 14px;
    width:100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: var(--paper);
    border: 1px solid var(--paper-2);
    color: var(--muted);
    padding: 8px;
    border-radius: 6px;
    cursor:pointer;
  }
  .clear-btn:hover{ border-color: var(--danger); color: var(--danger); }

  .stationlist{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--paper-2);
  }
  .stationlist ul{
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap:2px;
  }
  .stationlist li button{
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 12.5px;
    color: var(--text);
    cursor:pointer;
    display:flex;
    gap:8px;
  }
  .stationlist li button:hover{ background: var(--paper); }
  .stationlist li button.active-station{ background: var(--amber-soft); font-weight:600; }
  .stationlist li button .n{
    font-family:'IBM Plex Mono', monospace;
    color: var(--muted);
    flex-shrink:0;
    width: 18px;
  }

  /* script panel */
  .script-panel{
    min-height: 420px;
  }
  .script-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap:wrap;
  }
  .script-head h2{
    font-size: 18px;
    color: var(--text);
    margin:0;
    font-weight:700;
    letter-spacing: -0.01em;
  }
  .script-time-row{
    display:flex;
    align-items:center;
    gap: 10px;
    flex-wrap:wrap;
  }
  .script-time{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space:nowrap;
  }
  .script-body{
    max-width: 74ch;
  }
  .script-body p{
    font-size: 15px;
    line-height: 1.85;
    margin: 0 0 16px;
    color: #212B36;
  }
  .script-divider{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: 28px 0 16px;
    flex-wrap:wrap;
  }
  .script-divider:first-child{ margin-top: 0; }
  .script-divider .line{
    flex:1;
    height:1px;
    background: var(--paper-2);
    min-width: 20px;
  }
  .script-divider .lab{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space:nowrap;
  }
  .empty-state{
    color: var(--muted-2);
    font-size: 13.5px;
    line-height: 1.7;
    padding: 40px 0;
    text-align:center;
  }

  .edit-request-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    border: 1px solid var(--paper-2);
    background: #fff;
    color: var(--line);
    padding: 5px 10px;
    border-radius: 999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .edit-request-btn:hover{ border-color: var(--line); background: rgba(62,107,156,0.07); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(18,33,59,0.55);
    align-items:center;
    justify-content:center;
    z-index: 50;
    padding: 24px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background: #fff;
    border-radius: 10px;
    width: 100%;
    max-width: 620px;
    max-height: 88vh;
    display:flex;
    flex-direction:column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-small{ max-width: 480px; }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--paper-2);
    flex-shrink:0;
  }
  .modal-head h3{
    margin:0;
    font-size: 15px;
    font-weight:700;
  }
  .modal-close{
    border:none;
    background:transparent;
    font-size: 20px;
    line-height:1;
    color: var(--muted);
    cursor:pointer;
    padding: 2px 4px;
  }
  .modal-close:hover{ color: var(--danger); }
  .modal-body{
    padding: 18px 20px;
    overflow-y:auto;
    flex: 1 1 auto;
  }
  .modal-foot{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--paper-2);
    flex-shrink:0;
  }
  .field-row{
    margin-bottom: 14px;
  }
  .field-row label{
    display:block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .field-hint{
    font-size: 11.5px;
    color: var(--muted-2);
    margin: -2px 0 6px;
    line-height:1.5;
  }
  .text-input, .text-area{
    width:100%;
    border: 1px solid var(--paper-2);
    border-radius: 6px;
    padding: 9px 11px;
    font-size: 13.5px;
    font-family: 'Pretendard', sans-serif;
    color: var(--text);
    background: var(--paper);
  }
  .text-input:focus, .text-area:focus{
    outline: none;
    border-color: var(--line);
    background: #fff;
  }
  .text-area{
    min-height: 130px;
    line-height: 1.6;
    resize: vertical;
  }
  .text-area.small{ min-height: 70px; }
  .status-msg{
    font-size: 12.5px;
    margin-top: 4px;
    min-height: 16px;
  }
  .status-msg.ok{ color: #2E7D4F; }
  .status-msg.err{ color: var(--danger); }
  .cfg-help{
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 16px;
  }
  .btn-secondary, .btn-primary{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 9px 16px;
    border-radius: 6px;
    cursor:pointer;
  }
  .btn-secondary{
    border: 1px solid var(--paper-2);
    background: #fff;
    color: var(--muted);
  }
  .btn-secondary:hover{ border-color: var(--muted); }
  .btn-primary{
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
  }
  .btn-primary:hover{ background: var(--ink-2); }
  .btn-primary:disabled{
    opacity:0.5;
    cursor:default;
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <h1 id="titleText">로보틱스연구소 투어 가이드</h1>
      <span class="tag mono" id="subTag">0–13</span>
    </div>
    <div class="controls">
      <div class="segmented" id="lengthSeg"></div>
      <button class="toggle-btn" id="langBtn"><span class="dot"></span><span id="langLabel">KO</span></button>
      <button class="toggle-btn" id="combineBtn"><span class="dot"></span><span>조합 모드</span></button>
    </div>
  </div>

  <div class="floorplan-card">
    <div class="floorplan-shell" id="floorplanShell">
      <svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 860 520" role="img" style=""><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">로보틱스 연구소 투어 동선 평면도 (1번 폭, 8·9번 높이 통일)</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">연구소 평면. 왼쪽 전체 높이가 사무 공간이다. 그 오른쪽으로 여백을 두고 10이 있고 그 옆에 2,3과 같은 높이로 줄어든 9와 8이 있다. 그 아래 1(2,3과 같은 폭), 2, 3이 나란히 있다. 더 오른쪽에는 세 개의 열이 있는데 첫 열은 위아래로 나뉘어 6과 7이고 다음 열은 5, 그다음 열은 4이며 4는 오른쪽 벽에 붙어있다. 사무 공간 오른쪽 아래에 11과 12가 나란히 있다. 하단 오른쪽에 출입구, 그 앞에 투어 시작점 0.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>

<rect x="40" y="60" width="740" height="320" rx="4" fill="none" stroke="var(--b)" stroke-width="2" style="fill:none;stroke:color(srgb 0.0431373 0.0431373 0.0431373 / 0.2);color:rgb(11, 11, 11);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" />

<g style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="48" y="68" width="254" height="304" rx="6" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);color:rgb(11, 11, 11);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" />
<text x="175" y="210" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">사무 공간 (Office)</text>
<text x="175" y="232" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95, 94, 90);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">투어 제외 (Not on tour)</text></g>

<line x1="310" y1="68" x2="310" y2="372" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4" style="fill:rgb(0, 0, 0);stroke:color(srgb 0.0431373 0.0431373 0.0431373 / 0.2);color:rgb(11, 11, 11);stroke-width:0.5px;stroke-dasharray:4px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" />

<script type="application/json" id="tour-data">{"stations": [{"ko": "입구", "en": "Entrance"}, {"ko": "유연한 분절형 로봇 (안성훈 교수)", "en": "Flexible Segmented Robot (Prof. Ahn Seung-hoon)"}, {"ko": "원격조작으로 가르치는 로봇 학습 (박종우 교수)", "en": "Teaching Robots via Remote Control (Prof. Park Jong-woo)"}, {"ko": "힘과 손동작을 읽는 센서 (박용래 교수)", "en": "Sensors for Force & Hand Motion (Prof. Park Yong-rae)"}, {"ko": "웨어러블 로봇 (조규진 교수)", "en": "Wearable Robots (Prof. Cho Kyu-jin)"}, {"ko": "데이터 캡처 공용 공간", "en": "Shared Space — Data Capture"}, {"ko": "Morphic · 생체모사와 오리가미 (조규진 교수)", "en": "Morphic — Biomimetic & Origami Robots (Prof. Cho Kyu-jin)"}, {"ko": "로봇 핸드와 그리퍼 (조규진 교수)", "en": "Robot Hands & Grippers (Prof. Cho Kyu-jin)"}, {"ko": "시뮬레이션 기반 로봇 학습 (이동준 교수)", "en": "Simulation-Based Robot Learning (Prof. Lee Dong-jun)"}, {"ko": "로봇 비전과 투명물체 인식 (김아영 교수)", "en": "Robot Vision & Transparent-Object Recognition (Prof. Kim Ah-young)"}, {"ko": "이동식 전개형 3D 프린팅 로봇 (조규진 교수)", "en": "Deployable Mobile 3D-Printing Robot (Prof. Cho Kyu-jin)"}, {"ko": "실사 공간의 3차원 재구성 (임종우 교수)", "en": "3D Reconstruction of Real Spaces (Prof. Lim Jong-woo)"}, {"ko": "의료용 소프트 로봇 (한경원 교수)", "en": "Soft Medical Robotics (Prof. Han Kyung-won)"}, {"ko": "마무리", "en": "Closing"}], "scripts": {"long": {"ko": ["안녕하세요. 오늘 서울대학교 로보틱스연구소 투어를 안내해 드릴 ○○○입니다. 저는 현재 로보틱스연구소에서 ○○○ 업무를 담당하고 있고요. 먼저 연구소에 대해 간단히 소개해 드린 다음, 공간을 함께 이동하면서 현재 진행하고 있는 주요 연구를 순서대로 설명해 드리겠습니다.\n\n서울대학교 로보틱스연구소는 로보틱스를 중심으로 서울대학교의 다양한 연구역량을 연결하는 융합연구 거점입니다. 현재 기계공학, 전기정보공학, 컴퓨터공학, 재료공학을 비롯해 의학, 보건학, 뇌인지과학 등 다양한 분야의 교수 80여 명이 직·간접적으로 참여하고 있습니다. 로봇의 구조와 소재부터 센서, 비전, 제어, 인공지능과 학습, 인간-로봇 상호작용, 의료와 바이오 응용까지 폭넓은 연구역량이 모여 있습니다. 서로 다른 전공의 연구자들이 로보틱스라는 하나의 분야를 중심으로 적극적으로 협력한다는 점이 연구소의 중요한 특징입니다.\n\n이러한 연구역량을 기반으로 2026년 과학기술정보통신부와 교육부가 추진하는 국가연구소, NRL 2.0 사업에 선정되었습니다. 연구소에 직·간접적으로 참여하는 80여 명의 교수님 가운데 41명의 교수님이 NRL 과제에 직접 참여하고 있습니다. 국가로부터 연간 약 100억 원 규모의 연구비를 지원받아 최대 10년간 연구를 수행하는 대형 장기 연구사업입니다. 이를 통해 개별 연구실에서 축적한 기술과 연구인력을 연결하고, 로보틱스 분야의 핵심 원천기술부터 실제 환경에서 활용할 수 있는 시스템과 응용기술까지 장기적인 관점에서 연구할 수 있는 기반을 갖추고 있습니다. 2026년 8월 18일에는 로보틱스 국가연구소 개소식을 갖고 이러한 연구체계를 본격적으로 가동하기 시작했습니다.\n\n연구소가 지향하는 핵심 방향은 '인간 중심의 Physical AI'입니다. Physical AI는 인공지능이 실제 물리적인 공간에서 로봇의 몸을 통해 주변 환경을 인식하고 판단하며, 직접 움직이고 사람과 상호작용할 수 있도록 하는 기술입니다. 이를 위해 로봇의 구조와 소재, 구동장치, 센서와 촉각, 비전, 제어, 인공지능과 학습 등 다양한 기술을 함께 연구하고 있습니다. 이러한 기술을 연결해 사람의 일상과 작업을 지원하고, 신체 기능을 보조·확장하며, 산업과 의료 등 다양한 실제 환경에서 활용할 수 있는 인간 중심의 로봇 기술로 발전시키는 것이 연구소의 연구 방향입니다.\n\n국가연구소 사업을 수행하는 10년 동안에는 연구성과를 축적하는 동시에 연구소가 장기적으로 성장할 수 있는 자립 기반도 함께 만들어갈 계획입니다. 기업과의 공동연구와 기술이전 등 산학협력을 확대하고, 우수한 연구성과가 실제 산업으로 이어질 수 있도록 기술사업화도 적극적으로 추진합니다. Physical AI 분야의 유망 기술과 연구자를 발굴해 창업으로 연결하고, 초기 스타트업을 발굴하고 육성하는 창업보육 기능도 강화할 계획입니다. 연구, 산학협력, 기술사업화, 창업이 하나의 생태계 안에서 이어지도록 하고, 이를 통해 장기적으로 지속 가능한 로보틱스 연구·산업 거점을 구축하고자 합니다.\n\n연구 규모 확대에 맞춰 로보틱스연구소가 사용할 독립적인 연구공간도 새롭게 구축할 예정입니다. 현재 건물 뒤쪽에 부지를 확보하고 필요한 인허가 절차를 마친 상태이며, 별도의 로보틱스연구소 건물을 건립해 약 2년 후 이전하는 것을 계획하고 있습니다. 새로운 공간에는 연구와 실험을 위한 시설뿐만 아니라 산학협력과 기술사업화, 스타트업 발굴·육성을 지원하는 기능도 함께 담아갈 예정입니다. 앞으로 이곳을 서울대학교의 Physical AI 연구역량과 기업, 창업이 함께 모이는 로보틱스 거점으로 발전시켜 나갈 계획입니다.\n\n현재 이 공간에는 여러 연구팀에서 진행하고 있는 연구 가운데 일부가 전시되어 있습니다. 새로운 소재와 구조를 활용한 소프트 로봇과 유연한 로봇, 로봇 핸드와 그리퍼, 힘과 접촉을 감지하는 센서, 사람의 움직임을 인식하고 보조하는 웨어러블 기술부터, 사람이 로봇에게 동작을 가르치는 원격조작과 학습, 카메라를 이용한 환경 인식과 물체 파지, 실제 공간을 디지털 환경으로 구현하는 기술, 가상공간에서 로봇을 학습시키는 기술, 로봇과 센서를 의료 분야에 적용하는 연구까지 이 공간에서 만나보실 수 있습니다.", "이곳은 서울대학교 기계공학부 안성훈 교수님 연구팀의 로봇입니다. 안성훈 교수님 연구팀은 재료, 설계, 제조기술을 서로 연결해 새로운 기능을 가진 로봇과 구조물을 만드는 연구를 폭넓게 진행하고 있습니다. 형상기억합금과 같은 스마트 재료, 복합재료, 센서와 구동기, 소프트 로봇, 적층제조 등이 주요 연구분야입니다. 최근에는 연속된 탄소섬유를 이용해 매우 가벼우면서도 높은 하중을 견딜 수 있는 3차원 격자구조를 개발하고, 이를 실제 로봇 팔과 드론 구조체로 구현하기도 했습니다. (서울대학교 전자출결시스템)\n\n이곳에 있는 것은 이러한 연구 가운데 유연한 구조를 가진 분절형 로봇입니다. 일반적인 산업용 로봇 팔을 생각해보시면 몇 개의 관절이 있고, 각각의 관절이 정해진 방향으로 회전하면서 로봇 팔의 위치와 자세를 바꿉니다. 여기에 있는 로봇은 코끼리의 코처럼 여러 개의 마디가 연속적으로 연결된 형태를 가지고 있습니다. 여러 부분이 함께 움직이면서 전체적인 형상을 바꿀 수 있고, 물체의 형태에 맞춰 주변을 감싸는 방식으로 물체를 잡을 수 있습니다. 코끼리 코와 같은 형태로 여러 분절을 이용해 물체를 잡는 것이 이 로봇의 핵심 특징입니다.\n\n이런 형태의 로봇에서 중요한 부분은 로봇의 구조 자체가 움직임을 만들어내는 데 적극적으로 활용된다는 점입니다. 안성훈 교수님 연구팀은 오래전부터 재료와 구조에 기능을 부여하는 연구를 진행해 왔습니다. 대표적으로 형상기억합금을 섬유와 결합하고 뜨개질의 원리를 적용해, 온도나 전류에 따라 굽힘과 비틀림, 선형 운동과 3차원 형상 변화까지 만들어낼 수 있는 직물형 구동기를 개발했습니다. 꽃이 피는 것처럼 구조가 스스로 움직이게 만들 수 있고, 이러한 원리를 소프트 로봇이나 웨어러블 장치에 활용하는 연구입니다. (서울대학교 공과대학)\n\n이 로봇은 '로봇을 얼마나 유연하게 만들 수 있는가'라는 질문을 중심으로 이해하시면 쉽습니다. 우리가 흔히 보는 로봇 팔은 정해진 관절을 정밀하게 움직이는 데 강점이 있습니다. 이곳의 분절형 로봇은 여러 부분의 움직임과 구조의 변형을 활용해 대상의 형태에 맞춰 움직이고 감싸는 방식에 초점을 두고 있습니다. 앞으로 로봇이 공장처럼 정형화된 공간을 넘어 사람 주변이나 형태가 일정하지 않은 물체가 많은 환경에서 활동하려면, 이런 유연한 구조와 움직임을 구현하는 기술의 활용 범위도 넓어질 수 있습니다.\n\n안성훈 교수님 연구팀의 특징 가운데 하나도 바로 이러한 재료·설계·제조의 결합입니다. 로봇의 움직임을 제어기나 모터의 관점에서만 접근하는 것이 아니라, 어떤 재료를 사용하고 어떤 구조로 만들며 어떤 방식으로 제작할 것인지까지 함께 설계합니다. 실제로 스마트 재료와 기능성 복합재료를 로봇에 적용해 왔고, 소프트 로봇과 센서, 3D 프린팅과 마이크로·나노 제조 등으로 연구영역을 확장해 왔습니다. (서울대학교 공과대학) 이곳에는 그중 유연한 구조를 활용해 로봇이 움직이고 물체와 상호작용하는 사례가 전시되어 있습니다.", "이곳은 서울대학교 기계공학부 박종우 교수님 연구팀의 로봇 학습 연구입니다. 박종우 교수님 연구팀은 로봇의 움직임을 수학적으로 모델링하고 제어하는 연구를 오랫동안 수행해 왔으며, 최근에는 여기에 인공지능과 데이터 기반 학습기술을 적극적으로 결합하고 있습니다. 주요 연구분야에는 로봇의 움직임과 제어, 물체 조작, 이동하면서 작업하는 모바일 매니퓰레이션, 물리 기반 시뮬레이션 등이 있습니다. 최근에는 모방학습과 물체 조작, 실시간 충돌감지와 같이 로봇이 데이터를 통해 복잡한 작업을 학습하고 실제로 수행할 수 있도록 하는 연구도 활발하게 진행하고 있습니다. (서울대학교대학원 협동과정 지능형우주항공시스템전공)\n\n이곳은 그중 사람이 로봇에게 작업을 가르치는 과정과 관련된 연구 공간입니다. 로봇이 사람처럼 다양한 물건을 잡고 옮기려면 먼저 어떤 상황에서 어떻게 움직여야 하는지를 배워야 합니다. 사람이 직접 로봇을 원격으로 조종하면서 원하는 작업을 수행하면, 로봇은 그 과정에서 팔을 어떻게 움직였는지, 어느 위치에서 물체를 잡았는지, 어떤 순서로 작업했는지와 같은 데이터를 얻을 수 있습니다. 이곳은 사람이 로봇을 원격으로 조작하고, 그 동작을 매니퓰레이터의 학습에 활용하는 연구를 다루고 있습니다. 사람이 원격으로 매니퓰레이터를 조종해 로봇을 학습시키는 방식이 이 연구의 핵심입니다.\n\n이런 방식은 로봇에게 새로운 작업을 가르칠 때 매우 중요합니다. 예를 들어 사람에게 컵을 집어 다른 곳으로 옮겨보라고 하면 별다른 설명 없이도 바로 할 수 있습니다. 로봇에게는 컵의 위치를 찾고, 어느 방향에서 손을 접근시키고, 얼마나 손을 벌린 상태에서 접근하고, 언제 손을 닫고, 어느 방향으로 들어 올릴 것인지까지 일련의 동작이 필요합니다. 주변에 다른 물체가 있으면 충돌도 피해야 합니다. 사람이 직접 시범을 보여주고 그 과정에서 데이터를 얻으면 이러한 복잡한 동작을 로봇에게 전달할 수 있습니다.\n\nPhysical AI에서도 이런 학습 데이터의 확보가 중요한 과제가 됩니다. 언어나 이미지 중심의 인공지능은 인터넷을 통해 방대한 데이터를 확보할 수 있지만, 로봇이 실제 공간에서 움직이고 물체와 접촉하는 과정에 필요한 데이터는 직접 만들어야 하는 경우가 많습니다. 사람이 로봇을 조작하면서 작업을 보여주는 방식은 이러한 실제 행동 데이터를 확보하는 방법 가운데 하나입니다. 이렇게 축적된 데이터를 이용하면 로봇이 새로운 물체를 다루거나 복잡한 작업을 수행할 수 있도록 학습시킬 수 있습니다. 박종우 교수님 연구팀에서도 데이터 기반 기계학습을 로봇 제어에 적용해 미지의 물체를 정교하게 다루고 복잡한 동작을 수행하는 연구를 진행하고 있습니다. (GSAI SNU)\n\n따라서 이 연구는 '로봇에게 누가, 어떻게 행동을 가르치는가'라는 관점에서 이해하시면 좋습니다. 사람이 직접 조작해서 좋은 행동 데이터를 만들어주고, 로봇이 그 데이터를 학습하면서 점차 작업을 수행할 수 있게 만드는 과정입니다. 앞으로 가정이나 산업현장에서 로봇이 훨씬 다양한 물체와 상황을 다루기 위해서는 이러한 조작 데이터와 학습기술이 중요한 역할을 하게 됩니다.", "이곳은 서울대학교 기계공학부 박용래 교수님 연구팀의 센서 기술입니다. 박용래 교수님 연구팀은 부드럽고 유연한 소재를 이용한 소프트 로봇과 센서, 구동기 등을 연구하고 있습니다. 사람의 피부나 근육처럼 휘어지고 늘어나는 구조 안에 센서를 구현하고, 이를 이용해 사람이나 로봇의 움직임과 접촉 상태를 측정하는 것이 중요한 연구분야입니다. 딱딱한 기계부품을 중심으로 구성되던 로봇에 유연한 소재와 센싱기술을 적용하면서 사람과 보다 자연스럽게 상호작용할 수 있는 로봇을 만드는 연구로 이어지고 있습니다.\n\n이곳에는 그중 두 가지 기술이 함께 전시되어 있습니다. 하나는 로봇 손끝에서 힘을 측정하는 3축 포스센서이고, 다른 하나는 사람이 착용하고 손을 움직이면 그 움직임을 측정할 수 있는 액체금속 기반의 장갑입니다. 하나는 로봇이 외부와 접촉하면서 받는 힘을 읽는 기술이고, 다른 하나는 사람의 손이 어떻게 움직이는지를 읽는 기술입니다. 손끝의 힘을 피드백하는 센서와 사람의 손동작을 인식하는 액체금속 장갑, 이렇게 두 가지로 나눠서 이해하시면 됩니다.\n\n먼저 3축 포스센서는 로봇이 물체와 접촉할 때 발생하는 힘을 여러 방향으로 측정합니다. 로봇이 물건을 잡을 때는 물체의 위치를 아는 것과 함께 실제로 얼마나 강하게 누르고 있는지를 아는 것도 중요합니다. 컵을 너무 약하게 잡으면 떨어뜨릴 수 있고, 너무 강하게 잡으면 컵이나 내용물을 손상시킬 수 있습니다. 사람은 손끝의 촉각을 통해 이런 힘을 자연스럽게 조절합니다. 로봇도 손끝이나 피부에 해당하는 센서를 통해 접촉 상태를 측정할 수 있어야 보다 섬세한 조작이 가능합니다. 박용래 교수님 연구팀은 유연한 구조 안에서 수직 방향의 힘과 옆으로 미는 전단력을 함께 측정할 수 있는 다축 소프트 센서 연구를 지속해 왔습니다.\n\n옆에 있는 장갑은 반대 방향의 정보를 얻습니다. 사람이 장갑을 착용하고 손가락을 움직이면 장갑 내부의 유연한 센서가 손가락의 움직임과 관절 변화를 측정합니다. 이 센서에는 액체 상태의 금속을 활용합니다. 액체금속은 전기가 흐르면서도 고체 금속처럼 딱딱하게 형태가 고정되지 않기 때문에, 손가락이 굽혀지고 장갑이 늘어나도 센서의 형태가 함께 변할 수 있습니다. 연구팀은 이러한 신축성 센서를 이용해 손가락의 뼈 길이와 관절각을 동시에 추정하고, 실제 손의 움직임을 실시간으로 재구성하는 기술도 개발했습니다.\n\n이 기술을 로봇 학습과 연결하면 박종우 교수님의 원격조작 연구와도 흥미로운 연결점이 생깁니다. 원격조작 연구에서는 사람이 로봇을 직접 조작하면서 행동 데이터를 만든다면, 여기서는 사람이 평소처럼 손을 움직이는 과정 자체를 센서로 측정할 수 있습니다. 사람이 무엇을 잡고 손가락을 어떻게 움직였는지를 데이터로 만들 수 있고, 이러한 데이터는 로봇 손의 조작이나 사람-로봇 인터페이스에도 활용할 수 있습니다. 반대로 로봇 손끝에서는 힘을 측정할 수 있기 때문에 로봇이 물체와 어떻게 접촉하고 있는지도 데이터로 얻을 수 있습니다.\n\n결국 이곳의 두 가지 센서는 사람과 로봇이 물리적인 세계에서 상호작용하기 위해 필요한 '감각'을 만드는 기술이라고 생각하시면 이해하기 쉽습니다. 사람의 움직임을 로봇이 읽을 수 있는 데이터로 바꾸고, 로봇이 물체와 접촉하면서 발생하는 힘도 다시 데이터로 바꿉니다. Physical AI가 실제 공간에서 사람처럼 물체를 다루고 사람과 함께 작업하려면 보는 능력뿐만 아니라 접촉하고 힘을 느끼는 능력도 중요합니다. 이곳에는 그러한 물리적 상호작용을 가능하게 하는 유연 센서 기술이 전시되어 있습니다.", "이곳은 서울대학교 기계공학부 조규진 교수님 연구팀의 웨어러블 로봇 연구입니다. 조규진 교수님 연구팀은 소프트 로봇, 웨어러블 로봇, 생체모사 로봇, 종이접기 원리를 이용한 트랜스포밍 메커니즘 등을 연구하고 있습니다. 사람이나 생물의 움직임을 관찰하고, 유연한 소재와 새로운 구조를 이용해 기존 로봇에서 구현하기 어려웠던 움직임을 만드는 것이 연구의 중요한 특징입니다. 이 가운데 웨어러블 로봇은 사람이 로봇을 몸에 직접 착용하고 로봇의 힘을 이용해 자신의 움직임이나 신체 기능을 보조할 수 있도록 하는 연구입니다. (서울대학교)\n\n이곳에는 조규진 교수님 연구팀의 여러 연구 가운데 사람이 몸에 직접 착용하는 보조기구와 웨어러블 로봇이 전시되어 있습니다. 웨어러블 로봇은 사람과 로봇이 가장 가까운 거리에서 상호작용하는 로봇이라고 생각하시면 됩니다. 사람이 로봇을 타거나 밖에서 조종하는 방식과 달리, 로봇을 신체에 착용하고 사람의 움직임에 맞춰 함께 움직입니다. 따라서 로봇이 얼마나 큰 힘을 낼 수 있는지도 중요하지만, 사람이 착용했을 때 얼마나 편안한지, 사람의 움직임을 얼마나 자연스럽게 따라가는지, 사용자가 무엇을 하려고 하는지를 얼마나 정확하게 파악하는지도 함께 중요합니다.\n\n조규진 교수님 연구팀의 대표적인 웨어러블 연구 가운데 하나가 손 기능을 보조하는 Exo-Glove 계열입니다. 손을 움직이기 어려운 사용자가 장갑처럼 착용하면 로봇이 손가락을 움직이는 힘을 보조해 물건을 잡을 수 있도록 하는 장치입니다. 유연한 폴리머 소재와 텐던, 즉 힘을 전달하는 와이어를 이용해 손가락을 움직이는 방식이 적용됐습니다. 이후에는 카메라와 인공지능을 이용해 사용자가 어떤 물체를 잡으려고 하는지 예측하는 연구까지 이어졌습니다. 사람이 컵을 향해 팔을 움직이면 로봇이 그 행동과 주변 상황을 파악하고 손의 움직임을 보조하는 방식입니다. (서울대학교)\n\n최근 연구는 '어떻게 움직여 줄 것인가'에서 '어떻게 편하게 착용할 것인가'까지 범위를 넓히고 있습니다. 2026년 연구에서는 거동이 불편한 사용자가 웨어러블 로봇을 스스로 착용하기 어려운 문제를 해결하기 위해, 하나의 텐던 구동기로 여러 고정부를 자동으로 조여주는 자동 착용 구조도 개발했습니다. 이를 팔꿈치와 발목을 보조하는 웨어러블 로봇에 적용했습니다. 실제 사용자를 중심에 두고 로봇의 구조와 구동방식을 설계한다는 연구실의 방향을 잘 보여주는 사례입니다. (서울대학교 전자출결시스템)\n\n이 공간은 로봇과 사람이 어떻게 하나의 시스템처럼 움직이는지를 중심으로 이해하시면 좋습니다. 로봇이 사용자의 움직임과 의도를 파악하고, 필요한 순간에 필요한 힘을 더해주며, 그 과정에서 사람이 자연스럽게 움직일 수 있도록 만드는 것이 핵심입니다. 박용래 교수님 연구팀의 센서와 사람의 움직임 인식기술도 이런 웨어러블 로봇과 연결될 수 있습니다. 센서가 사람의 상태와 움직임을 읽고, 로봇이 판단한 뒤, 구동기가 실제로 힘을 만들어 사람을 도와주는 흐름입니다.\n\n이러한 웨어러블 로봇은 저희 연구소가 지향하는 인간 중심 Physical AI를 이해하기에도 좋은 사례입니다. 사람이 하려는 행동을 로봇이 이해하고 실제 물리적인 힘으로 사람을 지원하기 때문입니다. 손과 팔, 다리처럼 사람의 신체 기능을 보조하는 영역에서 활용할 수 있고, 재활과 일상생활 지원, 작업자의 신체 부담을 줄이는 분야까지 다양한 응용으로 확장할 수 있습니다. 이곳에는 그 가운데 실제로 사람이 착용하고 신체의 움직임을 보조하는 로봇이 어떤 형태로 구현되는지가 전시되어 있습니다.", "이 공간은 여러 연구팀이 함께 활용하는 공용 연구공간입니다. 로봇 연구에서는 로봇 자체를 만드는 것만큼 로봇과 사람, 주변 환경이 어떻게 움직이는지를 정확하게 측정하고 데이터로 만드는 과정도 중요합니다. 이곳에서는 카메라와 여러 계측장비를 활용해 사람이나 로봇의 움직임을 촬영하고, 연구에 필요한 데이터를 획득하는 작업을 수행합니다. 여러 연구팀이 함께 영상과 데이터를 캡처하는 공용 공간이라고 이해하시면 됩니다.\n\n예를 들어 사람이 팔을 들어 물체를 잡는 동작을 연구한다고 생각해보겠습니다. 사람에게는 자연스러운 동작이지만 로봇에게 가르치기 위해서는 손이 어디에서 출발했고, 어떤 경로로 움직였으며, 손목의 방향이 어떻게 변했고, 어느 순간 물체를 잡았는지를 데이터로 만들어야 합니다. 로봇의 움직임을 분석할 때도 마찬가지입니다. 로봇이 목표한 경로를 정확하게 따라갔는지, 실제 움직임과 계산된 움직임 사이에 어느 정도 차이가 있는지 등을 객관적인 데이터로 확인할 수 있어야 합니다.\n\n최근 Physical AI 연구가 확대되면서 이러한 데이터의 중요성도 더욱 커지고 있습니다. 로봇이 실제 환경에서 행동하는 방법을 학습하려면 이미지나 텍스트와 함께 사람과 로봇의 움직임, 물체와의 접촉, 주변 공간의 변화와 같은 물리적인 데이터가 필요합니다. 원격조작이나 웨어러블 센서 연구도 결국 사람의 행동을 로봇이 활용할 수 있는 데이터로 만드는 기술과 연결됩니다. 이 공간은 여러 연구팀이 이러한 데이터를 획득하고 실험 결과를 검증할 수 있도록 지원하는 공용 연구 인프라라고 이해하시면 됩니다.\n\n로보틱스연구소에는 서로 다른 전공과 연구주제를 가진 많은 교수님과 연구진이 참여하고 있기 때문에 이런 공용 인프라의 역할도 중요합니다. 한 연구팀이 구축한 실험환경이나 데이터 획득 장비를 다른 연구팀과 함께 활용할 수 있고, 서로 다른 기술을 하나의 실험에서 결합할 수도 있습니다. 로봇 하드웨어, 센서, 인공지능과 학습을 각각 연구하는 연구진이 같은 공간에서 데이터를 만들고 기술을 검증하면서 융합연구를 진행할 수 있습니다. 이곳은 그러한 공동연구를 뒷받침하는 실험공간 가운데 하나입니다.", "이곳은 조규진 교수님 연구팀의 Morphic 관련 연구입니다. 조규진 교수님 연구팀의 중요한 연구분야 가운데 하나가 생체모사 로봇과 오리가미 기반 로봇입니다. 자연에 있는 생물의 움직임과 구조를 관찰하고, 그 안에 숨어 있는 원리를 로봇의 몸체와 메커니즘에 적용합니다. 여기에 종이접기의 접힘과 펼침 원리를 활용해 로봇이 필요에 따라 크기와 형태를 바꿀 수 있도록 하는 연구도 함께 진행하고 있습니다. 바이오로보틱스 연구실에서도 생체모사, 오리가미 구조, 소프트 로봇, 웨어러블 로봇과 의수를 주요 연구분야로 소개하고 있습니다. (서울대학교 전자출결시스템)\n\n생체모사는 자연에 있는 모습을 그대로 복제하는 것보다 생물이 가진 뛰어난 움직임의 원리를 찾아 로봇에 적용하는 과정으로 이해하시면 쉽습니다. 대표적인 사례가 조규진 교수님과 김호영 교수님 연구팀이 개발한 소금쟁이 로봇입니다. 소금쟁이가 물 위에서 뛰어오를 때 다리를 움직이는 방식과 물의 표면장력을 이용하는 원리를 분석하고, 이를 실제 소형 로봇으로 구현했습니다. 이 연구에는 당시 조규진 교수님 연구팀의 정순필 연구원도 참여했습니다. 연구결과는 2015년 국제학술지 Science에 발표됐습니다. (서울대학교)\n\n무당벌레의 날개도 로봇 구조를 만드는 아이디어가 됐습니다. 무당벌레는 작은 몸 안에 날개를 접어 넣고 있다가 필요할 때 빠르게 펼칠 수 있습니다. 연구팀은 이러한 원리를 종이접기 구조에 적용해 작게 접혀 있다가 빠르게 펼쳐지고, 펼쳐진 뒤에는 비행에 필요한 강성을 유지하는 날개를 만들었습니다. 실제로 이 날개를 이용해 점프한 뒤 날개를 펼쳐 활강하는 로봇까지 구현했습니다. 종이접기의 원리가 공간을 줄이는 방법에서 출발해 로봇의 움직임과 기능을 만들어내는 기술로 확장된 사례입니다. (서울대학교)\n\n이곳의 Morphic 연구도 이러한 맥락에서 이해하시면 됩니다. 핵심은 로봇의 몸과 부품이 하나의 고정된 형태를 유지하는 대신, 수행해야 하는 작업이나 주변 환경에 맞춰 형태를 변화시키는 것입니다. 작은 상태로 이동하거나 보관하고, 필요한 순간에 크게 펼쳐 기능을 수행할 수도 있습니다. 좁은 공간을 통과할 때와 넓은 공간에서 작업할 때 서로 다른 형태를 사용할 수도 있습니다. 로봇의 몸체 자체가 환경과 작업에 맞춰 변화하면서 기능을 만들어내는 것입니다.\n\n조규진 교수님 연구팀은 실제로 종이접기 원리를 이용해 1톤급 차량의 하중을 견디면서 형태를 바꿀 수 있는 가변형 바퀴도 개발했습니다. 평평한 도로에서는 일반적인 바퀴 형태를 사용하고, 장애물이 많은 환경에서는 바퀴의 형상을 변화시켜 이동성을 높이는 개념입니다. 종이접기의 기하학적인 구조가 큰 하중을 견디는 기계구조와 결합된 사례입니다. (서울대학교)\n\n소프트 로봇과 오리가미를 결합하면 형태변화의 범위는 더 커집니다. 연구팀은 펠리컨장어의 큰 입과 몸의 변형에서 아이디어를 얻어, 작게 접혀 있다가 필요할 때 크게 펼쳐지고 다시 부드럽게 변형되는 소프트 로봇도 개발했습니다. 이 원리를 이용해 작은 상태로 숨어 있다가 길게 늘어나는 수중 탐색 로봇과 형태가 변하는 소프트 그리퍼 등을 구현했습니다. (서울대학교 공과대학)\n\n그래서 이 공간은 각각의 부품을 개별적으로 보는 것과 함께 '로봇의 몸 자체가 어떻게 기능을 만들어내는가'라는 관점에서 이해하시면 좋습니다. 조규진 교수님 연구팀에서는 이러한 개념을 체화지능, 즉 Embodied Intelligence의 관점에서도 연구하고 있습니다. 인공지능과 제어기술에 로봇의 재료, 구조와 메커니즘을 함께 설계해 환경에 적응하는 능력을 구현하는 것입니다. (그랜드퀘스트) 이곳에 전시된 구조와 부품들은 생체모사와 오리가미, 소프트 로봇 기술을 이용해 로봇의 몸을 더 유연하고 변화 가능한 형태로 만드는 연구의 한 부분입니다.", "이곳도 조규진 교수님 연구팀에서 진행하고 있는 로봇 핸드와 그리퍼 연구입니다. 로봇의 몸체와 구조가 환경에 맞춰 형태를 바꾸는 Morphic 연구와 달리, 여기에서는 로봇이 실제 물체와 접촉하고 잡는 기술을 다룹니다. 조규진 교수님 연구팀에서는 소프트 로봇과 생체모사 설계를 바탕으로 의수와 로봇 손, 다양한 형태의 그리퍼를 지속적으로 연구하고 있습니다. 연구실 내부에서도 의수 연구를 별도의 주요 연구분야로 운영하며 사람 손의 구조와 움직임을 로봇 메커니즘으로 구현하는 연구를 진행하고 있습니다. (서울대학교 전자출결시스템)\n\n여기에서 먼저 소개할 것이 텐던 방식으로 구동되는 로봇 손입니다. 텐던은 쉽게 생각하면 사람 손의 힘줄과 비슷한 역할을 하는 와이어입니다. 사람의 손도 근육이 손가락의 모든 관절에 직접 붙어서 움직이는 방식으로 구성되어 있지 않습니다. 근육에서 만들어진 힘이 힘줄을 통해 전달되고, 그 힘에 따라 여러 관절이 움직입니다. 로봇 손에서도 이러한 원리를 활용해 모터에서 발생한 힘을 와이어를 통해 손가락까지 전달할 수 있습니다.\n\n이 방식은 사람 손처럼 많은 관절을 가진 로봇을 만들 때 장점이 있습니다. 손가락 하나만 보더라도 여러 관절이 함께 움직이고, 다섯 손가락과 손목까지 포함하면 매우 많은 움직임을 만들어야 합니다. 각각의 관절 주변에 모터와 감속기를 모두 배치하면 손의 크기와 무게가 빠르게 증가합니다. 텐던을 사용하면 구동기의 위치를 손가락에서 떨어뜨려 배치하고 와이어를 통해 힘을 전달할 수 있습니다. 그래서 손 부분을 상대적으로 작고 가볍게 구성하면서도 물체를 잡는 데 필요한 힘을 전달할 수 있습니다. 이러한 텐던 구동 방식과 높은 파지력이 이 전시물의 중요한 특징입니다.\n\n로봇 손을 만드는 데에는 또 하나의 어려움이 있습니다. 사람이 물건을 잡는 방법이 매우 다양하다는 점입니다. 컵을 잡을 때와 동전을 집을 때 손가락의 움직임이 다르고, 무거운 상자를 들 때와 깨지기 쉬운 물체를 잡을 때 사용하는 힘도 다릅니다. 그래서 로봇 손 연구에서는 많은 자유도를 구현하는 것과 함께, 그 자유도를 실제 작업에서 효과적으로 사용하는 방법도 중요합니다. 박용래 교수님의 촉각센서와 손동작 인식, 박종우 교수님의 로봇 학습기술이 결국 이러한 로봇 손과 연결되는 이유도 여기에 있습니다.\n\n그리퍼 연구에서는 작업 목적에 맞춰 조금 다른 접근도 가능합니다. 사람의 손을 그대로 구현하는 대신 특정 작업을 더 효율적으로 수행할 수 있는 새로운 구조를 설계할 수 있습니다. 조규진 교수님 연구팀은 최근 사람이 여러 물체를 손 안에 차례로 모아 한 번에 운반하는 행동에서 아이디어를 얻어 MOGrip이라는 다물체 파지 그리퍼를 개발했습니다. 물체를 하나 집을 때마다 로봇 팔 전체가 목적지까지 왕복하는 대신, 여러 물체를 차례로 잡아 손바닥 부분에 저장하고 한 번에 이동한 뒤 원하는 위치에 다시 하나씩 놓을 수 있습니다. 이 연구는 2024년 Science Robotics에 발표됐으며 물류와 제조공정에서 로봇의 이동시간을 줄이는 방향으로 활용이 검토되고 있습니다. (서울대학교 공과대학)\n\n이곳의 로봇 핸드와 그리퍼는 결국 '로봇이 사람처럼 다양한 물체를 어떻게 다룰 것인가'를 중심으로 이해하시면 됩니다. 카메라와 비전으로 물체가 어디에 있는지 찾고, 인공지능이 어떤 물체를 잡을지 판단해도 실제 물체와 만나는 마지막 부분은 결국 로봇의 손입니다. 손가락을 어느 위치에 놓을지, 얼마나 큰 힘으로 잡을지, 잡은 물체를 어떻게 유지할지까지 실제 물리적인 상호작용이 여기에서 일어납니다.\n\n현재 이 공간에서는 텐던 구동 방식과 다른 구동방식의 장점을 결합하는 하이브리드 방식의 연구도 진행하고 있습니다. 현대모비스와 관련된 과제로 현재 시작 단계에 있는 연구이며, 공개되지 않은 세부 내용은 내부 연구 범위에 맞춰 설명할 예정입니다. 핵심적으로는 로봇 손의 크기와 무게, 자유도, 파지력과 같은 여러 요소를 함께 고려하면서 보다 효과적인 구동구조를 개발하는 방향으로 이해하시면 됩니다. 이 부분은 현재 진행 중인 연구이기 때문에 앞으로 실제 연구성과가 나오면서 전시 내용도 계속 발전할 수 있습니다.\n\n옆에 보이는 오리가미 구조물도 조규진 교수님 연구팀이 오랫동안 연구해 온 형태변형 구조와 연결됩니다. 종이접기의 원리를 이용하면 평소에는 작게 접어둘 수 있고 필요할 때 펼쳐서 큰 구조물을 만들 수 있습니다. 연구팀은 이러한 원리를 로봇의 날개와 바퀴, 로봇 팔, 소프트 로봇 등 다양한 형태로 확장해 왔습니다. (서울대학교 전자출결시스템) 이 공간에는 생체모사와 오리가미에서 출발한 아이디어가 로봇의 손과 그리퍼, 사람이 사용할 수 있는 구조물까지 어떻게 확장되는지를 보여주는 자료가 함께 전시되어 있습니다.", "이곳은 서울대학교 기계공학부 이동준 교수님 연구팀의 로봇 시뮬레이션과 학습 관련 연구입니다. 이동준 교수님 연구팀은 로봇의 역학과 제어를 기반으로 로봇 조작, 시뮬레이션, 원격로봇과 햅틱·가상현실, 자율이동, 공중로봇 등을 폭넓게 연구하고 있습니다. 최근에는 실제 로봇이 물체와 접촉하고 조작하는 과정을 정밀하게 시뮬레이션하는 기술과 강화학습을 연결하는 연구도 활발하게 진행하고 있습니다. 로봇이 실제 환경에서 움직이기 전에 가상환경에서 다양한 상황을 경험하고 행동을 학습할 수 있도록 만드는 연구입니다. (inrol)\n\n이곳도 이러한 연구 가운데 가상환경에서 로봇을 반복적으로 학습시키는 과정을 다루는 공간입니다. 화면 속에 로봇과 물체, 주변 환경을 만들어 놓고 로봇이 접시와 같은 물체를 밀거나 집고 옮기는 작업을 반복해서 연습합니다. 실제 로봇을 한 번 움직이는 데는 시간이 필요하지만 가상환경에서는 같은 작업을 다양한 조건으로 반복해서 수행할 수 있습니다. 물체의 위치를 바꾸거나 로봇의 시작 자세를 바꾸고, 작업에 성공했을 때와 실패했을 때의 결과를 계속 축적할 수도 있습니다. 이렇게 가상 시뮬레이션에서 로봇을 반복적으로 연습시키는 것이 강화학습입니다.\n\n강화학습은 로봇이 여러 행동을 직접 시도하면서 좋은 행동을 찾아가는 학습방법이라고 생각하시면 이해하기 쉽습니다. 예를 들어 테이블 위의 접시를 원하는 위치까지 밀어야 한다면 어느 지점을 어느 방향으로 밀어야 하는지, 얼마나 힘을 가해야 하는지, 로봇 팔을 어떤 경로로 움직여야 하는지를 여러 번 시도하면서 학습할 수 있습니다. 성공적인 행동에는 높은 보상을 주고 원하는 결과에서 멀어지는 행동에는 낮은 보상을 주면서 점차 좋은 행동을 찾아갑니다. 이런 반복을 충분히 수행하려면 로봇과 물체가 접촉할 때 실제로 어떤 움직임이 발생하는지를 가상환경에서도 상당히 정확하게 계산할 수 있어야 합니다.\n\n그래서 이 연구에서 중요한 부분 가운데 하나가 물리적으로 정확한 시뮬레이션입니다. 로봇 손이 물체에 닿았을 때 어디에서 접촉이 발생하는지, 물체가 밀리거나 회전하는지, 충돌은 발생하는지 등을 실제 환경과 가깝게 계산해야 합니다. 이동준 교수님 연구팀은 최근 로봇의 접촉과 충돌을 빠르고 정확하게 계산하기 위한 시뮬레이션 기술을 계속 개발하고 있습니다. 2026년 연구에서도 로봇 접촉 시뮬레이션을 위한 충돌검출 기술과 물체를 집어 옮기는 작업의 계획기술 등이 발표됐습니다. 연구팀의 실제 논문에서도 대량의 시뮬레이션 데이터가 필요한 강화학습과 실제 로봇으로의 전환을 중요한 활용분야로 다루고 있습니다. (inrol)\n\n박종우 교수님의 원격조작 연구와 비교해 보시면 로봇을 가르치는 여러 방법을 함께 이해하기 좋습니다. 그 연구에서는 사람이 직접 로봇을 조작하면서 좋은 행동의 예를 만들어줍니다. 이곳에서는 로봇이 가상으로 만들어진 물리환경 안에서 다양한 행동을 반복적으로 경험하면서 학습할 수 있습니다. 사람이 만들어주는 실제 행동 데이터와 시뮬레이션에서 만들어지는 대규모 경험 데이터를 함께 활용하면 로봇이 학습할 수 있는 데이터의 범위도 크게 넓어집니다.\n\nPhysical AI에서는 이런 시뮬레이션 기술의 중요성이 더욱 커지고 있습니다. 실제 세상은 물체의 크기와 재질, 위치, 마찰, 조명, 주변 장애물 등 수많은 조건이 계속 달라집니다. 가상환경에서는 이런 조건을 다양하게 바꾸면서 로봇을 반복적으로 학습시킬 수 있습니다. 충분히 학습한 결과를 실제 로봇으로 가져와 적용하면서 학습의 효율을 높일 수도 있습니다. 이곳에서는 로봇이 실제 세상으로 나오기 전에 다양한 행동을 연습하고 학습할 수 있는 '가상의 훈련장'을 만드는 기술이라고 생각하시면 이해하기 쉽습니다.", "이곳은 서울대학교 기계공학부 김아영 교수님 연구팀의 로봇 인식과 물체 파지 연구입니다. 김아영 교수님은 RPM Robotics Lab을 이끌면서 로봇이 주변 공간과 물체를 인식하고, 자신의 위치와 주변 환경을 파악하며, 그 정보를 바탕으로 자율적으로 움직이고 작업할 수 있도록 하는 연구를 진행하고 있습니다. 환경 인식과 센서 융합, 로봇 자율주행이 주요 연구분야이며, 최근에는 로봇이 물체를 정확하게 인식하고 조작하는 기술도 활발하게 연구하고 있습니다. (Sepri)\n\n이곳은 그중 로봇이 카메라를 이용해 물체를 인식하고 원하는 물체를 찾아 실제로 집는 과정을 다루는 공간입니다. 사람은 테이블 위에 여러 물건이 놓여 있어도 어떤 것이 컵이고 어떤 것이 병인지 바로 구분하고 자연스럽게 손을 뻗어 원하는 물체를 집을 수 있습니다. 로봇은 먼저 카메라를 통해 장면을 보고, 어떤 물체가 어디에 있는지 파악해야 합니다. 이어서 물체의 방향과 자세를 계산하고, 로봇 손이 어느 방향에서 접근해야 안정적으로 잡을 수 있는지도 판단해야 합니다. 이 모든 과정이 연결되어야 실제 파지가 이루어집니다.\n\n여기에서 중요한 연구 대상 가운데 하나가 투명한 물체입니다. 유리컵이나 투명한 플라스틱 용기를 생각해보시면 됩니다. 카메라에서 들어오는 빛이 물체 표면에서 반사되기도 하고 물체를 통과하기도 합니다. 뒤쪽의 배경과 조명에 따라 물체의 모습도 크게 달라집니다. 그래서 로봇이 일반적인 물체를 인식할 때 사용하는 카메라와 깊이센서만으로는 투명물체의 정확한 형태와 위치를 파악하기 어려운 경우가 많습니다. 김아영 교수님 연구팀은 이러한 문제를 주요 연구주제로 다루고 있으며, 투명물체의 인식부터 위치와 자세 추정, 실제 로봇 조작까지 연결하고 있습니다. (서울공대 웹진)\n\n실제로 연구팀은 투명물체 연구를 위해 TRansPose라는 대규모 데이터셋도 구축했습니다. 투명물체와 일반 물체 99종을 대상으로 33만 장 이상의 이미지와 약 400만 개의 주석 데이터를 확보했습니다. 일반 RGB 영상과 깊이정보뿐만 아니라 열적외선 정보까지 함께 사용해 투명한 물체를 보다 정확하게 인식할 수 있도록 구성했습니다. 로봇이 사람에게는 너무나 익숙한 유리나 투명 플라스틱 같은 물체를 안정적으로 다루기 위해 얼마나 많은 인식 데이터와 기술이 필요한지를 보여주는 사례입니다. (서울공대 웹진)\n\n이곳의 연구에서는 물체를 인식하는 것과 함께 실제로 '어떻게 집을 것인가'도 중요합니다. 테이블 위에 여러 물체가 가까이 놓여 있으면 로봇은 원하는 물체만 정확하게 잡아야 합니다. 로봇 손이나 그리퍼가 접근하는 과정에서 주변 물체를 건드리면 전체 배치가 흐트러질 수 있습니다. 그래서 원하는 물체의 위치와 자세뿐만 아니라 주변 물체와의 공간적인 관계까지 고려해 접근경로와 파지 위치를 결정해야 합니다. 여러 물체 가운데 원하는 물체만 주변과 간섭하지 않도록 집는 것이 이 연구의 중요한 내용입니다.\n\n김아영 교수님이 이끄는 서울대 연구진은 현대자동차그룹 등과 함께 진행하는 공동로봇연구에서도 투명한 유리와 같은 물체의 인식기술, 사전에 등록되지 않은 물체를 로봇이 파지하는 기술 등을 연구하고 있습니다. 결국 로봇이 실제 가정이나 산업현장에서 활동하려면 미리 준비된 몇 종류의 물체만 다루는 수준을 넘어, 처음 보는 물건이나 주변 환경이 복잡한 상황에서도 물체를 인식하고 다룰 수 있어야 합니다. 이러한 인식과 판단, 조작을 연결하는 것이 중요한 연구방향입니다. (서울대학교 공과대학)\n\n이 연구는 '로봇에게 눈을 만들어주는 기술'이라고 생각하시면 가장 이해하기 쉽습니다. 카메라로 영상을 얻는 것에서 시작해 영상 속에서 물체를 찾아내고, 물체의 3차원 위치와 자세를 이해하고, 주변 상황을 고려해 어떻게 손을 가져갈지를 결정합니다. 그리고 마지막에는 실제 로봇 손이나 그리퍼가 움직여 물체를 집습니다. 조규진 교수님 연구팀의 그리퍼가 로봇의 손에 해당한다면, 이곳의 인식기술은 그 손을 어디로 움직여야 하는지를 알려주는 눈과 공간지각 능력에 해당합니다. Physical AI가 실제 환경에서 스스로 행동하기 위해 필요한 인지와 조작의 연결을 보여주는 연구입니다.", "이곳은 조규진 교수님 연구실에서 박사학위를 받은 정순필 박사의 이동식 전개형 3D 프린팅 로봇 연구입니다. 이 연구의 핵심은 대형 구조물을 만들 수 있는 3D 프린터를 작은 크기로 접어서 이동할 수 있도록 만드는 것입니다. 건축물이나 대형 구조물을 3D 프린팅하려면 출력할 구조물만큼 넓은 작업영역을 가진 프린터가 필요합니다. 정순필 박사는 로보틱스와 전개형 구조기술을 이용해 이동할 때는 작은 크기로 수납하고, 작업현장에 도착하면 크게 펼쳐 대형 3D 프린터로 사용할 수 있는 시스템을 개발했습니다.\n\n실제로 개발된 시스템은 수납할 때 약 0.9m 높이와 0.9m 지름 정도의 크기로 줄어듭니다. 쉽게 생각하면 큰 박스 하나 정도의 공간에 들어갈 수 있는 크기입니다. 작업을 시작하면 구조물이 펼쳐지면서 높이 약 3.6m, 밑변 약 3.2m 규모의 대형 프레임으로 확장됩니다. 작은 상태와 비교하면 작업영역이 몇 배 이상 커지는 것입니다. 이렇게 전개된 프레임에 3D 프린팅 장치를 설치해 사람의 키보다 큰 구조물도 현장에서 바로 제작할 수 있습니다. 프린팅 작업이 끝나면 구조물을 다시 접어 크기를 줄이고 다른 장소로 이동한 뒤 다시 펼쳐 다음 작업을 수행할 수 있습니다. (서울대사람들)\n\n이 시스템에서 중요한 로보틱스 기술은 프린터의 크기를 자유롭게 키우고 줄일 수 있는 전개형 로봇 구조입니다. 정순필 박사 연구팀은 접는 방식과 말아서 수납하는 방식을 함께 사용하는 'Fold-and-Roll' 구조를 개발했습니다. 길게 뻗어 있는 로봇 암을 접고 말아서 작은 공간에 보관하고, 작업할 때는 다시 길게 전개할 수 있습니다. 펼쳐진 상태에서는 3D 프린터가 움직이고 실제 구조물을 제작할 수 있을 정도의 강성과 안정성을 확보해야 합니다. 작은 수납 크기와 넓은 작업영역, 작업에 필요한 구조적 강도를 하나의 로봇 시스템 안에서 구현하는 것이 이 기술의 핵심입니다. (서울대사람들)\n\n2024년에는 이 기술을 실제 대형 3D 프린팅 시스템으로 구현해 미국 보스턴에서 열린 MassRobotics의 Form & Function Robotics Challenge에 출전했고, MIT, 하버드, 코넬, 스탠퍼드 등 여러 대학 팀과 경쟁해 1위를 차지했습니다. 당시 시스템은 수납 상태에서 밑변 약 0.8m, 높이 약 0.75m의 크기였고, 전개하면 최대 밑변 3.4m, 높이 3.6m의 삼각뿔 형태까지 확장됐습니다. 현장에서는 1.2mm 노즐과 PLA 소재를 이용해 약 2,000개의 적층 레이어로 구성된 높이 1.2m의 구조물을 직접 출력하는 시연도 진행했습니다. (서울대학교 공과대학)\n\n이 기술의 장점은 3D 프린터 자체가 이동성을 갖는다는 점입니다. 공장에 설치된 대형 장비로 구조물을 제작해서 현장까지 운반하는 방식과 함께, 필요한 장소로 로봇이 이동해 현장에서 직접 구조물을 제작하는 새로운 방식도 가능해집니다. 예를 들어 건설현장이나 재난현장에 시스템을 가져가 작은 상태로 운반한 뒤 현장에서 프레임을 펼치고 필요한 부품이나 구조물을 바로 제작할 수 있습니다. 모바일 로봇과 결합하면 지정된 위치까지 스스로 이동하고, 대형 프레임을 전개하고, 필요한 구조물을 출력한 뒤 다시 접어서 다음 작업장으로 이동하는 건설 로봇으로도 발전시킬 수 있습니다. 서울대 연구팀에서는 사람이 접근하기 어려운 달이나 화성에서 현지 건설작업을 수행하는 로봇 시스템까지 응용 가능성을 제시하고 있습니다. (서울대학교)\n\n이 연구는 조규진 교수님 연구팀의 Morphic 연구와도 직접 연결됩니다. 필요한 순간에 로봇의 몸을 크게 펼치고, 이동하거나 보관할 때 다시 작은 크기로 줄이는 형태변형 기술을 실제 작업 시스템에 적용한 사례입니다. 2026년에는 정순필 박사가 공동 주저자로 참여한 전개형 구조 연구가 Science Robotics에 발표됐습니다. 연구팀은 구조물을 접는 동시에 말아서 수납할 수 있는 인터레이싱 기반 구조를 개발했고, 약 1m 크기의 모바일 로봇이 현장에 도착한 뒤 밑변 약 3.2m, 높이 약 3.4m의 프레임으로 전개되어 높이 약 2.5m의 구조물을 출력하는 모바일 3D 프린팅 로봇으로 기술을 확장했습니다. (서울대학교)\n\n그래서 이 연구는 '대형 3D 프린터'라는 관점과 함께 '필요한 장소에서 필요한 크기로 변신하는 로봇'이라는 관점에서 이해하시면 더욱 쉽습니다. 작은 로봇이 이동하고, 작업현장에 도착하면 자신의 몸체를 크게 펼쳐 작업공간을 만들고, 로봇 제어와 3D 프린팅 기술을 이용해 필요한 구조물을 현장에서 직접 제작합니다. 작업이 끝나면 다시 작은 크기로 접어서 이동할 수 있습니다. 로봇의 형태변형 기술과 제조기술을 결합해 건설과 대형 구조물 제작까지 로보틱스의 활용범위를 넓힌 연구입니다.", "이곳은 서울대학교 기계공학부 임종우 교수님 연구팀의 로봇 비전 연구입니다. 임종우 교수님은 Robot Vision Lab을 이끌면서 카메라를 이용해 로봇이 주변 공간을 이해하는 기술을 연구하고 있습니다. 대표적인 연구분야가 Visual SLAM, 3차원 공간 재구성, 다중 카메라 기반 깊이 추정, 자율주행을 위한 장면 이해 등입니다. 쉽게 말씀드리면 카메라로 들어오는 2차원 영상을 이용해 로봇이 자신이 어디에 있는지 파악하고, 주변 공간이 어떤 3차원 구조로 되어 있는지를 이해하도록 만드는 기술입니다. (로봇 비전랩)\n\n이곳은 그중 실제 공간을 촬영한 데이터를 이용해 실사에 가까운 3차원 디지털 공간을 만드는 연구를 다루는 공간입니다. 자동차 내비게이션에서 보시는 거리뷰 화면을 떠올리시면 이해가 빠른데, 여기서는 한 걸음 더 나아가 '실제 공간을 로봇이 활용할 수 있는 3차원 디지털 환경으로 만든다'고 생각하시면 됩니다. 카메라를 이용해 실제 환경의 모습을 여러 위치와 방향에서 확보하고, 각 영상 사이의 공간적인 관계를 계산합니다. 이를 바탕으로 벽과 바닥, 물체가 어디에 있고 공간이 어떤 형태로 구성되어 있는지를 3차원으로 재구성합니다. 실제 공간을 3차원 디지털 공간으로 만들어 로봇이 그 안에서 움직이고 학습할 수 있도록 하는 것이 이 전시의 핵심입니다.\n\n사진 한 장을 생각해보시면 이 기술이 왜 필요한지 쉽게 이해할 수 있습니다. 사진을 보면 사람은 방의 모습이나 책상, 의자 같은 물체를 어느 정도 이해할 수 있습니다. 로봇이 실제로 그 공간을 움직이려면 훨씬 많은 정보가 필요합니다. 벽까지 거리가 얼마나 되는지, 책상이 공간상 어디에 있는지, 이동할 수 있는 영역은 어디인지, 로봇의 현재 위치는 어디인지 등을 알아야 합니다. 그래서 여러 카메라 영상에서 깊이와 위치정보를 계산하고, 이를 하나의 3차원 공간으로 연결하는 과정이 필요합니다.\n\n임종우 교수님 연구팀은 이런 문제를 오랫동안 연구해 왔습니다. 대표적으로 여러 대의 광각 카메라를 이용해 주변을 360도로 관찰하면서 카메라의 위치를 추정하고 주변 환경의 깊이와 지도를 동시에 만드는 OmniSLAM 기술을 개발했습니다. 넓은 시야를 가진 여러 카메라의 정보를 결합하면 특정 방향의 영상만 사용하는 것보다 주변 공간을 훨씬 폭넓게 관찰할 수 있습니다. 연구팀은 전방위 카메라 영상으로 주변의 깊이를 추정하는 연구도 수행해 왔습니다. 이러한 기술은 이동로봇과 자율주행차가 자신의 위치와 주변 공간을 파악하는 데 활용할 수 있습니다. (로봇 비전랩)\n\n여기서 한 단계 더 나아가면 실제 공간을 디지털 환경으로 재현할 수 있습니다. 이렇게 만들어진 공간에는 실제 로봇을 바로 투입할 수도 있고, 가상의 로봇을 먼저 넣어 여러 작업을 시험할 수도 있습니다. 로봇의 이동경로를 바꿔보고, 다양한 위치에서 센서가 무엇을 보게 되는지 확인하고, 특정 상황에서 로봇이 어떻게 행동해야 하는지도 학습시킬 수 있습니다. 이동준 교수님 연구팀의 가상 시뮬레이션이 로봇의 '훈련장'이라면, 여기에서는 그 훈련장에 사용할 수 있는 실제 환경의 3차원 공간정보를 만드는 기술이라는 관점에서도 이해할 수 있습니다.\n\n이 부분이 Physical AI에서도 상당히 중요합니다. 로봇이 현실에서 행동하려면 자신이 존재하는 공간을 이해해야 합니다. 사람은 방에 들어가면 주변을 둘러보고 어느 쪽으로 걸어갈 수 있는지, 어디에 장애물이 있는지 자연스럽게 판단합니다. 로봇은 카메라와 센서로 들어오는 데이터를 이용해 이러한 공간정보를 계산해야 합니다. Visual SLAM은 로봇이 이동하면서 자신의 위치와 주변 지도를 함께 만들어가는 대표적인 기술이고, 3차원 재구성 기술은 그 공간을 보다 정밀한 디지털 정보로 만드는 데 활용됩니다. 임종우 교수님 연구팀은 이러한 geometric vision과 semantic vision을 이동로봇, 자동차, 증강·가상현실 등에 적용하는 연구를 진행하고 있습니다. (로봇 비전랩)\n\n그래서 이 연구는 화면에 만들어진 공간이 얼마나 실제처럼 보이는지보다, '로봇이 사용할 수 있는 디지털 공간을 어떻게 만드는가'를 중심으로 이해하시면 좋습니다. 실제 공간을 카메라로 관찰하고, 여러 영상의 관계를 계산하고, 공간의 깊이와 구조를 추정해 3차원 환경을 만듭니다. 여기에 로봇을 넣으면 실제 환경에 투입하기 전에 다양한 위치와 조건에서 움직임과 인식, 학습을 시험할 수 있습니다. 현실세계의 공간을 로봇이 이해하고 학습할 수 있는 디지털 환경으로 연결하는 기술이라고 생각하시면 됩니다.", "이곳은 서울대학교 기계공학부 한경원 교수님 연구팀의 의료로봇 연구입니다. 한경원 교수님은 Healthcare Robotics Lab, HeRo Lab을 이끌면서 로봇과 기계공학 기술을 의료에 적용하는 연구를 진행하고 있습니다. 수술용 로봇과 의료기기, 체내에 적용하는 이식형 장치, 햅틱 피드백, 인공근육, 유연한 센서와 액추에이터 등이 주요 연구분야입니다. 2026년부터 기계공학부 부교수로 재직하고 있으며, 연구실에서는 수술, 치료, 재활에 활용할 수 있는 액추에이터와 센서, 시스템과 메커니즘을 개발하고 있습니다. (Healthcare Robotics Lab @SNU)\n\n이곳의 장치는 그중 심장과 혈류를 대상으로 하는 의료로봇 연구와 관련되어 있습니다. 심장이 실제로 뛰고 혈액이 흐르는 환경에서 개발한 센서나 구동장치가 원하는 기능을 수행하는지 확인하려면 실제 심혈관계와 유사한 조건을 만들어 실험할 수 있는 환경이 필요합니다. 그래서 이곳에는 심장의 움직임과 혈액의 흐름을 모사할 수 있는 실험장치가 구성되어 있습니다. 이 장치는 심장 자체를 연구하기 위한 모형이라기보다, 개발한 장치가 실제로 제대로 작동하는지를 검증하기 위한 실험장치라고 이해하시면 됩니다.\n\n한경원 교수님 연구팀이 집중하고 있는 분야 가운데 하나가 심장과 혈관을 직접 보조할 수 있는 소프트 의료로봇입니다. 사람의 몸 안에 들어가는 장치는 일반적인 산업용 로봇과 매우 다른 조건을 만족해야 합니다. 심장과 혈관은 계속 움직이고 있고 주변 조직도 부드럽습니다. 따라서 사람의 조직과 함께 움직일 수 있는 유연한 소재와 작고 가벼운 구동장치, 움직임과 힘을 측정할 수 있는 센서가 중요합니다. 한경원 교수님 연구팀은 이런 목적에 맞춰 소프트 액추에이터와 신축성 센서, 체내 삽입형 장치를 개발하고 있습니다. (서울공대 웹진)\n\n대표적인 연구가 e-VaC라는 혈관 압박형 심혈관 보조장치입니다. 이 장치는 혈관 바깥쪽을 부드러운 액추에이터가 감싸고 있다가 심장의 박동에 맞춰 압력을 가합니다. 압박하는 시점을 조절하면서 혈류와 압력에 영향을 주어 심장의 기능을 보조하는 방식입니다. 장치 안에는 센싱과 제어기술도 함께 들어가 있어 심장과 혈관의 상태에 맞춰 작동할 수 있도록 연구가 진행됐습니다. 서울대 연구진은 이러한 소프트 액추에이터를 이용한 심혈관 보조기술을 지속적으로 발전시키고 있으며, 최근에는 낮은 전력으로 작동하는 전기활성고분자 기반 심장 보조장치 E-CAD와 형상기억합금을 이용한 이식형 장치 등으로 연구를 확장하고 있습니다. (서울공대 웹진)\n\n이런 장치를 개발하면 실제 심장과 유사한 환경에서 충분히 검증하는 과정이 중요합니다. 바로 그 역할을 하는 것이 이곳에 보이는 심장 모사 실험장치입니다. 심장이 박동하면서 혈액을 밀어내는 상황을 만들어주고, 개발한 센서와 액추에이터를 연결해 장치가 어느 시점에 어떻게 작동하는지 확인할 수 있습니다. 혈류와 압력이 어떻게 달라지는지 측정하고, 구동장치의 작동시점이나 힘을 변화시키면서 심혈관계에 미치는 영향을 반복적으로 실험할 수 있습니다. 실제 환자에게 적용하기 전에 다양한 조건을 만들어 기술을 개발하고 검증하는 연구 플랫폼이라고 생각하시면 이해하기 쉽습니다.\n\n한경원 교수님 연구팀에서는 햅틱 기술도 중요한 분야로 연구하고 있습니다. 햅틱은 사람이 손으로 느끼는 힘과 촉각을 기계장치를 통해 전달하거나 재현하는 기술입니다. 의료로봇에서는 의사가 로봇을 원격으로 조작하면서 조직을 만질 때 발생하는 느낌을 전달하거나, 의료진이 수술이나 시술을 연습할 때 실제와 유사한 촉감을 제공하는 데 활용할 수 있습니다. 연구실에서는 원격 로봇 의료절차와 의료훈련 시뮬레이터를 위한 햅틱 피드백을 주요 연구분야로 다루고 있습니다. (Healthcare Robotics Lab @SNU)\n\n그래서 이 공간은 Physical AI가 의료 분야로 확장되는 사례로 이해하시면 좋습니다. 심장과 혈관의 상태를 센서가 측정하고, 그 데이터를 바탕으로 장치가 상황을 판단하며, 소프트 액추에이터가 실제 사람의 몸에 물리적인 힘을 전달합니다. 센싱과 판단, 구동이 사람의 신체와 직접 연결되는 것입니다. 앞으로 Physical AI가 의료 분야에서 발전하면 로봇이 의사의 수술과 시술을 지원하는 영역부터 환자의 신체 기능을 직접 보조하는 영역까지 다양한 형태로 활용될 수 있습니다.\n\n지금까지 소개한 여러 로봇 연구는 주로 물건을 잡고, 사람의 행동을 배우고, 공간을 인식하고, 가상환경에서 훈련하는 연구였습니다. 이곳은 같은 로보틱스 기술이 사람의 몸과 의료환경으로 들어갔을 때 어떤 형태로 발전할 수 있는지를 보여줍니다. 부드러운 소재로 사람의 조직과 상호작용하고, 센서로 신체의 상태를 측정하며, 필요한 물리적인 힘을 만들어 치료와 기능 보조에 활용하는 연구입니다. 로봇의 활용범위가 산업과 생활공간에서 사람의 신체 내부까지 이어질 수 있다는 점을 보여주는 연구라고 생각하시면 됩니다.", "지금까지 서울대학교 로보틱스연구소에서 진행하고 있는 여러 연구 가운데 일부를 설명해 드렸습니다. 유연한 로봇 구조와 센서, 사람이 로봇에게 행동을 가르치는 학습기술, 사람이 직접 착용하는 웨어러블 로봇, 생체모사와 형태변형 로봇, 물체를 직접 다루는 로봇 핸드와 그리퍼, 가상환경에서 로봇을 훈련시키는 시뮬레이션, 투명한 물체까지 인식하고 잡는 로봇 비전, 현장에서 전개해 사용하는 대형 3D 프린팅 로봇, 실제 공간을 디지털 환경으로 만드는 기술, 심장과 혈관에 적용하는 의료로봇까지 다양한 연구가 진행되고 있습니다.\n\n각각의 연구분야는 서로 다르지만 Physical AI라는 관점에서는 자연스럽게 연결됩니다. 로봇이 실제 세상에서 활동하려면 먼저 주변 환경과 사람을 인식해야 합니다. 무엇을 해야 하는지 판단하고 행동을 학습하는 능력도 필요합니다. 학습한 결과를 실제 움직임으로 구현할 수 있는 로봇의 몸과 구동기술이 필요하고, 물체를 잡고 힘을 조절하기 위한 손과 센서도 필요합니다. 사람의 몸에 착용하거나 의료에 활용하려면 유연한 소재와 안전한 상호작용 기술도 함께 필요합니다. 오늘 보신 여러 연구가 이러한 Physical AI의 서로 다른 부분을 담당하고 있습니다.\n\n서울대학교 로보틱스연구소의 강점도 여기에 있습니다. 현재 80여 명의 교수님이 직·간접적으로 연구소에 참여하고 있고, 그중 41명의 교수님이 NRL 2.0 과제에 직접 참여하고 있습니다. 기계공학과 인공지능을 중심으로 전기전자, 컴퓨터, 재료, 의학과 바이오 등 여러 분야의 연구자들이 각자의 전문기술을 발전시키면서 서로의 연구를 연결하고 있습니다. 하나의 연구실에서 모든 기술을 개발하는 방식보다 각 분야에서 높은 전문성을 가진 연구진이 함께 연구할 수 있는 대규모 융합연구체계를 구축하고 있습니다.\n\n국가연구소 사업을 통해 이러한 연구를 최대 10년간 장기적으로 추진합니다. 연간 약 100억 원 규모의 국가 연구지원을 기반으로 핵심 원천기술을 확보하고, 연구성과를 실제 산업과 사회에서 활용할 수 있는 기술로 발전시키는 데에도 힘을 쏟고 있습니다. 기업과의 공동연구와 산학협력, 기술이전과 사업화를 확대하고, Physical AI 분야에서 새로운 가능성을 가진 기술과 연구자를 발굴해 스타트업으로 성장시키는 창업보육 기능도 함께 강화하고 있습니다. 연구에서 시작한 기술이 기업과 산업으로 이어지고, 새로운 기업과 일자리로 다시 확장되는 로보틱스 혁신 생태계를 만드는 것이 연구소의 중요한 역할입니다.\n\n연구공간도 이러한 성장에 맞춰 확대하고 있습니다. 현재 건물 뒤쪽에 새로운 로보틱스연구소 건물이 들어설 공간을 확보하고 관련 인허가를 완료했으며, 약 2년 후 새로운 연구공간으로 이전하는 것을 계획하고 있습니다. 새로운 공간에서는 연구와 실험뿐만 아니라 기업과의 산학협력, 기술사업화, 스타트업 발굴과 육성까지 보다 긴밀하게 연결할 계획입니다. 연구자와 학생, 기업과 스타트업이 함께 모여 Physical AI 기술을 연구하고 실제 산업으로 발전시킬 수 있는 서울대학교의 로보틱스 거점으로 만들어갈 예정입니다.\n\n오늘 설명드린 연구들도 계속 발전하게 됩니다. 이 공간에 전시된 연구 상당수가 현재 교수님들과 학생, 연구원들이 실제로 진행하고 있는 연구입니다. 새로운 연구성과가 나오면 전시 내용도 추가되고, 지금 설명드린 기술들도 다음 단계의 연구로 발전하게 됩니다. 서울대학교 로보틱스연구소는 이러한 연구를 서로 연결해 사람이 생활하고 일하는 실제 공간에서 함께 활용할 수 있는 인간 중심의 Physical AI를 구현하고, 연구와 산업, 창업이 함께 성장하는 로보틱스 생태계를 만들어가고자 합니다.\n\n이상으로 서울대학교 로보틱스연구소 투어를 마치겠습니다. 오늘 보신 연구나 저희 연구소에 대해 궁금하신 점이 있으시면 편하게 질문해 주시면 설명드리겠습니다. 함께해 주셔서 감사합니다."], "en": ["Hello, I'm ___, and I'll be guiding today's tour of the Robotics Institute at Seoul National University. I currently work here at the Institute in the ___ team. I'll start with a short introduction to the Institute, and then walk you through some of the main research projects going on in this space.\n\nThe SNU Robotics Institute is a hub that connects robotics research from across many different fields at Seoul National University. About 80 professors take part, directly or indirectly, from areas like mechanical engineering, electrical and computer engineering, computer science, and materials science, as well as medicine, public health, and brain and cognitive science. A wide range of research comes together here — from the structure and materials of robots, to sensors, computer vision, control systems, AI and machine learning, human-robot interaction, and medical and biological applications. One important feature of the Institute is that researchers from very different backgrounds actively work together under the single field of robotics.\n\nBased on this research strength, the Institute was selected in 2026 for a new national research program called NRL 2.0, run by Korea's Ministry of Science and ICT and Ministry of Education. Of the roughly 80 professors connected to the Institute, 41 are directly involved in this program. It's a large, long-term project — about 10 billion won in government funding per year, for research that can continue for up to ten years. This lets us connect the technology and researchers built up in individual labs, and support research that ranges from core robotics technology all the way to real-world systems and applications. On August 18, 2026, we held the official opening ceremony for the national robotics institute and began running this research system in earnest.\n\nThe main direction the Institute is working toward is what we call 'human-centered Physical AI.' Physical AI means building AI that can sense and understand its surroundings through a robot's body in the real, physical world — and then move and interact with people accordingly. To do this, we bring together many different technologies: a robot's structure and materials, its actuators (the parts that create movement), sensors and touch, computer vision, control systems, and AI and learning. The goal is to connect these technologies to support people's everyday lives and work, to assist and extend what the human body can do, and to develop human-centered robot technology that can be used in real settings like industry and healthcare.\n\nOver the ten years of this national research program, we plan to build up research results while also creating a foundation for the Institute to keep growing on its own in the long run. We're expanding partnerships and technology transfer with companies, and actively working to turn strong research results into real industry applications. We also plan to strengthen our role in finding promising Physical AI technologies and researchers and helping them grow into startups, including support for very early-stage companies. The goal is to connect research, industry partnerships, technology commercialization, and startups into one ecosystem, building a robotics research and industry hub that can sustain itself over the long term.\n\nAs our research grows, we're also building an independent research space of our own. We've already secured land behind this building and completed the necessary permits, and we plan to move into a dedicated Robotics Institute building in about two years. That new space will include not only research and lab facilities, but also support for industry partnerships, technology commercialization, and finding and nurturing startups. Over time, we want this to become a hub where SNU's Physical AI research, companies, and startups all come together.\n\nWhat you see in this space right now is a selection of research from several different teams. From soft robots and flexible robots built with new materials and structures, to robot hands and grippers, sensors that detect force and touch, and wearable technology that senses and assists human movement — and beyond that, research where people teach robots through remote control, cameras that let robots recognize their surroundings and pick up objects, technology that turns real spaces into digital environments, methods for training robots in virtual environments, and robots and sensors applied to healthcare — you can find all of this in this space.", "This is a robot from the lab of Professor Ahn Seung-hoon in the Department of Mechanical Engineering. His team works broadly on connecting materials, design, and manufacturing to build robots and structures with new capabilities. Their main research areas include smart materials like shape-memory alloys (metals that return to a set shape when heated), composite materials, sensors and actuators, soft robots, and 3D printing (additive manufacturing). Recently, they developed an extremely lightweight but very strong 3D lattice structure using continuous carbon fiber, and used it to build robot arms and drone frames.\n\nWhat's here is a flexible, segmented robot — a bit like an elephant's trunk. Think of a typical industrial robot arm: it has a handful of joints, each rotating in a fixed direction to change the arm's position. This robot instead has many small sections connected in a row, all moving together. That lets it change its overall shape and wrap around an object to grip it, adapting to whatever shape that object happens to be. Using many joints and a flexible structure to match and wrap around different shapes is the key idea behind this robot.\n\nWhat matters most in this kind of robot is that the structure itself actively creates the motion. Professor Ahn's team has long researched how to build function directly into materials and structures. For example, they combined shape-memory alloy with a knitted fabric structure to create a soft actuator — something that can bend, twist, stretch, and change its 3D shape depending on temperature or electrical current, almost like a structure that can move on its own, the way a flower opens. This idea is applied to soft robots and wearable devices.\n\nThe easiest way to think about this robot is through the question: 'how flexible can we make a robot?' A typical robot arm is very good at precisely moving a fixed set of joints. This segmented robot instead focuses on using the movement and deformation of many parts together, so it can adapt its shape to whatever it's working with. As robots move beyond structured factory settings into spaces with people and irregularly shaped objects, this kind of flexible structure and movement will likely become more and more useful.\n\nOne defining feature of Professor Ahn's team is exactly this combination of materials, design, and manufacturing. Rather than thinking about a robot's movement only in terms of controllers or motors, they design the material, the structure, and the manufacturing method all together. They've applied smart materials and functional composites to robots, and expanded into soft robotics, sensors, 3D printing, and micro/nano manufacturing. What's on display here is one example of how a flexible structure lets a robot move and interact with objects.", "This is robot-learning research from the lab of Professor Park Jong-woo in the Department of Mechanical Engineering. His team has long worked on mathematically modeling and controlling robot motion, and more recently has been combining this with AI and data-driven learning methods. Their main research areas include robot motion and control, object manipulation, mobile manipulation (moving around while performing tasks), and physics-based simulation. Recently, they've also been actively researching how robots can learn complex tasks from data — including imitation learning, object manipulation, and real-time collision detection.\n\nThis space is about how a person teaches a robot a task. For a robot to pick up and move different objects the way a person does, it first needs to learn what to do in different situations. When a person directly controls the robot remotely to carry out a task, the robot can record data along the way — how the arm moved, where exactly it grasped the object, and in what order the steps happened. This space focuses on that process: a person remotely controlling the robot, and using that motion data to train it. Having a person remotely guide the robot's movements is the key idea here.\n\nThis approach matters a lot when teaching a robot something new. For a person, picking up a cup and moving it somewhere else needs no explanation at all. For a robot, it means a whole sequence of steps: finding the cup's position, choosing which direction to approach from, how wide to open its hand, when to close it, and which direction to lift it — all while avoiding other nearby objects. When a person demonstrates the task directly and the robot records the data, that complex sequence of actions can be passed on to the robot.\n\nCollecting this kind of real-world action data is an important challenge for Physical AI. AI focused on language or images can pull huge amounts of data from the internet, but data about a robot actually moving through physical space and touching objects usually has to be created directly. Having a person operate the robot and demonstrate tasks is one way to collect this real action data. Once enough of this data is gathered, it can be used to train robots to handle new objects or perform more complex tasks. Professor Park's team applies data-driven machine learning to robot control in this way, working on precisely handling unfamiliar objects and performing complex motions.\n\nSo it helps to think of this research in terms of 'who teaches the robot, and how.' A person operates the robot directly to create good examples of the task, and the robot gradually learns to perform it by training on that data. As robots take on a much wider range of objects and situations in homes and industry, this kind of demonstration data and learning technology will play an important role.", "This is sensor technology from the lab of Professor Park Yong-rae in the Department of Mechanical Engineering. His team works on soft robots, sensors, and actuators built from soft, flexible materials. A key research area is building sensors into structures that can bend and stretch like human skin and muscle, and using them to measure movement and contact — for either a person or a robot. This work is part of a larger shift from robots made mostly of rigid mechanical parts toward robots that use flexible materials and sensing to interact more naturally with people.\n\nTwo technologies are on display here. One is a 3-axis force sensor that measures force at a robot's fingertip. The other is a glove based on liquid metal that measures how a person's fingers move. One reads the force a robot feels when it touches something from the outside; the other reads how a human hand is moving. It helps to think of them as a pair: a sensor that gives fingertip force feedback, and a liquid-metal glove that senses human hand movement.\n\nThe 3-axis force sensor measures the force a robot feels from several directions when it touches an object. When a robot grips something, it's not enough to know where the object is — it also needs to know how hard it's actually pressing. Grip too lightly, and you drop a cup; grip too hard, and you might damage it or spill the contents. People naturally adjust their grip using the sense of touch in their fingertips, and a robot needs a similar kind of sensor at its fingertips or 'skin' to make similarly delicate adjustments. Professor Park's team has continued developing multi-axis, soft sensors that can measure both the force pressing straight in and the force pushing sideways, all within a flexible structure.\n\nThe glove next to it works in the opposite direction. When a person wears the glove and moves their fingers, a flexible sensor inside tracks the movement and the changing angles of the finger joints. This sensor uses liquid metal — a metal that conducts electricity but, unlike a solid metal, doesn't hold a rigid shape. That means it can bend and stretch right along with the finger and the glove without breaking the sensor. Using this stretchable sensor, the team can estimate both finger-bone length and joint angle at the same time, and reconstruct a person's hand movement in real time.\n\nConnecting this to robot learning creates an interesting link with Professor Park Jong-woo's remote-control research. There, a person directly operates a robot to create action data. Here, the sensor can capture the process of a person simply moving their hand the way they normally would — what they're holding, and how their fingers move — turning it into data that's useful for training robot hands or for human-robot interfaces. And on the robot side, the fingertip sensor can capture data about exactly how the robot is touching an object.\n\nIn the end, it's easiest to think of these two sensors as technology that creates a physical 'sense' needed for people and robots to interact in the real world. One turns human movement into data a robot can use; the other turns the force of a robot's contact with an object into data as well. For Physical AI to handle objects and work alongside people the way humans do, it needs more than just the ability to see — it also needs to touch and feel force. What's on display here is the flexible sensor technology that makes that kind of physical interaction possible.", "This is wearable-robot research from the lab of Professor Cho Kyu-jin in the Department of Mechanical Engineering, who also directs the Robotics Institute. His team researches soft robots, wearable robots, biomimetic robots (robots inspired by living things), and shape-changing mechanisms based on the principles of origami. A key feature of their work is observing how people and other living things move, and using flexible materials and new structures to create movement that's hard to achieve with a conventional robot. Wearable robots, one focus of this research, are worn directly on the body and use the robot's own force to assist or extend a person's movement or physical function.\n\nOn display here are assistive devices and wearable robots that a person wears directly on the body. You can think of a wearable robot as the kind of robot that interacts with a person at the closest possible range. Rather than riding a robot or controlling it from a distance, a person wears it on their body, and it moves along with them. Because of that, it's not just about how much force the robot can produce — it also matters a great deal how comfortable it is to wear, how naturally it follows the wearer's movement, and how accurately it senses what the user is trying to do.\n\nOne well-known example from Professor Cho's team is the Exo-Glove line, which assists hand function. A user who has difficulty moving their hand wears it like a glove, and the robot helps move the fingers with enough force to grip objects. It uses flexible polymer material along with tendons — wires that transmit force — to move the fingers. Later research added cameras and AI to predict which object the user is trying to grasp: when a person reaches toward a cup, the robot senses that action and the surrounding situation, and helps move the hand accordingly.\n\nMore recent work has expanded from 'how should the robot move' to 'how can it be worn comfortably.' In 2026 research, to help users with limited mobility who struggle to put on a wearable robot by themselves, the team developed a self-fastening structure where a single tendon-driven actuator tightens several fastening points automatically. This was applied to wearable robots that assist the elbow and ankle — a good example of how the lab designs a robot's structure and actuation method with the actual user at the center.\n\nIt helps to think of this space in terms of how the robot and the person move as a single system. The robot senses the user's movement and intent, adds the right amount of force at the right moment, and helps the person move naturally. The sensors and hand-movement recognition from Professor Park Yong-rae's team can connect with this kind of wearable robot too: a sensor reads the person's state and movement, the robot makes a decision, and the actuator generates the actual force to help the person.\n\nWearable robots are also a great example of the human-centered Physical AI this Institute is working toward, since the robot understands what a person is trying to do and supports them with real physical force. They can assist body functions like the hands, arms, and legs, and extend into rehabilitation, everyday support, and reducing physical strain for workers. What's on display here is one form this can take: a robot that's actually worn on the body and helps assist a person's movement.", "This is a shared research space used by several different teams. In robotics research, building the robot itself is only part of the job — it's just as important to accurately measure and record how a robot, a person, and their surroundings actually move. Here, cameras and various measurement equipment are used to record the movement of people and robots and collect the data needed for research. Think of it as a shared space where multiple teams capture video and data together.\n\nFor example, imagine studying the motion of a person reaching out and grasping an object. It's a completely natural movement for a person, but to teach it to a robot, you need to turn it into data: where the hand started, what path it followed, how the wrist changed direction, and the exact moment it grasped the object. The same goes for analyzing a robot's own movement — you need objective data on whether it followed its intended path accurately, and how much its actual movement differed from what was calculated.\n\nAs Physical AI research grows, this kind of data becomes even more important. For a robot to learn how to act in the real world, it needs physical data — not just images and text, but data about how people and robots move, how they make contact with objects, and how the surrounding space changes. The remote-control and wearable-sensor research shown elsewhere in this tour also connects back to this same idea: turning human actions into data a robot can use. This space supports that work — it's shared research infrastructure where different teams can gather this kind of data and verify their experimental results.\n\nBecause the Robotics Institute brings together so many professors and researchers from different fields and topics, this kind of shared infrastructure plays an important role. One team's experimental setup or data-capture equipment can be used by another team, and different technologies can be combined within a single experiment. Researchers working separately on robot hardware, sensors, or AI and learning can share this space to generate data, verify their technology, and carry out collaborative, cross-disciplinary research. This is one of the experimental spaces that supports that kind of collaboration.", "This is 'Morphic' research from the lab of Professor Cho Kyu-jin. One important research area for his team is biomimetic robots and origami-based robots. They observe the movement and structure of living things in nature, and apply the underlying principles to a robot's body and mechanisms. They also use the folding and unfolding principles of origami so that a robot can change its size and shape as needed. The lab lists biomimetics, origami structures, soft robots, wearable robots, and prosthetic hands among its main research areas.\n\nIt's easiest to think of biomimetics not as copying nature exactly, but as finding the underlying principle behind an especially effective natural movement and applying it to a robot. A well-known example is the water strider robot, developed by Professor Cho's team together with Professor Kim Ho-young's team. They analyzed how a water strider moves its legs to jump on the surface of water, using the water's surface tension, and built a small robot based on that principle. Researcher Jung Soon-pil, then part of Professor Cho's lab, took part in this work as well. The results were published in the journal Science in 2015.\n\nA ladybug's wings also inspired a robot structure. A ladybug can fold its wings into a small body and unfold them quickly when needed. The team applied this idea to an origami-based structure, creating wings that fold up small, unfold quickly, and stay stiff enough for flight once open. They even built a robot that jumps, then unfolds its wings and glides. It's a good example of how the origami principle — originally just a way to save space — expanded into a technology for creating robot movement and function.\n\nThe Morphic research here follows the same idea. The key point is that instead of keeping one fixed shape, a robot's body or parts change shape to match the task or the surrounding environment. It might move or store itself in a small, compact form, then unfold to a larger size when it's time to work. It might use one shape to pass through a narrow space, and another to work in an open area. The robot's body itself changes along with the environment and task to create the function that's needed.\n\nProfessor Cho's team also used origami principles to build a shape-changing wheel that can support the weight of a one-ton vehicle while changing its form. On flat roads, it uses a normal wheel shape; in environments with obstacles, it changes shape to improve mobility — combining the geometry of origami with a mechanical structure strong enough for real loads.\n\nCombining soft robotics with origami expands the range of shape-change even further. Inspired by how a pelican eel can open its mouth wide and stretch its body, the team built soft robots that fold up small and then expand dramatically and reshape themselves when needed. Using this idea, they created underwater exploration robots that hide in a small form and stretch out long, along with soft grippers that change shape.\n\nSo it helps to look at this space not just as a set of individual parts, but by asking, 'how does the robot's body itself create function?' Professor Cho's team also studies this concept from the perspective of embodied intelligence — the idea of designing a robot's materials, structure, and mechanisms together with its AI and control systems, so the robot's ability to adapt to its environment comes from the whole package, not just the software. What's on display here — structures and parts built from biomimetics, origami, and soft robotics — is one part of that larger effort to make a robot's body more flexible and adaptable.", "This is also robot hand and gripper research from Professor Cho Kyu-jin's team. Unlike the Morphic research, where the robot's body and structure change shape to fit the environment, this space is about how a robot actually makes contact with and grips real objects. Building on soft robotics and biomimetic design, the team continues to research prosthetic hands, robot hands, and grippers of many different forms — prosthetic hand research, in particular, is treated as its own major focus within the lab, applying the structure and movement of a human hand to a robot mechanism.\n\nFirst is a robot hand driven by tendons — essentially wires that play a role similar to the tendons in a human hand. In a human hand, the muscles aren't attached directly to every joint; instead, force created in the muscle travels through a tendon, and that force moves several joints at once. A robot hand can use the same idea, transmitting force generated by a motor through a wire all the way to the fingers.\n\nThis approach has clear advantages for a robot hand with as many joints as a human hand. Just one finger already has several joints moving together, and once you add five fingers and a wrist, there's a huge number of individual movements to create. If you placed a motor and gearbox at every single joint, the hand would quickly become too large and heavy. Using tendons lets you place the actuator away from the fingers and still deliver the needed force through a wire — keeping the hand itself relatively small and light while still gripping with enough strength. This tendon-driven design, combined with strong gripping force, is the key feature of what's on display here.\n\nBuilding a robot hand comes with another challenge: people grip objects in so many different ways. The finger motion for picking up a cup is different from picking up a coin, and the force needed for a heavy box is different from a fragile object. So robot-hand research isn't just about achieving many degrees of freedom — it's also about using that flexibility effectively in real tasks. This is exactly where Professor Park Yong-rae's touch sensors and hand-motion sensing, and Professor Park Jong-woo's robot-learning methods, connect back to this robot hand.\n\nGripper research allows for a somewhat different approach, tailored to a specific task rather than copying the human hand exactly. Inspired by how a person can gather several objects in one hand before carrying them all at once, Professor Cho's team recently developed a gripper called MOGrip, designed to hold multiple objects. Instead of having the robot arm travel back and forth to its destination for every single object, it can pick up several objects one after another, store them in its palm, carry them all in one trip, and then place them down one at a time. This research was published in Science Robotics in 2024, and is being explored as a way to reduce a robot's travel time in logistics and manufacturing.\n\nIt helps to understand the robot hands and grippers on display here through the question: 'how can a robot handle a wide variety of objects the way a person does?' Cameras and computer vision can locate an object, and AI can decide which one to pick up — but the final point of contact with a real object always comes down to the robot's hand. Deciding exactly where to place the fingers, how much force to use, and how to keep hold of the object is where the real physical interaction happens.\n\nThis space also includes ongoing research into a hybrid hand that combines tendon-driven movement with other actuation methods. It's an early-stage project connected to Hyundai Mobis, so details that haven't been made public will only be shared to the extent appropriate for an internal research setting. In short, the goal is to develop a more effective actuation structure by balancing several factors together — a robot hand's size, weight, degrees of freedom, and gripping force. Since this research is still ongoing, the exhibit here is likely to keep evolving as new results come in.\n\nThe origami structure next to this exhibit also connects to the shape-changing structures Professor Cho's team has studied for a long time. Using the principles of origami, something can normally be folded up small and then unfolded into a large structure when needed. The team has extended this idea into many forms — robot wings, wheels, robot arms, and soft robots. What's on display here also includes material showing how ideas that started with biomimetics and origami have expanded into robot hands, grippers, and structures people can use directly.", "This is robot simulation and learning research from the lab of Professor Lee Dong-jun in the Department of Mechanical Engineering. His team researches broadly across robot dynamics and control, robot manipulation, simulation, teleoperated robots, haptics and virtual reality, autonomous mobility, and aerial robots. More recently, they've been actively working on connecting reinforcement learning with technology that precisely simulates how a real robot makes contact with and manipulates objects — helping a robot experience many different situations and learn how to behave in a virtual environment before it ever moves in the real world.\n\nThis space is also about training a robot repeatedly inside a virtual environment. A robot and objects and their surroundings are created on screen, and the robot practices pushing, picking up, and moving objects like a plate, over and over. Moving a real robot takes real time, but in a virtual environment, the same task can be repeated many times under many different conditions — changing where the object starts, changing the robot's starting posture, and building up a record of both successes and failures. This repeated practice inside a virtual simulation is what's known as reinforcement learning.\n\nIt's easiest to think of reinforcement learning as a method where a robot tries out many different actions and gradually discovers which ones work well. For example, to push a plate on a table to a target position, the robot might try many combinations of where and in which direction to push, how much force to apply, and what path to move its arm along. Actions that lead to success get a higher reward, and actions that move further from the goal get a lower reward, so the robot gradually converges on good behavior. To do this enough times, the virtual environment needs to calculate, quite accurately, what actually happens when the robot and an object make contact.\n\nThat's why physically accurate simulation is such an important part of this research. It has to closely calculate where contact occurs when a robot's hand touches an object, whether the object gets pushed or starts to rotate, and whether any collisions happen. Professor Lee's team keeps developing simulation technology to calculate a robot's contacts and collisions quickly and accurately — recent work from 2026 includes collision-detection methods for simulating robot contact, along with planning techniques for picking up and moving objects. Their published research also treats the connection between large-scale simulation data for reinforcement learning and transferring that learning to a real robot as an important application area.\n\nIt's useful to compare this with Professor Park Jong-woo's remote-control research to understand the different ways a robot can be taught. There, a person directly operates the robot to create good examples of a task. Here, the robot repeatedly experiences a wide range of actions inside a virtual physical environment. Combining real demonstration data from people with the large-scale experience generated in simulation greatly expands the range of data a robot can learn from.\n\nThis kind of simulation technology is becoming increasingly important for Physical AI. In the real world, countless conditions keep changing — the size and material of objects, their position, friction, lighting, and nearby obstacles. A virtual environment lets you vary all of these conditions and train a robot repeatedly under each one, then bring what it learned back to a real robot to make the learning more efficient. Think of this as technology that builds a 'virtual training ground,' where a robot can practice and learn many different behaviors before it ever enters the real world.", "This is robot perception and object-grasping research from the lab of Professor Kim Ah-young in the Department of Mechanical Engineering. Professor Kim leads the RPM Robotics Lab, researching how a robot can recognize its surroundings and nearby objects, figure out its own position, and use that information to move and act on its own. Her main research areas are environmental perception, sensor fusion, and autonomous robot navigation, and more recently, her team has also been actively researching how a robot can accurately recognize and manipulate objects.\n\nThis space is about how a robot uses a camera to recognize objects, find the one it wants, and actually pick it up. A person can glance at several items on a table and instantly tell a cup from a bottle, then naturally reach out and grab the one they want. A robot first has to look at the scene through a camera and figure out what objects are where. It then has to calculate each object's orientation and pose, and determine which direction its hand should approach from to get a stable grip. Only once all of these steps connect together can the robot actually grasp the object.\n\nOne especially important focus here is transparent objects — think of a glass cup or a clear plastic container. Light passing through a camera can reflect off the surface of such an object or pass straight through it, and its appearance changes a lot depending on the background and lighting. Because of this, the cameras and depth sensors a robot normally uses often struggle to work out the exact shape and position of a transparent object. Professor Kim's team treats this as a major research topic, connecting everything from recognizing a transparent object, to estimating its position and pose, to actually manipulating it with a robot.\n\nTo support this work, the team built a large dataset called TRansPose, covering 99 kinds of transparent and regular objects, with more than 330,000 images and around four million annotations. It combines standard RGB images and depth information with thermal infrared data, so that transparent objects can be recognized more accurately. It's a good illustration of just how much recognition data and technology is needed for a robot to reliably handle something as ordinary — to us — as glass or clear plastic.\n\nHow to actually pick up the object also matters, alongside recognizing it. When several objects are placed close together, a robot needs to grasp only the one it wants, without knocking the others out of place. That means considering not just the target object's position and pose, but its spatial relationship to nearby objects, in order to plan an approach path and a grasping point. Picking the target object without disturbing anything nearby is a key part of this research.\n\nThe SNU research team
