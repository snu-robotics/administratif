 led by Professor Kim also works with Hyundai Motor Group and other partners on joint robotics research, including recognition technology for transparent objects like glass and techniques for grasping objects a robot hasn't seen registered before. For robots to work in real homes and industrial settings, they need to go beyond handling a small set of pre-registered objects — they need to recognize and manipulate unfamiliar objects even in complex surroundings. Connecting recognition, decision-making, and manipulation in this way is a key research direction.\n\nThe easiest way to think of this research is as 'building eyes for a robot.' It starts with a camera capturing an image, then finding the object within that image, understanding its 3D position and pose, and deciding how to bring the hand in based on the surroundings. Finally, the robot's actual hand or gripper moves to pick up the object. If the gripper from Professor Cho's team is the robot's hand, then this recognition technology is the eyes and spatial awareness that tell that hand where to go. It's research that shows how perception and manipulation connect — something Physical AI needs in order to act on its own in a real environment.", "This is research on a mobile, deployable 3D-printing robot, developed by Dr. Jung Soon-pil, who earned his PhD in Professor Cho Kyu-jin's lab. The core idea is a 3D printer that can fold down to a small size for transport, then expand at the job site to print large structures. Printing something like a building or a large structure normally requires a printer with a work area as big as the structure itself. Using robotics and deployable-structure technology, Dr. Jung built a system that packs down small for travel, then unfolds into a large 3D printer once it arrives on site.\n\nThe system he built folds down to about 0.9 meters in height and diameter when packed — roughly the size of a large box. Once work begins, it unfolds into a large frame about 3.6 meters tall with a base around 3.2 meters wide — several times larger than its packed size. A 3D-printing unit is mounted on this unfolded frame, letting it print structures taller than a person, right on site. Once printing is done, the frame folds back down, can be moved to a new location, and unfolds again for the next job.\n\nThe key robotics technology here is a deployable structure that can freely expand and shrink the printer's size. Dr. Jung's team developed a 'Fold-and-Roll' structure that combines folding with rolling for storage — a long robotic arm can be folded and rolled up into a small space, then extended back out when it's time to work. Once unfolded, it needs enough stiffness and stability to actually operate a 3D printer and produce a real structure. Achieving a small packed size, a large working area, and enough structural strength all within one robotic system is the core challenge this technology solves.\n\nIn 2024, this technology was built into a full-scale, large 3D-printing system and entered in the Form & Function Robotics Challenge, run by MassRobotics in Boston, USA — winning first place against teams from MIT, Harvard, Cornell, Stanford, and other universities. At the time, the system packed down to a base of about 0.8 meters and a height of about 0.75 meters, and unfolded into a triangular-pyramid shape up to 3.4 meters at the base and 3.6 meters tall. On site, using a 1.2mm nozzle and PLA plastic, it printed a 1.2-meter-tall structure made of about 2,000 printed layers as a live demonstration.\n\nThe advantage of this technology is that the 3D printer itself becomes mobile. Instead of only manufacturing a structure at a factory and then transporting it to a site, a robot can travel to the location it's needed and build the structure right there. For example, the system could be carried to a construction site or disaster area in its packed form, then unfold on site to produce needed parts or structures immediately. Combined with a mobile robot base, this could evolve into a construction robot that travels to a specific location on its own, unfolds its large frame, prints what's needed, folds back up, and moves on to the next site. The SNU research team has even proposed applying this to construction work in places people can't easily reach, such as the Moon or Mars.\n\nThis research also connects directly to the Morphic research from Professor Cho's team — it's a real example of applying shape-changing technology to an actual working system, expanding its body dramatically when needed and shrinking back down for storage or transport. In 2026, Dr. Jung, as a co-lead author, published follow-up research on deployable structures in Science Robotics. The team developed an interlacing-based structure that can fold and roll up for storage at the same time, and extended the technology into a mobile 3D-printing robot: a mobile robot about 1 meter in size travels to a site, unfolds into a frame roughly 3.2 meters wide and 3.4 meters tall, and prints a structure about 2.5 meters high.\n\nSo it's easiest to understand this research through two ideas at once: 'a large 3D printer' and 'a robot that transforms into whatever size it needs to be, wherever it's needed.' A small robot travels to a location, unfolds its body into a large working space once it arrives, and uses robotic control together with 3D-printing technology to produce a structure directly on site. Once the job is done, it folds back down small and moves on. It's research that combines shape-changing technology with manufacturing to extend robotics into construction and large-scale fabrication.", "This is robot vision research from the lab of Professor Lim Jong-woo in the Department of Mechanical Engineering. Professor Lim leads the Robot Vision Lab, researching how a robot can use a camera to understand the space around it. His main research areas include Visual SLAM (a method for figuring out a robot's position and mapping its surroundings at the same time using cameras), 3D scene reconstruction, depth estimation using multiple cameras, and scene understanding for autonomous driving. In simple terms, this is technology that takes 2D camera images and uses them to help a robot figure out where it is and understand the 3D structure of the space around it.\n\nThis space focuses on using footage of a real location to build a realistic 3D digital version of that space. If you've ever used the street-view feature in a car navigation app, that's a helpful comparison — but here, the goal goes a step further: turning a real space into a 3D digital environment that a robot can actually use. Cameras capture the real environment from many positions and angles, and the system calculates the spatial relationship between each image. From that, it reconstructs the 3D layout of walls, floors, and objects — where everything is and how the space is shaped. Turning a real space into a 3D digital space that a robot can move through and learn in is the core idea behind this exhibit.\n\nA single photograph helps explain why this technology is needed. Looking at a photo, a person can roughly understand a room, or recognize a desk or a chair. For a robot to actually move through that same space, it needs far more information: how far away the walls are, exactly where the desk sits in the room, which areas it can move through, and where it currently is. That means calculating depth and position from multiple camera images, and connecting all of that into a single 3D space.\n\nProfessor Lim's team has worked on this problem for a long time. One notable result is OmniSLAM, a technology that uses several wide-angle cameras to observe a full 360 degrees around the robot, estimating the camera's position while simultaneously building a depth map of the surroundings. Combining information from multiple wide-view cameras lets you observe far more of the surrounding space than using footage from just one direction. The team has also researched estimating depth from all-around camera footage — technology that mobile robots and self-driving cars can use to determine their own position and understand the space around them.\n\nTaking this a step further makes it possible to recreate a real space as a digital environment. A real robot can be placed directly into this digital space, or a virtual robot can be placed there first to test out different tasks — changing its movement path, checking what its sensors would see from different positions, and training it on how to behave in specific situations. If Professor Lee Dong-jun's virtual simulation is a robot's 'training ground,' then this can be understood as the technology that builds the actual 3D map of a real space to use in that training ground.\n\nThis matters a great deal for Physical AI. For a robot to act in the real world, it needs to understand the space it exists in. A person walking into a room naturally looks around and figures out which way they can walk and where the obstacles are. A robot has to calculate that same spatial information from the data coming in through its cameras and sensors. Visual SLAM is a key technology for a robot to build a map of its surroundings while figuring out its own position as it moves, and 3D reconstruction turns that space into more precise digital information. Professor Lim's team applies this kind of geometric and semantic vision to mobile robots, vehicles, and augmented and virtual reality.\n\nSo rather than focusing only on how realistic the space looks on screen, it's better to think of this research as being about how to build a digital space that a robot can actually use. The system observes a real space with cameras, calculates the relationships between multiple images, and estimates depth and structure to build a 3D environment. Placing a robot inside this environment lets you test its movement, perception, and learning under a variety of positions and conditions before it ever goes into the real environment. In short, this is technology for connecting a real-world space to a digital environment that a robot can understand and learn from.", "This is medical robotics research from the lab of Professor Han Kyung-won in the Department of Mechanical Engineering. Professor Han leads the Healthcare Robotics Lab (HeRo Lab), applying robotics and mechanical engineering to healthcare. Main research areas include surgical robots, medical devices, implantable devices for inside the body, haptic feedback, artificial muscles, and flexible sensors and actuators. Professor Han has served as an associate professor in the department since 2026, and the lab develops actuators, sensors, systems, and mechanisms that can be used in surgery, treatment, and rehabilitation.\n\nWhat's on display here relates to medical-robotics research focused on the heart and blood flow. To check whether a sensor or actuator developed for use in a real, beating heart with real blood flow actually works as intended, you need an environment that can recreate conditions similar to a real cardiovascular system for testing. That's the purpose of the test rig you see here, which simulates the heart's movement and blood flow. Think of it less as a model built to study the heart itself, and more as a testing setup used to verify that a developed device actually works correctly.\n\nOne area Professor Han's team focuses on is soft medical robots that can directly assist the heart and blood vessels. A device that goes inside the human body has to meet very different conditions from a typical industrial robot — the heart and blood vessels are constantly moving, and the surrounding tissue is soft. That means flexible materials that can move along with human tissue, small and lightweight actuators, and sensors that can measure movement and force are all essential. With this in mind, the team develops soft actuators, stretchable sensors, and implantable devices.\n\nA representative project is e-VaC, a cardiovascular assist device that wraps around a blood vessel. A soft actuator surrounds the outside of the vessel and applies pressure in time with the heartbeat, adjusting the timing of that pressure to influence blood flow and support heart function. The device also includes sensing and control technology so it can respond to the actual state of the heart and blood vessels. The SNU team continues to develop this kind of soft-actuator-based cardiovascular assistance, and has recently expanded into E-CAD, a low-power cardiac assist device based on electroactive polymers, and implantable devices using shape-memory alloy.\n\nDeveloping this kind of device requires thorough testing in conditions similar to a real heart, and that's exactly the role the heart-simulation rig next to it plays. It recreates the beating of a heart and the pushing of blood, and connects to the sensors and actuators being developed so researchers can check exactly when and how the device responds. It lets them measure changes in blood flow and pressure, and repeatedly test how changing the timing or force of the actuator affects the cardiovascular system — a research platform for developing and validating technology under many conditions before it's ever used on an actual patient.\n\nProfessor Han's team also researches haptic technology, which transmits or recreates the force and touch a person feels with their hands through a mechanical device. In medical robotics, this can be used to relay the sensation a doctor would feel when touching tissue while operating a robot remotely, or to give medical staff a realistic sense of touch while practicing a procedure. The lab treats haptic feedback for remote robotic procedures and medical training simulators as major research areas.\n\nSo it's helpful to connect this space to how Physical AI can extend into healthcare. A sensor measures the state of the heart and blood vessels, a device makes decisions based on that data, and a soft actuator delivers physical force directly to the human body — sensing, decision-making, and actuation, connected directly to a person's body. As Physical AI develops further in healthcare, it could support doctors during surgery and procedures, and eventually assist patients' bodily functions directly, in many different forms.\n\nThe robots we've covered so far have mainly been about grasping objects, learning from human demonstration, perceiving space, and training in virtual environments. This final space shows how those same robotics technologies can develop when applied to the human body and a medical setting — interacting with human tissue using soft materials, measuring the body's condition with sensors, and generating the physical force needed for treatment and functional support. It's a good example of how robotics can extend from industry and everyday spaces all the way into the human body.", "That covers a selection of the research currently underway at the SNU Robotics Institute. From flexible robot structures and sensors, to learning technology where a robot is taught by a person, wearable robots worn directly on the body, biomimetic and shape-changing robots, robot hands and grippers that manipulate objects directly, simulation that trains robots in virtual environments, robot vision that can recognize and grasp even transparent objects, large 3D-printing robots that deploy on site, technology that turns real spaces into digital environments, and medical robots applied to the heart and blood vessels — a wide range of research is underway.\n\nEach of these research areas is quite different on its own, but they connect naturally under the idea of Physical AI. For a robot to act in the real world, it first needs to perceive its surroundings and the people in them. It also needs the ability to decide what to do and learn from its actions. It needs a body and actuation technology that can turn what it has learned into real movement, along with hands and sensors to grasp objects and control force. And to be worn on the body or used in healthcare, it needs flexible materials and technology for safe interaction. The research covered today each represents a different piece of this larger Physical AI picture.\n\nThis is also where the strength of the SNU Robotics Institute lies. About 80 professors currently take part in the Institute directly or indirectly, and 41 of them are directly involved in the NRL 2.0 program. Researchers across mechanical engineering, AI, electrical and computer engineering, materials science, medicine, and biology are each advancing their own area of expertise while connecting their work with one another. Rather than trying to develop every technology inside a single lab, the Institute has built a large-scale, cross-disciplinary research system where highly specialized teams in each field can work together.\n\nThrough this national research program, the Institute will keep pursuing this research for up to ten years. With about 10 billion won in government research funding each year, the goal is both to secure core foundational technology and to turn research results into technology that can be used in real industry and society. The Institute is also expanding joint research and industry partnerships, technology transfer and commercialization, and its role in helping promising Physical AI technologies and researchers grow into startups. An important part of the Institute's role is building a robotics innovation ecosystem, where technology that starts in research leads to companies and industry, which in turn create new businesses and jobs.\n\nThe Institute's research space is also expanding along with this growth. Land has already been secured behind this building for a new Robotics Institute building, permits have been completed, and the move to this new research space is planned for about two years from now. In that new space, the plan is to connect research and experimentation even more closely with industry partnerships, technology commercialization, and finding and supporting startups — building a robotics hub at Seoul National University where researchers, students, companies, and startups can come together to research Physical AI technology and turn it into real industry.\n\nThe research covered today will also keep evolving. Much of what's on display in this space reflects work that professors, students, and researchers are actively carrying out right now. As new results come in, the exhibits will be updated, and the technology you've seen today will move on to its next stage of research. The SNU Robotics Institute aims to connect all of this research toward a human-centered Physical AI that can be used in the real spaces where people live and work — building a robotics ecosystem where research, industry, and startups can grow together.\n\nThat brings us to the end of the SNU Robotics Institute tour. If you have any questions about the research you've seen today, or about the Institute itself, please feel free to ask. Thank you for joining us."]}, "medium": {"ko": ["안녕하세요. 오늘 서울대학교 로보틱스연구소 투어를 안내해 드릴 ○○○입니다. 저는 현재 로보틱스연구소에서 ○○○ 업무를 담당하고 있고요. 먼저 연구소에 대해 간단히 소개해 드린 다음, 공간을 이동하면서 현재 진행하고 있는 주요 연구를 순서대로 설명해 드리겠습니다.\n\n서울대학교 로보틱스연구소는 로보틱스를 중심으로 서울대학교의 다양한 연구역량을 연결하는 융합연구 거점입니다. 현재 기계공학, 전기정보공학, 컴퓨터공학, 재료공학을 비롯해 의학, 보건학, 뇌인지과학 등 다양한 분야의 교수 80여 명이 직·간접적으로 참여하고 있습니다. 로봇의 구조와 소재부터 센서, 비전, 제어, 인공지능과 학습, 인간-로봇 상호작용, 의료와 바이오 응용까지 다양한 분야의 연구자들이 함께 참여하고 있다는 점이 연구소의 중요한 특징입니다.\n\n이러한 연구역량을 기반으로 2026년 과학기술정보통신부와 교육부가 추진하는 국가연구소, NRL 2.0 사업에 선정되었습니다. 연구소 참여 교수 가운데 41명이 NRL 과제에 직접 참여하고 있으며, 연간 약 100억 원 규모의 국가 연구지원을 기반으로 최대 10년간 연구를 수행합니다. 2026년 8월 18일에는 로보틱스 국가연구소 개소식을 갖고 본격적인 연구를 시작했습니다.\n\n연구소가 지향하는 핵심 방향은 '인간 중심의 Physical AI'입니다. 인공지능이 로봇의 몸을 통해 실제 환경을 인식하고 판단하며, 직접 움직이고 사람과 상호작용할 수 있도록 하는 기술입니다. 이를 위해 로봇의 구조와 소재, 구동장치, 센서와 촉각, 비전, 제어, 인공지능과 학습 등 다양한 기술을 함께 연구하고 있습니다.\n\n향후 10년 동안 연구성과를 축적하면서 연구소의 장기적인 자립 기반도 함께 구축할 계획입니다. 기업과의 공동연구와 기술이전, 기술사업화를 확대하고 Physical AI 분야의 유망 기술과 연구자를 발굴해 스타트업 창업과 보육으로 연결하고자 합니다. 현재 건물 뒤쪽에는 새로운 로보틱스연구소 건물을 위한 부지를 확보하고 인허가를 완료했으며, 약 2년 후 독립된 연구공간으로 이전할 계획입니다. 새로운 공간에는 연구와 실험, 산학협력, 기술사업화와 창업보육 기능을 함께 구축할 예정입니다.\n\n현재 이 공간에는 여러 연구팀에서 진행하고 있는 연구 가운데 일부가 전시되어 있습니다. 소프트 로봇과 센서, 로봇 핸드와 그리퍼, 웨어러블 로봇부터 원격조작과 학습, 로봇 비전, 시뮬레이션, 디지털 공간, 의료로봇까지 다양한 연구를 이 공간에서 만나보실 수 있습니다.", "이곳은 서울대학교 기계공학부 안성훈 교수님 연구팀의 로봇입니다. 안성훈 교수님 연구팀은 재료, 설계, 제조기술을 연결해 새로운 기능을 가진 로봇과 구조물을 연구하고 있습니다. 형상기억합금과 같은 스마트 재료, 복합재료, 소프트 로봇, 센서와 구동기, 적층제조 등이 주요 연구분야입니다. 최근에는 연속된 탄소섬유를 이용한 초경량·고강도 3차원 구조를 개발해 로봇 팔과 드론 구조체에도 적용했습니다.\n\n이곳에는 그중 코끼리 코와 같은 형태를 가진 유연한 분절형 로봇이 전시되어 있습니다. 여러 개의 마디가 연속적으로 움직이면서 전체적인 형상을 바꾸고, 물체의 형태에 맞춰 주변을 감싸는 방식으로 물체를 잡습니다. 여러 관절과 구조의 변형을 함께 활용해 다양한 형태의 대상과 상호작용할 수 있는 것이 특징입니다.\n\n안성훈 교수님 연구팀은 형상기억합금을 섬유와 결합해 굽힘과 비틀림, 3차원 형상변화를 구현하는 직물형 구동기 등 재료와 구조 자체에 기능을 부여하는 연구도 지속해 왔습니다. 이곳에는 이러한 연구 가운데 유연한 구조를 활용해 로봇이 움직이고 물체와 상호작용하는 사례가 전시되어 있습니다.", "이곳은 서울대학교 기계공학부 박종우 교수님 연구팀의 로봇 학습 연구입니다. 박종우 교수님 연구팀은 로봇의 움직임과 제어, 물체 조작, 모바일 매니퓰레이션을 연구하고 있으며, 최근에는 인공지능과 데이터 기반 학습기술을 적극적으로 결합하고 있습니다.\n\n이곳에서는 사람이 로봇을 원격으로 조작하면서 작업을 가르치는 과정을 보여드립니다. 사람이 직접 로봇을 움직여 물체를 잡고 옮기는 작업을 수행하면 로봇은 팔의 움직임과 물체를 잡는 위치, 작업의 순서 등을 데이터로 얻습니다. 이렇게 사람이 좋은 행동의 예를 제공하고, 로봇이 이를 학습해 새로운 작업을 수행하도록 만드는 방식입니다.\n\nPhysical AI에서는 실제 행동 데이터를 확보하는 과정이 중요합니다. 로봇이 물체를 잡고 움직이는 데이터는 실제 물리적인 상호작용을 통해 만들어집니다. 이곳은 사람이 로봇에게 행동을 가르치고, 그 과정에서 로봇 학습에 필요한 데이터를 만드는 연구를 다루는 공간입니다.", "이곳은 서울대학교 기계공학부 박용래 교수님 연구팀의 센서 기술입니다. 박용래 교수님 연구팀은 부드럽고 유연한 소재를 이용한 소프트 로봇과 센서, 구동기를 연구하고 있습니다. 이곳에는 로봇 손끝에서 힘을 측정하는 3축 포스센서와 사람의 손동작을 측정하는 액체금속 기반 장갑이 함께 전시되어 있습니다.\n\n3축 포스센서는 로봇이 물체와 접촉할 때 발생하는 힘을 여러 방향으로 측정합니다. 사람도 손끝의 촉각을 이용해 물체를 얼마나 강하게 잡을지 자연스럽게 조절합니다. 로봇도 센서를 통해 접촉하는 힘을 측정하면 깨지기 쉬운 물체를 보다 섬세하게 다룰 수 있습니다.\n\n액체금속 장갑은 사람이 손가락을 움직이면 유연한 센서가 손가락의 관절과 움직임을 측정합니다. 액체금속은 장갑이 휘고 늘어나는 움직임을 따라가면서 센서 기능을 유지할 수 있습니다. 이를 통해 사람의 손동작을 로봇이 활용할 수 있는 데이터로 바꿀 수 있습니다. 결국 이곳은 로봇이 물체와 접촉하는 힘을 느끼는 기술과 사람의 움직임을 읽는 기술을 함께 다루는 공간입니다.", "이곳은 기계공학부 조규진 교수님 연구팀의 웨어러블 로봇 연구입니다. 조규진 교수님 연구팀은 소프트 로봇, 웨어러블 로봇, 생체모사 로봇, 오리가미 기반 형태변형 메커니즘 등을 연구하고 있습니다.\n\n이곳에는 사람이 몸에 직접 착용해 움직임과 신체 기능을 보조하는 웨어러블 로봇이 전시되어 있습니다. 대표적인 연구인 Exo-Glove는 유연한 소재와 텐던을 이용해 손가락의 움직임을 보조합니다. 최근에는 카메라와 인공지능으로 사용자가 잡으려는 물체를 파악하거나, 사용자가 웨어러블 로봇을 보다 편하게 착용할 수 있도록 자동 착용구조를 개발하는 연구까지 이어지고 있습니다.\n\n웨어러블 로봇에서는 사람의 움직임과 의도를 파악하고 필요한 순간에 적절한 힘을 제공하는 것이 중요합니다. 센서가 사람의 상태를 읽고 로봇이 판단한 뒤 구동기가 실제 힘을 만들어 사람을 지원합니다. 인간 중심 Physical AI가 사람의 신체와 직접 연결되는 대표적인 연구라고 볼 수 있습니다.", "이곳은 여러 연구팀이 함께 활용하는 공용 연구공간입니다. 카메라와 여러 계측장비를 이용해 사람이나 로봇의 움직임을 촬영하고 연구에 필요한 데이터를 획득합니다.\n\n사람에게는 자연스러운 물체 파지 동작도 로봇에게 가르치려면 손이 어디에서 출발했고 어떤 경로로 움직였으며, 손목과 손가락이 어떻게 움직였는지를 데이터로 만들어야 합니다. 로봇의 움직임이 계획한 경로를 정확하게 따라갔는지 검증하는 데에도 이러한 계측 데이터가 활용됩니다.\n\nPhysical AI에서는 사람과 로봇의 움직임, 물체와의 접촉, 주변 공간의 변화와 같은 물리적인 데이터가 중요합니다. 이 공간은 여러 연구팀이 이러한 데이터를 획득하고 실험 결과를 검증할 수 있도록 지원하는 공용 연구 인프라입니다.", "이곳은 조규진 교수님 연구팀의 Morphic 관련 연구입니다. 이 연구팀에서는 자연에 있는 생물의 움직임과 구조를 로봇에 적용하는 생체모사와 종이접기의 원리를 활용하는 오리가미 로봇을 활발하게 연구하고 있습니다.\n\n대표적으로 소금쟁이가 물의 표면장력을 이용해 뛰어오르는 원리를 구현한 소금쟁이 로봇, 무당벌레가 날개를 접고 펼치는 원리를 적용한 비행로봇 등을 개발했습니다. 종이접기 원리를 이용해 1톤급 차량의 하중을 견디면서 형태를 변화시킬 수 있는 가변형 바퀴도 개발했습니다.\n\n이곳의 Morphic 연구도 이러한 형태변형 기술과 연결됩니다. 로봇의 몸이나 부품이 작업과 환경에 맞춰 형태를 바꾸고, 작은 상태로 이동하거나 보관한 뒤 필요한 순간에 크게 펼쳐 기능을 수행합니다. 로봇의 재료와 구조 자체가 환경에 적응하는 능력을 갖도록 만드는 체화지능의 한 형태라고 이해하시면 됩니다.", "이곳도 조규진 교수님 연구팀의 로봇 핸드와 그리퍼 연구입니다. 이곳에는 사람의 손처럼 많은 관절을 움직이기 위한 텐던 구동 방식의 로봇 손이 전시되어 있습니다. 텐던은 사람의 힘줄처럼 모터에서 만들어진 힘을 와이어를 통해 손가락까지 전달합니다.\n\n사람의 손에는 많은 관절이 있기 때문에 로봇 손에서도 여러 움직임을 작은 공간에 구현해야 합니다. 텐던을 이용하면 구동기를 손가락에서 떨어진 위치에 배치하면서도 필요한 힘을 전달할 수 있어 로봇 손을 작고 가볍게 구성하는 데 도움이 됩니다.\n\n연구팀은 다양한 그리퍼도 개발하고 있습니다. 대표적으로 MOGrip은 사람이 여러 물체를 손 안에 모아 한 번에 운반하는 행동에서 착안해 여러 물체를 차례로 잡아 저장한 뒤 한꺼번에 이동할 수 있도록 개발한 그리퍼입니다. 현재 이 공간에서는 텐던 방식과 다른 구동방식을 결합하는 하이브리드 로봇 손 연구도 진행하고 있습니다. 옆의 오리가미 구조물과 함께 생체모사와 형태변형 기술이 로봇의 손과 실제 구조물로 확장되는 모습도 함께 소개해 드립니다.", "이곳은 서울대학교 기계공학부 이동준 교수님 연구팀의 로봇 시뮬레이션과 학습 관련 연구입니다. 이동준 교수님 연구팀은 로봇의 역학과 제어, 로봇 조작, 시뮬레이션, 원격로봇과 햅틱·가상현실 등을 연구하고 있습니다.\n\n이곳에서는 가상환경에 로봇과 물체를 만들어 놓고 로봇이 물체를 밀거나 집고 옮기는 작업을 반복적으로 학습하는 모습을 보여드립니다. 강화학습을 이용하면 로봇이 여러 행동을 시도하고 그 결과를 바탕으로 좋은 행동을 점차 찾아갈 수 있습니다.\n\n이를 위해서는 가상환경에서도 로봇과 물체의 접촉, 충돌, 마찰과 움직임을 실제와 가깝게 계산하는 물리 시뮬레이션 기술이 중요합니다. 박종우 교수님 연구팀의 원격조작 방식이 사람이 좋은 행동 데이터를 직접 만들어주는 방법이라면, 이곳에서는 로봇이 가상의 물리환경에서 대량의 경험을 만들며 학습하는 방법을 다룹니다. 로봇이 실제 세상으로 나오기 전에 다양한 행동을 연습하는 '가상의 훈련장'이라고 생각하시면 이해하기 쉽습니다.", "이곳은 서울대학교 기계공학부 김아영 교수님 연구팀의 로봇 인식과 물체 파지 연구입니다. 김아영 교수님 연구팀은 로봇이 주변 공간과 물체를 인식하고 자신의 위치를 파악해 자율적으로 움직이고 작업할 수 있도록 하는 로봇 비전과 센서 융합기술을 연구하고 있습니다.\n\n이곳에서는 카메라를 이용해 물체를 인식하고 원하는 물체를 실제로 집는 과정을 보여드립니다. 연구팀이 집중하는 대상 가운데 하나가 유리컵이나 투명 플라스틱과 같은 투명물체입니다. 빛이 물체를 통과하고 반사되기 때문에 일반적인 카메라와 깊이센서로 정확한 형태와 위치를 파악하기가 어렵습니다. 연구팀은 투명물체의 인식부터 위치와 자세 추정, 실제 로봇 조작까지 연결해 연구하고 있습니다.\n\n여러 물체가 함께 놓여 있을 때 원하는 물체만 주변과 충돌하지 않도록 집는 기술도 중요합니다. 로봇은 물체의 위치뿐만 아니라 주변 물체와의 공간적인 관계까지 파악하고 접근경로와 파지 위치를 결정해야 합니다. 조규진 교수님 연구팀의 그리퍼가 로봇의 손이라면 이곳의 비전기술은 그 손을 어디로 움직여야 하는지 알려주는 로봇의 눈과 공간지각 능력이라고 생각하시면 됩니다.", "이곳은 조규진 교수님 연구실에서 박사학위를 받은 정순필 박사의 이동식 전개형 3D 프린팅 로봇입니다. 이 연구의 핵심은 대형 구조물을 만들 수 있는 3D 프린터를 작은 크기로 접어서 이동하고, 필요한 현장에서 다시 크게 펼쳐 사용하는 것입니다.\n\n개발된 시스템은 수납할 때 약 0.9m 크기로 줄어들고, 작업을 시작하면 높이 약 3.6m, 밑변 약 3.2m의 대형 프레임으로 전개됩니다. 접는 방식과 말아서 수납하는 방식을 결합한 Fold-and-Roll 구조를 이용해 작은 이동 크기와 넓은 작업영역을 함께 확보했습니다. 전개된 상태에서는 실제 3D 프린팅 작업을 수행할 수 있는 강성과 안정성을 갖습니다.\n\n2024년에는 이 기술로 미국 MassRobotics의 Form & Function Robotics Challenge에서 1위를 차지했습니다. 이후 연구는 모바일 로봇과 결합해 약 1m 크기의 로봇이 현장으로 이동한 뒤 3m 이상의 대형 프레임으로 전개되고, 높이 약 2.5m의 구조물을 출력하는 수준까지 발전했습니다.\n\n건설현장이나 재난현장에서 필요한 구조물을 바로 제작하고, 장기적으로는 달이나 화성과 같이 사람이 접근하기 어려운 환경에서 현지 구조물을 만드는 기술로도 확장할 수 있습니다. 조규진 교수님 연구팀의 Morphic 형태변형 원리가 실제 대형 제조와 건설 시스템으로 구현된 사례라고 생각하시면 이해하기 쉽습니다.", "이곳은 서울대학교 기계공학부 임종우 교수님 연구팀의 로봇 비전 연구입니다. 임종우 교수님 연구팀은 Visual SLAM, 3차원 공간 재구성, 깊이 추정 등 카메라를 이용해 로봇이 주변 공간을 이해하는 기술을 연구하고 있습니다.\n\n이곳에서는 실제 공간을 촬영한 데이터를 이용해 실사에 가까운 3차원 디지털 공간을 만드는 연구를 보여드립니다. 여러 위치와 방향에서 얻은 영상을 연결하고 공간의 깊이와 구조를 계산해 벽과 바닥, 물체가 어디에 있는지를 3차원으로 재구성합니다.\n\n이렇게 만들어진 디지털 공간에는 가상의 로봇을 넣어 이동과 인식, 학습을 시험할 수 있습니다. 이동준 교수님 연구팀의 가상환경이 로봇의 '훈련장'이라면, 이곳에서는 실제 공간을 기반으로 그 훈련장에 활용할 수 있는 3차원 환경을 만드는 기술이라고 생각하시면 됩니다. 실제 공간을 로봇이 이해하고 활용할 수 있는 디지털 정보로 변환하는 연구입니다.", "이곳은 서울대학교 기계공학부 한경원 교수님 연구팀의 의료로봇 연구입니다. 한경원 교수님 연구팀은 수술과 치료, 재활에 활용할 수 있는 소프트 액추에이터와 센서, 이식형 장치, 햅틱 기술 등을 연구하고 있습니다.\n\n이곳에는 심장과 혈류를 대상으로 하는 의료로봇 연구와 이를 검증하기 위한 심장 모사 실험장치가 전시되어 있습니다. 대표적인 연구인 e-VaC는 혈관 바깥쪽을 부드러운 액추에이터가 감싸고 심장박동에 맞춰 압력을 가해 혈류와 심장 기능을 보조하는 장치입니다. 이러한 의료장치에는 사람의 조직과 함께 움직일 수 있는 유연한 소재와 센서, 정밀한 제어기술이 필요합니다.\n\n옆의 심장 모사 장치는 심장이 박동하고 혈액이 흐르는 조건을 만들어 개발한 센서와 액추에이터의 작동을 반복적으로 시험할 수 있도록 합니다. 연구팀에서는 사람이 느끼는 힘과 촉각을 전달하는 햅틱 기술도 함께 연구하고 있습니다. 이곳은 센싱과 판단, 구동이라는 Physical AI의 기술이 사람의 신체와 의료 분야까지 연결되는 모습을 보여줍니다.", "지금까지 서울대학교 로보틱스연구소에서 진행하고 있는 연구 가운데 일부를 설명해 드렸습니다. 유연한 로봇 구조와 센서, 웨어러블 로봇, 로봇 핸드와 그리퍼부터 사람에게 행동을 배우는 로봇, 가상환경에서 학습하는 로봇, 주변 공간과 물체를 인식하는 로봇, 형태를 바꿔 현장에서 구조물을 제작하는 로봇, 의료에 활용되는 소프트 로봇까지 다양한 연구가 하나의 공간에 모여 있습니다.\n\n이러한 연구들은 인간 중심의 Physical AI라는 방향으로 연결됩니다. 로봇이 실제 세상에서 활동하려면 주변을 인식하고, 행동을 학습하고, 실제 몸을 움직이며, 물체와 사람에게 안전하게 힘을 전달할 수 있어야 합니다. 서울대학교 로보틱스연구소는 80여 명의 교수님이 가진 다양한 전문성을 연결해 이러한 기술을 함께 연구하고 있습니다.\n\nNRL 2.0 사업을 통해 앞으로 최대 10년간 연구를 지속하면서 산학협력과 기술사업화, 스타트업 발굴과 육성도 함께 확대할 계획입니다. 약 2년 후에는 새롭게 건립되는 독립 연구공간으로 이전해 연구와 산업, 창업이 함께 연결되는 Physical AI 연구거점으로 발전시켜 나갈 예정입니다.\n\n이상으로 서울대학교 로보틱스연구소 투어를 마치겠습니다. 오늘 보신 연구나 저희 연구소에 대해 궁금하신 점이 있으시면 편하게 질문해 주시면 설명드리겠습니다. 함께해 주셔서 감사합니다."], "en": ["Hello, I'm ___, and I'll be guiding today's tour of the Robotics Institute at Seoul National University. I currently work here at the Institute in the ___ team. I'll start with a short introduction to the Institute, and then walk you through the main research projects going on in this space.\n\nThe SNU Robotics Institute is a hub that connects robotics research from across many different fields at Seoul National University. About 80 professors take part, directly or indirectly, from areas like mechanical engineering, electrical and computer engineering, computer science, and materials science, as well as medicine, public health, and brain and cognitive science. One important feature of the Institute is that researchers from very different backgrounds — covering everything from a robot's structure and materials to sensors, vision, control, AI and learning, human-robot interaction, and medical and biological applications — actively work together under the single field of robotics.\n\nBased on this research strength, the Institute was selected in 2026 for a national research program called NRL 2.0, run by Korea's Ministry of Science and ICT and Ministry of Education. Of the professors connected to the Institute, 41 are directly involved in this program, which comes with about 10 billion won in government funding per year, for research that can continue for up to ten years. On August 18, 2026, we held the official opening ceremony for the national robotics institute and began this work in earnest.\n\nThe main direction the Institute is working toward is what we call 'human-centered Physical AI' — building AI that can sense and understand its surroundings through a robot's body, and then move and interact with people accordingly. To do this, we bring together many different technologies: a robot's structure and materials, its actuators, sensors and touch, computer vision, control systems, and AI and learning.\n\nOver the next ten years, we plan to build up research results while also creating a foundation for the Institute to keep growing on its own in the long run. We're expanding joint research, technology transfer, and commercialization with companies, and working to help promising Physical AI technologies and researchers grow into startups. We've already secured land behind this building and completed the permits for a new, independent Robotics Institute building, and plan to move there in about two years. That new space will bring research, industry partnerships, technology commercialization, and startup support together in one place.\n\nWhat you see in this space right now is a selection of research from several different teams — from soft robots and sensors, robot hands and grippers, and wearable robots, to remote-controlled learning, robot vision, simulation, digital spaces, and medical robots. You'll find all of this research here in this space.", "This is a robot from the lab of Professor Ahn Seung-hoon in the Department of Mechanical Engineering. His team researches robots and structures with new capabilities by connecting materials, design, and manufacturing. Main research areas include smart materials like shape-memory alloys (metals that return to a set shape when heated), composite materials, soft robots, sensors and actuators, and 3D printing. Recently, they developed an ultra-lightweight, high-strength 3D structure using continuous carbon fiber, and applied it to robot arms and drone frames.\n\nWhat's on display here is a flexible, segmented robot shaped like an elephant's trunk. Many small sections move together to change the robot's overall shape, letting it wrap around an object to grip it, adapting to whatever shape that object happens to be. It's built to use many joints and shape changes together, so it can interact with a wide range of different objects.\n\nProfessor Ahn's team has also continued researching how to build function directly into materials and structures — for example, a soft actuator that combines shape-memory alloy with fabric to create bending and twisting motion, and full 3D shape changes. What's on display here is one example of how a flexible structure lets a robot move and interact with objects.", "This is robot-learning research from the lab of Professor Park Jong-woo in the Department of Mechanical Engineering. His team researches robot motion and control, object manipulation, and mobile manipulation, and has recently been actively combining this with AI and data-driven learning.\n\nHere, we show how a person teaches a robot a task by controlling it remotely. When a person directly moves the robot to pick up and move an object, the robot records data such as how the arm moved, where it grasped the object, and the order of the steps. A person provides good examples of the behavior this way, and the robot learns from them to carry out new tasks on its own.\n\nCollecting this kind of real-world action data matters a great deal for Physical AI, since the data comes from actual physical interaction as the robot grasps and moves objects. This is a space where a person teaches the robot a behavior, generating the data the robot needs in order to learn.", "This is sensor technology from the lab of Professor Park Yong-rae in the Department of Mechanical Engineering. His team works on soft robots, sensors, and actuators built from soft, flexible materials. On display here are a 3-axis force sensor that measures force at a robot's fingertip, and a glove based on liquid metal that measures how a person's fingers move.\n\nThe 3-axis force sensor measures the force a robot feels from several directions when it touches an object. People naturally use the sense of touch in their fingertips to control how hard they grip something, and a robot that can measure this same contact force through a sensor can handle fragile objects more delicately.\n\nThe liquid-metal glove works the other way: when a person moves their fingers, a flexible sensor tracks the movement of the finger joints. The liquid metal keeps working as a sensor even as the glove bends and stretches. This turns a person's hand movement into data a robot can use. In short, this space brings together technology that lets a robot feel the force of contact with an object, and technology that reads human hand movement.", "This is wearable-robot research from the lab of Professor Cho Kyu-jin, who directs the Robotics Institute, in the Department of Mechanical Engineering. His team researches soft robots, wearable robots, biomimetic robots, and shape-changing mechanisms based on origami.\n\nOn display here are wearable robots that a person wears directly on the body to assist movement and physical function. A well-known example is Exo-Glove, which uses flexible material and tendons to assist finger movement. More recent work adds a camera and AI to figure out which object the user is trying to grasp, and includes a self-fastening structure that makes it easier for the user to put the robot on.\n\nFor a wearable robot, it's important to sense the user's movement and intent and provide the right amount of force at the right moment. A sensor reads the user's state, the robot makes a decision, and an actuator generates the actual force to support the person — a clear example of human-centered Physical AI connecting directly to the human body.", "This is a shared research space used by several different teams. Cameras and various measurement equipment record the movement of people and robots and collect the data needed for research.\n\nEven a movement as natural to a person as grasping an object needs to be turned into data to teach a robot — where the hand started, what path it followed, and how the wrist and fingers moved. This kind of measurement data is also used to verify whether a robot's movement accurately followed its intended path.\n\nFor Physical AI, this kind of physical data — the movement of people and robots, contact with objects, and changes in the surrounding space — matters a great deal. This space is shared research infrastructure that supports multiple teams in gathering this data and verifying their experimental results.", "This is 'Morphic' research from the lab of Professor Cho Kyu-jin. His team actively researches biomimetic robots, which apply the movement and structure of living things in nature to robots, and origami robots, based on the principle of folding paper.\n\nNotable examples include a water strider robot that mimics how the insect uses the surface tension of water to jump, a flying robot based on how a ladybug folds and unfolds its wings, and a shape-changing wheel, using origami principles, that can support the weight of a one-ton vehicle while changing form.\n\nThe Morphic research here connects to this same idea of shape-changing technology. A robot's body or parts change shape to match the task and environment — moving or storing themselves in a small form, then unfolding to a larger size when it's time to perform a function. Think of this as a form of embodied intelligence, where the robot's own materials and structure are built to adapt to the environment.", "This is also robot hand and gripper research from Professor Cho Kyu-jin's team. On display here is a robot hand driven by tendons, letting it move many joints much like a human hand. Tendons, like the tendons in a human hand, carry force generated by a motor through a wire to the fingers.\n\nBecause a human hand has so many joints, a robot hand needs to fit many different movements into a small space. Using tendons lets you place the actuator away from the fingers while still delivering the force needed, helping keep the robot hand small and light.\n\nThe team also develops a variety of grippers — from stable grips suited to objects of different sizes and shapes, to grippers that can grasp several objects in a row and carry them all at once. One example is MOGrip, inspired by how a person gathers several objects in one hand before carrying them together. The team is currently researching a new type of robot hand that combines the strengths of tendon-driven movement with other actuation methods. The origami structure next to this exhibit is also part of introducing how biomimetic and shape-changing technology extends into robot hands and real-world structures.", "This is robot simulation and learning research from the lab of Professor Lee Dong-jun in the Department of Mechanical Engineering. His team researches robot dynamics and control, robot manipulation, simulation, teleoperated robots, and haptics and virtual reality.\n\nHere, we show a robot being trained repeatedly inside a virtual environment, practicing pushing, picking up, and moving objects. Using reinforcement learning, a robot can try out many different actions and gradually discover which ones work well based on the results.\n\nThis requires physics simulation that closely calculates how a robot and an object make contact, collide, experience friction, and move, even inside a virtual environment. If Professor Park Jong-woo's remote-control method is a way for a person to directly create good action data, this space is about a robot generating large amounts of experience on its own inside a virtual physical environment. Think of it as a 'virtual training ground,' where a robot practices many different behaviors before it ever enters the real world.", "This is robot perception and object-grasping research from the lab of Professor Kim Ah-young in the Department of Mechanical Engineering. Her team researches robot vision and sensor fusion technology that lets a robot recognize its surroundings and objects, determine its own position, and move and act on its own.\n\nHere, we show a robot using a camera to recognize objects and pick up the one it wants. One focus of the team's research is transparent objects, such as a glass cup or clear plastic. Because light passes through and reflects off such objects, it's hard for a normal camera and depth sensor to work out their exact shape and position. The team connects everything from recognizing a transparent object, to estimating its position and pose, to actual robotic manipulation.\n\nIt's also important to grasp only the intended object without disturbing anything nearby, when several objects are placed close together. A robot needs to consider not just the object's position and pose, but also its spatial relationship to nearby objects, to plan its approach and grasping point. If the gripper from Professor Cho Kyu-jin's team is the robot's hand, this vision technology is the eyes and spatial awareness that tell that hand where to go.", "This is a mobile, deployable 3D-printing robot developed by Dr. Jung Soon-pil, who earned his PhD in Professor Cho Kyu-jin's lab. The core idea is a 3D printer that folds down for easy transport, and expands into a large frame once it arrives at the job site.\n\nThe system folds down to about 0.9 meters when packed, and unfolds into a large frame about 3.6 meters tall with a base around 3.2 meters wide once work begins. A 'Fold-and-Roll' structure, combining folding with rolling, achieves both a small travel size and a large working area. Once unfolded, the structure is stiff and stable enough to actually operate a 3D printer.\n\nIn 2024, this technology won first place at the Form & Function Robotics Challenge, run by MassRobotics in the United States. Later research combined it with a mobile robot base, so that a robot about 1 meter in size can travel to a site, unfold into a frame over 3 meters wide, and print a structure about 2.5 meters tall.\n\nThis technology could be used to build structures directly at construction sites or disaster areas, and could eventually extend to building structures in places people can't easily reach, such as the Moon or Mars. Think of it as a real example of the shape-changing principle behind Professor Cho's Morphic research, applied to a large-scale manufacturing and construction system.", "This is robot vision research from the lab of Professor Lim Jong-woo in the Department of Mechanical Engineering. His team researches Visual SLAM, 3D scene reconstruction, and depth estimation — technology that lets a robot use cameras to understand the space around it.\n\nHere, we show research that uses footage of a real space to build a realistic 3D digital version of it. Cameras capture the environment from many positions and angles, and the system calculates the spatial relationships between images to reconstruct the location of walls, floors, and objects, and the overall shape of the space in 3D.\n\nA virtual robot can be placed inside this digital space to test its movement, perception, and learning. If Professor Lee Dong-jun's virtual simulation is a robot's 'training ground,' this can be understood as the technology that builds the actual 3D map of a real space to use in that training ground. It's research that turns a real-world space into digital information a robot can understand and use.", "This is medical-robotics research from the lab of Professor Han Kyung-won in the Department of Mechanical Engineering. Her team researches soft actuators, sensors, implantable devices, and haptic technology that can be used in surgery, treatment, and rehabilitation.\n\nOn display here are medical-robotics research focused on the heart and blood flow, along with a heart-simulation test rig used to verify it. A representative project, e-VaC, is a device that wraps around a blood vessel with a soft actuator and applies pressure in time with the heartbeat to support blood flow and heart function. Devices like this need flexible materials and sensors that can move along with human tissue.\n\nThe heart-simulation rig next to it recreates the conditions of a beating heart and flowing blood, so researchers can repeatedly test how the developed sensors and actuators perform. The team also researches haptic technology that conveys the sense of force and touch a person feels with their hands. What's here shows how sensing, decision-making, and actuation — the core technologies of Physical AI — connect all the way to the human body and into healthcare.", "That covers a selection of the research currently underway at the SNU Robotics Institute. From flexible robot structures and sensors, wearable robots, and robot hands and grippers, to robots that learn from human demonstration, robots that train in virtual environments, robots that recognize their surroundings and objects, robots that change shape to build structures on site, and soft robots used in healthcare — a wide range of research comes together in one place.\n\nThese research areas connect naturally under the idea of Physical AI. For a robot to act in the real world, it needs to perceive its surroundings and people, decide what to do, move its own body based on what it's learned, and safely deliver force to objects and people. The SNU Robotics Institute connects the expertise of about 80 professors to research these technologies together.\n\nThrough the NRL 2.0 program, this research will continue for up to ten years, alongside growing industry partnerships, technology commercialization, and startup support. In about two years, the Institute plans to move into a newly built, independent research space, developing into a Physical AI hub where research, industry, and startups are connected.\n\nThat brings us to the end of the SNU Robotics Institute tour. If you have any questions about the research you've seen today, or about the Institute itself, please feel free to ask. Thank you for joining us."]}, "short": {"ko": ["안녕하세요. 오늘 서울대학교 로보틱스연구소 투어를 안내해 드릴 ○○○입니다. 저는 현재 로보틱스연구소에서 ○○○ 업무를 담당하고 있고요. 먼저 연구소에 대해 간단히 소개해 드린 다음, 이 공간에서 현재 진행하고 있는 주요 연구를 몇 가지 설명해 드리겠습니다.\n\n서울대학교 로보틱스연구소는 로보틱스를 중심으로 서울대학교의 다양한 연구역량을 연결하는 융합연구 거점입니다. 기계공학, 전기정보공학, 컴퓨터공학, 재료공학을 비롯해 의학과 바이오 등 다양한 분야의 교수 80여 명이 직·간접적으로 참여하고 있습니다. 이 가운데 41명의 교수님이 2026년 선정된 국가연구소, NRL 2.0 과제에 직접 참여하고 있습니다. 연간 약 100억 원 규모의 국가 연구지원을 기반으로 최대 10년간 장기적인 연구를 수행하게 됩니다.\n\n연구소가 지향하는 핵심 방향은 '인간 중심의 Physical AI'입니다. 인공지능이 로봇의 몸을 통해 실제 환경을 인식하고 판단하며 직접 움직이고 사람과 상호작용할 수 있도록 하는 기술입니다. 이를 위해 로봇의 소재와 구조, 센서, 비전, 제어, 인공지능과 학습 등 서로 다른 분야의 연구진이 함께 연구하고 있습니다. 연구성과를 기업과의 산학협력과 기술사업화로 연결하고, Physical AI 분야의 유망 기술과 스타트업을 발굴·육성하는 역할도 함께 추진하고 있습니다.\n\n2026년 8월 18일에는 로보틱스 국가연구소 개소식을 갖고 본격적인 연구를 시작했습니다. 현재 건물 뒤쪽에는 새로운 로보틱스연구소 건물을 위한 부지를 확보하고 인허가도 완료한 상태입니다. 약 2년 후에는 독립된 연구공간으로 이전해 연구와 실험, 산학협력, 기술사업화와 창업보육이 함께 이루어지는 Physical AI 연구거점으로 확대할 계획입니다.", "이곳은 서울대학교 기계공학부 안성훈 교수님 연구팀의 로봇입니다. 안성훈 교수님 연구팀은 스마트 재료와 복합재료, 소프트 로봇, 센서와 구동기, 3D 프린팅 등 재료와 설계, 제조기술을 연결해 새로운 형태의 로봇과 구조물을 연구하고 있습니다.\n\n이곳에 있는 로봇은 코끼리 코처럼 여러 개의 마디가 연속적으로 연결된 유연한 분절형 로봇입니다. 여러 부분이 함께 움직이면서 전체적인 형상을 바꾸고, 물체의 형태에 맞춰 주변을 감싸는 방식으로 잡을 수 있습니다. 로봇의 재료와 구조 자체를 적극적으로 활용해 유연한 움직임을 만들어내는 연구라고 생각하시면 이해하기 쉽습니다.\n\n안성훈 교수님 연구팀은 형상기억합금과 직물구조를 결합해 굽힘과 비틀림을 만들어내는 소프트 구동기, 초경량 탄소섬유 구조를 적용한 로봇 팔 등도 연구하고 있습니다. 이곳에는 이러한 연구 가운데 유연한 구조를 이용해 로봇이 물체와 상호작용하는 사례가 전시되어 있습니다.", "이곳은 서울대학교 기계공학부 박종우 교수님 연구팀의 로봇 학습 연구입니다. 박종우 교수님 연구팀은 로봇의 움직임과 제어, 물체 조작 등을 연구하고 있으며, 최근에는 인공지능과 데이터 기반 학습기술을 적극적으로 결합하고 있습니다.\n\n이곳에서는 사람이 로봇을 원격으로 조작하면서 작업을 가르치는 과정을 보여드립니다. 사람이 로봇을 직접 움직여 물체를 잡고 옮기는 작업을 수행하면 로봇은 팔을 어떻게 움직였는지, 어느 위치에서 물체를 잡았는지, 어떤 순서로 작업했는지를 데이터로 얻습니다. 이러한 데이터를 반복적으로 학습하면서 로봇이 작업을 수행할 수 있도록 만드는 방식입니다.\n\nPhysical AI에서는 이런 실제 행동 데이터가 중요합니다. 이미지나 텍스트와 함께 로봇이 실제 공간에서 움직이고 물체와 접촉하는 데이터가 필요하기 때문입니다. 이곳은 사람이 로봇에게 좋은 행동의 예를 보여주고, 그 과정에서 로봇이 학습할 수 있는 데이터를 만드는 연구를 다루는 공간입니다.", "이곳은 서울대학교 기계공학부 박용래 교수님 연구팀의 센서 기술입니다. 박용래 교수님 연구팀은 사람의 피부처럼 부드럽고 유연하게 휘어지고 늘어날 수 있는 소프트 센서와 로봇을 연구하고 있습니다.\n\n여기에는 두 가지 기술이 전시되어 있습니다. 하나는 로봇 손끝에서 힘을 측정하는 3축 포스센서이고, 다른 하나는 사람의 손동작을 측정하는 액체금속 기반 장갑입니다. 포스센서는 로봇이 물체를 잡았을 때 어느 방향으로 어느 정도의 힘이 발생하는지를 측정합니다. 사람이 손끝의 감각으로 물건을 잡는 힘을 조절하는 것처럼 로봇에게 물리적인 감각을 만들어주는 기술입니다.\n\n액체금속 장갑은 사람이 손가락을 움직이면 장갑 안의 유연한 센서가 그 움직임을 측정합니다. 사람이 어떻게 손가락을 움직이고 물체를 잡는지를 데이터로 만들 수 있기 때문에 로봇 손의 학습이나 사람-로봇 인터페이스에도 활용할 수 있습니다. 하나는 사람의 움직임을 로봇이 읽도록 만들고, 다른 하나는 로봇이 물체와 접촉하는 힘을 느끼도록 만드는 기술이라고 생각하시면 됩니다.", "이 안쪽에도 여러 교수님과 연구팀의 연구공간이 이어져 있습니다. 웨어러블 로봇과 로봇 비전, 가상환경을 이용한 로봇 학습, 실제 공간을 3차원 디지털 환경으로 만드는 기술, 의료용 소프트 로봇 등 다양한 Physical AI 연구가 진행되고 있습니다.\n\n로봇이 실제 환경에서 사람과 함께 활동하려면 여러 기술이 함께 필요합니다. 주변 환경과 물체를 볼 수 있어야 하고, 공간을 이해해야 하며, 다양한 상황에서 어떤 행동을 해야 하는지도 학습해야 합니다. 사람의 몸에 착용하거나 의료 분야에 활용할 때는 사람과 안전하게 상호작용할 수 있는 센서와 유연한 구동기술도 필요합니다.\n\n현재 이 안쪽 공간에서는 이러한 기술과 관련된 여러 연구가 실제로 진행되고 있습니다. 진행 중인 연구와 실험이 포함되어 있어 이번 투어에서는 내부까지 들어가지는 않고, 서울대학교의 다양한 연구진이 Physical AI의 인지와 학습, 시뮬레이션, 웨어러블과 의료 응용까지 폭넓게 연구하고 있다는 정도로 소개드리겠습니다.", "이 안쪽에도 여러 교수님과 연구팀의 연구공간이 이어져 있습니다. 웨어러블 로봇과 로봇 비전, 가상환경을 이용한 로봇 학습, 실제 공간을 3차원 디지털 환경으로 만드는 기술, 의료용 소프트 로봇 등 다양한 Physical AI 연구가 진행되고 있습니다.\n\n로봇이 실제 환경에서 사람과 함께 활동하려면 여러 기술이 함께 필요합니다. 주변 환경과 물체를 볼 수 있어야 하고, 공간을 이해해야 하며, 다양한 상황에서 어떤 행동을 해야 하는지도 학습해야 합니다. 사람의 몸에 착용하거나 의료 분야에 활용할 때는 사람과 안전하게 상호작용할 수 있는 센서와 유연한 구동기술도 필요합니다.\ 있습니다. 저희 연구소는 이 역량을 인간 중심의 Physical AI라는 방향으로 연결하고, 연구성과가 산학협력과 기술사업화, 새로운 스타트업으로 이어질 수 있는 연구·산업 생태계를 만들어가고 있습니다.\n\n이상으로 간단한 투어를 마치겠습니다. 오늘 보신 연구나 저희 연구소에 대해 궁금하신 점이 있으시면 편하게 질문해 주시면 설명드리겠습니다. 감사합니다."], "en": ["Hello, I'm ___, and I'll be guiding today's tour of the Robotics Institute at Seoul National University. I currently work here at the Institute in the ___ team. I'll start with a short introduction to the Institute, and then walk you through a few of the main research projects going on in this space.\n\nThe SNU Robotics Institute is a hub that connects robotics research from across many different fields at Seoul National University. About 80 professors take part, directly or indirectly, from areas like mechanical engineering, electrical and computer engineering, computer science, and materials science, as well as medicine and biology. Of these, 41 professors are directly involved in a national research program called NRL 2.0, selected in 2026. It comes with about 10 billion won in government funding each year, for research that can run for up to ten years.\n\nThe Institute's main focus is what we call 'human-centered Physical AI.' That means building AI that can sense its surroundings, make decisions, and physically move and interact with people through a robot's body. To do this, researchers from many different fields work together — on a robot's materials and structure, sensors, computer vision, control systems, and AI and machine learning. The Institute also works to turn research results into industry partnerships and new technology, and to help promising Physical AI ideas grow into startups.\n\nOn August 18, 2026, we held the official opening ceremony for the national robotics institute and began this work in earnest. We've already secured land behind this building and completed the permits for a new, dedicated Robotics Institute building. In about two years, we plan to move into that independent space, where research, industry partnerships, technology commercialization, and startup support will all happen together.", "This is a robot from the lab of Professor Ahn Seung-hoon in the Department of Mechanical Engineering. His team connects materials, design, and manufacturing to build robots and structures with new capabilities — using smart materials, composite materials, soft robots, sensors and actuators, and 3D printing.\n\nThe robot you see here is a flexible, segmented robot, a bit like an elephant's trunk, made of many joints connected in a row. The different sections move together to change the overall shape, letting it wrap around an object to grip it. Think of this as research into how flexible a robot can be, by using the robot's own material and structure to create movement.\n\nProfessor Ahn's team also works on soft actuators that combine shape-memory alloy — a metal that returns to a set shape when heated — with fabric structures, and on ultra-lightweight robot arms built from carbon-fiber structures. What's here is one example of how a flexible structure lets a robot interact with objects.", "This is robot-learning research from the lab of Professor Park Jong-woo in the Department of Mechanical Engineering. His team studies robot motion, control, and object manipulation, and has recently been combining this with AI and data-driven learning methods.\n\nHere, we show how a person can teach a robot a task by controlling it remotely. When a person moves the robot to pick up and move an object, the robot records how the arm moved, where it grabbed the object, and in what order the steps happened. By learning from this data repeatedly, the robot becomes able to perform the task on its own.\n\nThis kind of real-world action data matters a lot for Physical AI, since robots need data not just from images and text, but from actually moving and touching objects in physical space. This is a space where a person demonstrates good examples of a task, and the robot turns that into data it can learn from.", "This is sensor technology from the lab of Professor Park Yong-rae in the Department of Mechanical Engineering. His team works on soft sensors and robots that can bend and stretch, much like human skin.\n\nTwo technologies are on display here. One is a 3-axis force sensor that measures the force at a robot's fingertip. The other is a glove based on liquid metal that measures how a person's fingers move. The force sensor measures how much force is applied, and in which direction, when a robot grips something — giving the robot a physical sense of touch, similar to how we adjust our grip using the feeling in our fingertips.\n\nThe liquid-metal glove works the other way around: when a person moves their fingers, a flexible sensor inside the glove tracks that movement. Because it can turn how a person moves their fingers and grips things into data, it's useful both for training robot hands and for human-robot interfaces. In short, one technology lets a robot 'read' human movement, and the other lets a robot 'feel' the force of touching an object.", "Further inside, there are more research spaces belonging to several other professors and teams. A wide range of Physical AI research is underway there — wearable robots, robot vision, robot learning in virtual environments, technology that turns real spaces into 3D digital environments, and soft robots for medical use.\n\nFor a robot to work alongside people in the real world, it needs many different technologies at once: it has to see its surroundings and objects, understand the space around it, and learn what to do in different situations. For robots that are worn on the body or used in medicine, it also needs sensors and flexible actuators that can interact safely with people.\n\nSeveral ongoing research projects related to these technologies are actually running inside that space right now. Because active research and experiments are taking place there, we won't go inside on this tour — but it's worth knowing that SNU researchers are working broadly across Physical AI, from perception and learning to simulation, wearable robots, and medical applications.", "Further inside, there are more research spaces belonging to several other professors and teams. A wide range of Physical AI research is underway there — wearable robots, robot vision, robot learning in virtual environments, technology that turns real spaces into 3D digital environments, and soft robots for medical use.\n\nFor a robot to work alongside people in the real world, it needs many different technologies at once: it has to see its surroundings and objects, understand the space around it, and learn what to do in different situations. For robots that are worn on the body or used in medicine, it also needs sensors and flexible actuators that can interact safely with people.\n\nSeveral ongoing research projects related to these technologies are actually running inside that space right now. Because active research and experiments are taking place there, we won't go inside on this tour — but it's worth knowing that SNU researchers are working broadly across Physical AI, from perception and learning to simulation, wearable robots, and medical applications.", "This area belongs to Professor Cho Kyu-jin, who also directs the Robotics Institute, in the Department of Mechanical Engineering. His team works on soft robots, wearable robots, biomimetic robots — robots inspired by living things — and shape-changing robots based on the principles of origami.\n\nThe 'Morphic' research here is about robots whose bodies or parts can change shape to fit different tasks or environments. Sometimes this means observing how living creatures move or are built and applying that to a robot; other times, it means using the folding and unfolding of origami so a robot can stay small while it's stored or moving, then unfold to full size when it needs to do something.\n\nNotable examples include a robot that mimics how a water strider jumps on the surface of water, a flying robot based on how a ladybug folds and unfolds its wings, and a shape-changing wheel that can support the weight of a one-ton vehicle. You can think of this as research where the robot's body and structure themselves change to fit the environment and create the function that's needed.", "This is also robot hand and gripper research from Professor Cho Kyu-jin's team. On display here is a robot hand driven by tendons — essentially wires — that let it move many joints, much like a human hand.\n\nIn a human hand, force created in the muscles travels to the fingers through tendons. Robots can use a similar idea: instead of placing a motor at every finger joint, the motor sits somewhere else, and a wire carries the force to the fingers. This lets a robot hand with many moving parts stay relatively small and light, while still gripping with enough force.\n\nThe team also works on a variety of grippers — from ones that grip objects of different sizes and shapes securely, to ones that can pick up several objects in a row and carry them all at once. They're currently developing a new type of robot hand that combines tendon-driven movement with other approaches. Ultimately, Professor Park Yong-rae's sensors, Professor Park Jong-woo's robot-learning methods, and AI all connect with this kind of robot hand — building toward a Physical AI system that can see, decide, and grasp real objects.", "Further inside, there are more research spaces belonging to several other professors and teams. A wide range of Physical AI research is underway there — wearable robots, robot vision, robot learning in virtual environments, technology that turns real spaces into 3D digital environments, and soft robots for medical use.\n\nFor a robot to work alongside people in the real world, it needs many different technologies at once: it has to see its surroundings and objects, understand the space around it, and learn what to do in different situations. For robots that are worn on the body       lengthShortNames: {short:"15분", medium:"30분", long:"60분"},
      stepLabel: "단계",
      downloadBtn: "대본 다운로드",

      needNameEmail: "Please enter your name and email."
    }
  };

  var TARGET_MIN = { short: 15, medium: 30, long: 60 };
  var MODES = ['short','medium','long'];

  var state = {
    lang: 'ko',
    globalMode: 'long',
    stationMode: {},       // per-station override: {stationIndex: 'short'|'medium'|'long'}
    combine: false,
    sequence: [],          // array of station indices, in click order
    activeStation: null,   // last clicked station (single view mode)
    submitUrl: CONFIG.SUBMIT_URL || '',
    reviewer: { name:'', email:'' },
    editingStation: null
  };

  function effectiveMode(idx){
    return state.stationMode[idx] || state.globalMode;
  }

  // ---------- time estimation ----------
  var minutesCache = {}; // {lang: {mode: [14]}}
  function computeMinutesTable(mode, lang){
    minutesCache[lang] = minutesCache[lang] || {};
    if(minutesCache[lang][mode]) return minutesCache[lang][mode];
    var lens = SCRIPTS[mode][lang].map(function(t){ return t.length; });
    var total = lens.reduce(function(a,b){return a+b;}, 0) || 1;
    var target = TARGET_MIN[mode];
    var table = lens.map(function(l){ return target * l / total; });
    minutesCache[lang][mode] = table;
    return table;
  }
  function minuteFor(idx, mode, lang){
    // proportional share of the target length, plus a flat 20-second
    // buffer per zone for walking/transition/Q&A overhead
    return computeMinutesTable(mode, lang)[idx] + (20/60);
  }

  function fmtMin(m){
    var r = Math.round(m*10)/10;
    if (Math.abs(r - Math.round(r)) < 0.05) return String(Math.round(r));
    return r.toFixed(1);
  }

  function sanitizeFilename(name){
    return name.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim();
  }

  function downloadTxt(filename, content){
    var blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function downloadSingleScript(idx){
    var mode = effectiveMode(idx);
    var lines = [
      stationLabel(idx),
      t('lengthNames')[mode],
      '',
      SCRIPTS[mode][state.lang][idx]
    ];
    var fname = sanitizeFilename(stationLabel(idx)) + ' (' + t('lengthShortNames')[mode] + ').txt';
    downloadTxt(fname, lines.join('\n'));
  }

  function downloadCombinedScript(){
    var lines = [t('combinedHead'), ''];
    state.sequence.forEach(function(idx, order){
      var mode = effectiveMode(idx);
      lines.push(t('stepLabel') + ' ' + (order+1) + ' — ' + stationLabel(idx) + ' (' + t('lengthShortNames')[mode] + ')');
      lines.push('');
      lines.push(SCRIPTS[mode][state.lang][idx]);
      lines.push('');
    });
    var fname = sanitizeFilename(t('combinedHead')) + '.txt';
    downloadTxt(fname, lines.join('\n'));
  }

  // ---------- rendering ----------
  var els = {};
  function cacheEls(){
    els.titleText = document.getElementById('titleText');
    els.subTag = document.getElementById('subTag');
    els.lengthSeg = document.getElementById('lengthSeg');
    els.langBtn = document.getElementById('langBtn');
    els.langLabel = document.getElementById('langLabel');
    els.combineBtn = document.getElementById('combineBtn');
    els.floorplanShell = document.getElementById('floorplanShell');
    els.badgeLayer = document.getElementById('badgeLayer');
    els.captionText = document.getElementById('captionText');
    els.seqHeading = document.getElementById('seqHeading');
    els.seqBody = document.getElementById('seqBody');
    els.listHeading = document.getElementById('listHeading');
    els.stationUl = document.getElementById('stationUl');
    els.scriptArea = document.getElementById('scriptArea');

    els.editOverlay = document.getElementById('editOverlay');
    els.editModalTitle = document.getElementById('editModalTitle');
    els.editCloseBtn = document.getElementById('editCloseBtn');
    els.editCancelBtn = document.getElementById('editCancelBtn');
    els.editSendBtn = document.getElementById('editSendBtn');
    els.lblName = document.getElementById('lblName');
    els.lblEmail = document.getElementById('lblEmail');
    els.lblKo = document.getElementById('lblKo');
    els.lblEn = document.getElementById('lblEn');
    els.lblNote = document.getElementById('lblNote');
    els.noteHint = document.getElementById('noteHint');
    els.editName = document.getElementById('editName');
    els.editEmail = document.getElementById('editEmail');
    els.editKo = document.getElementById('editKo');
    els.editEn = document.getElementById('editEn');
    els.editNote = document.getElementById('editNote');
    els.editStatusMsg = document.getElementById('editStatusMsg');
  }

  function t(key){ return STR[state.lang][key]; }

  function stationLabel(i){
    return STATIONS[i][state.lang];
  }

  function renderStrings(){
    els.titleText.textContent = t('title');
    els.subTag.textContent = t('tag');
    els.captionText.textContent = t('caption');
    els.seqHeading.textContent = t('seqHeading');
    els.listHeading.textContent = t('listHeading');
    els.langLabel.textContent = state.lang === 'ko' ? 'KO' : 'EN';
    document.getElementById('combineBtn').querySelector('span:last-child').textContent = t('combineOn');
    document.documentElement.lang = state.lang;

    els.editModalTitle.textContent = t('editModalTitle');
    els.lblName.textContent = t('lblName');
    els.lblEmail.textContent = t('lblEmail');
    els.lblKo.textContent = t('lblKo');
    els.lblEn.textContent = t('lblEn');
    els.lblNote.textContent = t('lblNote');
    els.noteHint.textContent = t('noteHint');
    els.editCancelBtn.textContent = t('cancel');
    els.editSendBtn.textContent = t('send');
  }

  function renderLengthSeg(){
    els.lengthSeg.innerHTML = '';
    MODES.forEach(function(m){
      var b = document.createElement('button');
      b.textContent = t('lengthNames')[m];
      if(m === state.globalMode) b.className = 'active';
      b.addEventListener('click', function(){
        applyStandardPreset(m);
      });
      els.lengthSeg.appendChild(b);
    });
  }

  // applying the top-level length control loads that length's standard station set
  function applyStandardPreset(mode){
    state.globalMode = mode;
    state.stationMode = {};
    state.combine = true;
    state.sequence = STANDARD_SETS[mode].slice();
    state.activeStation = null;
    renderAll();
  }

  function renderCombineBtn(){
    els.combineBtn.classList.toggle('on', state.combine);
  }

  // build a small short/medium/long selector for one station; onChange(mode)
  function buildMiniSeg(idx, onChange){
    var wrap = document.createElement('div');
    wrap.className = 'segmented mini';
    var current = effectiveMode(idx);
    MODES.forEach(function(m){
      var b = document.createElement('button');
      b.textContent = t('lengthShortNames')[m];
      if(m === current) b.className = 'active';
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        state.stationMode[idx] = m;
        onChange && onChange();
        renderAll();
      });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function renderRooms(){
    var svg = els.floorplanShell.querySelector('svg');
    if(!svg) return;
    svg.querySelectorAll('.tour-room').forEach(function(g){
      var num = parseInt(g.getAttribute('data-room'), 10);
      g.classList.remove('room-active', 'room-selected');
      var inSeq = state.sequence.indexOf(num) !== -1;
      if(!state.combine && state.activeStation === num) g.classList.add('room-active');
      if(state.combine && inSeq) g.classList.add('room-selected');
    });

    // badges for combine-mode ordering
    els.badgeLayer.innerHTML = '';
    if(state.combine){
      state.sequence.forEach(function(idx, order){
        var rect = ROOM_RECTS[idx];
        if(!rect) return;
        var cx = (rect.x + rect.w/2) / PLAN_W * 100;
        var cy = rect.y / PLAN_H * 100;
        var badge = document.createElement('div');
        badge.className = 'order-badge-float';
        badge.style.left = cx + '%';
        badge.style.top = cy + '%';
        badge.textContent = order + 1;
        els.badgeLayer.appendChild(badge);
      });
    }
  }

  function wireRoomClicks(){
    var svg = els.floorplanShell.querySelector('svg');
    if(!svg) return;
    svg.querySelectorAll('.tour-room').forEach(function(g){
      g.addEventListener('click', function(){
        var num = parseInt(g.getAttribute('data-room'), 10);
        onPinClick(num);
      });
    });
  }

  function onPinClick(i){
    if(state.combine){
      var idx = state.sequence.indexOf(i);
      if(idx === -1) state.sequence.push(i);
      else state.sequence.splice(idx,1);
    } else {
      state.activeStation = i;
    }
    renderAll();
  }

  function renderStationList(){
    els.stationUl.innerHTML = '';

      (function(i){
        var li = document.createElement('li');

        var inSeq = state.sequence.indexOf(i) !== -1;
        if((!state.combine && state.activeStation===i) || (state.combine && inSeq)) b.className = 'active-station';
        var n = document.createElement('span'); n.className='n mono'; n.textContent = i;
        var lab = document.createElement('span'); lab.textContent = stationLabel(i);
        b.appendChild(n); b.appendChild(lab);
        b.addEventListener('click', function(){ onPinClick(i); });
        li.appendChild(b);
        els.stationUl.appendChild(li);
      })(i);
    }
  }

  function renderSequencePanel(){
    var body = els.seqBody;
    body.innerHTML = '';

    if(!state.combine){
      var p = document.createElement('div');
      p.className = 'seq-empty';
      p.textContent = t('pickHint');
      body.appendChild(p);
      return;
    }

    var total = state.sequence.reduce(function(sum, idx){
      return sum + minuteFor(idx, effectiveMode(idx), state.lang);
    }, 0);

    if(state.sequence.length === 0){
      var p2 = document.createElement('div');
      p2.className = 'seq-empty';
      p2.textContent = t('seqEmpty');
      body.appendChild(p2);
      return;

    totalEl.className = 'seq-total mono';
    totalEl.textContent = fmtMin(total) + ' ' + t('minUnit');
    body.appendChild(totalEl);

    var totalLabel = document.createElement('div');
    totalLabel.className = 'seq-total-label';
    totalLabel.textContent = t('seqTotalLabel');
    body.appendChild(totalLabel);

      var li = document.createElement('li');
      li.className = 'seq-item';

      var row1 = document.createElement('div'); row1.className = 'row1';
      var num = document.createElement('span'); num.className='num mono'; num.textContent = order+1;
      var label = document.createElement('span'); label.className='label';
      label.textContent = stationLabel(idx) + '  ·  ' + fmtMin(minuteFor(idx, effectiveMode(idx), state.lang)) + t('minUnit');
      var rm = document.createElement('button'); rm.className='remove'; rm.textContent='×';
      rm.addEventListener('click', function(){
        state.sequence.splice(order,1);
        renderAll();
      });
      row1.appendChild(num); row1.appendChild(label); row1.appendChild(rm);

      var row2 = document.createElement('div'); row2.className = 'row2';
      row2.appendChild(buildMiniSeg(idx));

      li.appendChild(row1); li.appendChild(row2);
      ul.appendChild(li);
    });
    body.appendChild(ul);

    var clearBtn = document.createElement('button');
    clearBtn.className = 'clear-btn mono';
    clearBtn.textContent = t('clearSeq');
    clearBtn.addEventListener('click', function(){
      state.sequence = [];
      renderAll();
    });
    body.appendChild(clearBtn);
  }

  function paragraphsToHtml(text){
    return text.split(/\n\n+/).map(function(p){
      var div = document.createElement('p');
      div.textContent = p;
      return div;
    });
  }

  function renderScriptArea(){
    var area = els.scriptArea;
    area.innerHTML = '';

    if(state.combine){
      if(state.sequence.length === 0){
        var empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = t('seqEmpty');
        area.appendChild(empty);
        return;
      }
      var head = document.createElement('div');
      head.className = 'script-head';
      var h2 = document.createElement('h2'); h2.textContent = t('combinedHead');
      var total = state.sequence.reduce(function(s,idx){return s+minuteFor(idx, effectiveMode(idx), state.lang);},0);
      var timeRowC = document.createElement('div');
      timeRowC.className = 'script-time-row';
      var time = document.createElement('div'); time.className='script-time mono';
      time.textContent = '≈ ' + fmtMin(total) + ' ' + t('minUnit');
      var dlBtnC = document.createElement('button');
      dlBtnC.className = 'edit-request-btn';
      dlBtnC.textContent = t('downloadBtn');
      dlBtnC.addEventListener('click', downloadCombinedScript);
      timeRowC.appendChild(time);
      timeRowC.appendChild(dlBtnC);
      head.appendChild(h2); head.appendChild(timeRowC);
      area.appendChild(head);

      var body = document.createElement('div');
      body.className = 'script-body';
      state.sequence.forEach(function(idx, order){
        var div = document.createElement('div');
        div.className = 'script-divider';
        var lineEl = document.createElement('div'); lineEl.className='line';
        var lab = document.createElement('div'); lab.className='lab mono';
        lab.textContent = t('stepLabel') + ' ' + (order+1) + ' — ' + stationLabel(idx);
        var miniSeg = buildMiniSeg(idx);
        var editBtn2 = document.createElement('button');
        editBtn2.className = 'edit-request-btn';
        editBtn2.textContent = t('editReq');
        editBtn2.addEventListener('click', function(){ openEditModal(idx); });
        div.appendChild(lineEl); div.appendChild(lab); div.appendChild(miniSeg); div.appendChild(editBtn2);
        body.appendChild(div);
        var paras = paragraphsToHtml(SCRIPTS[effectiveMode(idx)][state.lang][idx]);
        paras.forEach(function(p){ body.appendChild(p); });
      });
      area.appendChild(body);
      return;
    }

    if(state.activeStation === null){
      var empty2 = document.createElement('div');
      empty2.className = 'empty-state';
      empty2.textContent = t('pickHint');
      area.appendChild(empty2);
      return;
    }

    var idx = state.activeStation;
    var mode = effectiveMode(idx);
    var head2 = document.createElement('div');
    head2.className = 'script-head';
    var h22 = document.createElement('h2'); h22.textContent = stationLabel(idx);

    var timeRow = document.createElement('div');
    timeRow.className = 'script-time-row';
    var time2 = document.createElement('div'); time2.className='script-time mono';
    time2.textContent = '≈ ' + fmtMin(minuteFor(idx, mode, state.lang)) + ' ' + t('minUnit');
    var miniSeg2 = buildMiniSeg(idx);
    var dlBtn = document.createElement('button');
    dlBtn.className = 'edit-request-btn';
    dlBtn.textContent = t('downloadBtn');
    dlBtn.addEventListener('click', function(){ downloadSingleScript(idx); });
    var editBtn = document.createElement('button');
    editBtn.className = 'edit-request-btn';
    editBtn.textContent = t('editReq');
    editBtn.addEventListener('click', function(){ openEditModal(idx); });
    timeRow.appendChild(time2);
    timeRow.appendChild(miniSeg2);
    timeRow.appendChild(dlBtn);
    timeRow.appendChild(editBtn);

    head2.appendChild(h22); head2.appendChild(timeRow);
    area.appendChild(head2);

    var body2 = document.createElement('div');
    body2.className = 'script-body';
    paragraphsToHtml(SCRIPTS[mode][state.lang][idx]).forEach(function(p){ body2.appendChild(p); });
    area.appendChild(body2);
  }

  // ---------- edit request modal ----------
  function openEditModal(stationIdx){
    state.editingStation = stationIdx;
    var mode = effectiveMode(stationIdx);
    els.editStatusMsg.textContent = '';
    els.editStatusMsg.className = 'status-msg';
    els.editName.value = state.reviewer.name || '';
    els.editEmail.value = state.reviewer.email || '';
    els.editKo.value = SCRIPTS[mode]['ko'][stationIdx];
    els.editEn.value = SCRIPTS[mode]['en'][stationIdx];
    els.editNote.value = '';
    els.editModalTitle.textContent = t('editModalTitle') + ' · ' + STATIONS[stationIdx][state.lang];
    els.editSendBtn.disabled = false;
    els.editOverlay.classList.add('show');
  }
  function closeEditModal(){
    els.editOverlay.classList.remove('show');
  }

  function submitViaFetch(fields, targetUrl){
    var body = new URLSearchParams();
    Object.keys(fields).forEach(function(k){
      body.append(k, fields[k] == null ? '' : String(fields[k]));
    });
    return fetch(targetUrl, {
      method: 'POST',
      mode: 'cors',
      body: body
    }).then(function(res){
      if(!res.ok){
        throw new Error('HTTP ' + res.status);
      }
      return res.text();
    });
  }

  function handleEditSend(){
    var name = els.editName.value.trim();
    var email = els.editEmail.value.trim();

    if(!state.submitUrl){
      els.editStatusMsg.textContent = t('needCfg');
      els.editStatusMsg.className = 'status-msg err';
      return;
    }
    if(!name || !email){
      els.editStatusMsg.textContent = t('needNameEmail');
      els.editStatusMsg.className = 'status-msg err';
      return;
    }

    state.reviewer = { name:name, email:email };

    var idx = state.editingStation;
    var mode = effectiveMode(idx);
    var fields = {
      timestamp: new Date().toISOString(),
      stationId: idx,
      stationLabelKo: STATIONS[idx].ko,
      stationLabelEn: STATIONS[idx].en,
      mode: mode,
      name: name,
      email: email,
      originalKo: SCRIPTS[mode]['ko'][idx],
      editedKo: els.editKo.value,
      originalEn: SCRIPTS[mode]['en'][idx],
      editedEn: els.editEn.value,
      note: els.editNote.value
    };

    els.editSendBtn.disabled = true;
    els.editStatusMsg.textContent = t('sending');
    els.editStatusMsg.className = 'status-msg';

    submitViaFetch(fields, state.submitUrl).then(function(){
      els.editStatusMsg.textContent = t('sentOk');
      els.editStatusMsg.className = 'status-msg ok';
      els.editSendBtn.disabled = false;
      setTimeout(closeEditModal, 900);
    }).catch(function(err){
      var detail = (err && err.message) ? ' (' + err.message + ')' : '';
      els.editStatusMsg.textContent = t('sendFailed') + detail;
      els.editStatusMsg.className = 'status-msg err';
      els.editSendBtn.disabled = false;
    });
  }

  function renderAll(){
    renderStrings();
    renderLengthSeg();
    renderCombineBtn();
    renderRooms();
    renderStationList();
    renderSequencePanel();
    renderScriptArea();
  }

  function wireStaticControls(){
    els.langBtn.addEventListener('click', function(){
      state.lang = state.lang === 'ko' ? 'en' : 'ko';
      renderAll();
    });
    els.combineBtn.addEventListener('click', function(){
      state.combine = !state.combine;
      renderAll();
    });

    els.editCloseBtn.addEventListener('click', closeEditModal);
    els.editCancelBtn.addEventListener('click', closeEditModal);
    els.editSendBtn.addEventListener('click', handleEditSend);
    els.editOverlay.addEventListener('click', function(e){ if(e.target === els.editOverlay) closeEditModal(); });

    wireRoomClicks();
  }

  document.addEventListener('DOMContentLoaded', function(){
    cacheEls();
    wireStaticControls();
    renderAll();
  });
})();

</script>
</body>
</html>
